<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="571" height="300" viewBox="0 0 571 300">
  <!-- Fond gris clair -->
  <rect x="0" y="0" width="571" height="300" fill="#E0E5EB"/>

  <!-- Panneau blanc : coins arrondis R=20, marge 4px autour de la grille -->
  <rect x="162" y="26.5" width="247" height="247" rx="20" ry="20" fill="#F9FAF8"/>

  <!-- ===== Grille 3x3 : carrés 77x77, gouttière 4px, marge 4px ===== -->

  <!-- Ligne du haut -->
  <!-- Carré haut-gauche : coin supérieur-gauche arrondi (r=16) -->
  <path d="M182 30.5
           H243 V107.5 H166 V46.5
           A16 16 0 0 1 182 30.5 Z"
        fill="#B49E3A"/>
  <!-- Carré haut-centre : coins droits -->
  <rect x="247" y="30.5" width="77" height="77" fill="#878787"/>
  <!-- Carré haut-droite : coin supérieur-droit arrondi (r=16) -->
  <path d="M405 30.5
           V107.5 H328 V30.5
           H389
           A16 16 0 0 1 405 46.5 Z"
        fill="#878787"/>

  <!-- Ligne du milieu -->
  <rect x="166" y="111.5" width="77" height="77" fill="#B49E3A"/>
  <rect x="247" y="111.5" width="77" height="77" fill="#02CC03"/>
  <rect x="328" y="111.5" width="77" height="77" fill="#878787"/>

  <!-- Ligne du bas -->
  <!-- Carré bas-gauche : coin inférieur-gauche arrondi (r=16) -->
  <path d="M166 192.5
           V253.5
           A16 16 0 0 0 182 269.5
           H243 V192.5 Z"
        fill="#02CC03"/>
  <rect x="247" y="192.5" width="77" height="77" fill="#02CC03"/>
  <!-- Carré bas-droite : coin inférieur-droit arrondi (r=16) -->
  <path d="M328 192.5
           V269.5
           H389
           A16 16 0 0 0 405 253.5
           V192.5 Z"
        fill="#02CC03"/>

  <!-- ===== Lettres centrées dans chaque carré ===== -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="36"
     font-weight="bold"
     text-anchor="middle"
     dominant-baseline="central"
     fill="#FFFFFF">

    <!-- Ligne du haut -->
    <text x="204.5" y="69">M</text>
    <text x="285.5" y="69">E</text>
    <text x="366.5" y="69">T</text>

    <!-- Ligne du milieu -->
    <text x="204.5" y="150">T</text>
    <text x="285.5" y="150">P</text>
    <text x="366.5" y="150">E</text>

    <!-- Ligne du bas -->
    <text x="204.5" y="231">M</text>
    <text x="285.5" y="231">O</text>
    <text x="366.5" y="231">T</text>
  </g>
</svg>