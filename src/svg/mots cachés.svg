<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="571" height="300"
     viewBox="0 0 571 300">

  <!-- Fond rouge sur tout le rectangle -->
  <rect x="0" y="0" width="571" height="300" fill="#c6202e"/>

  <!-- Carré source réduit à 240x240, centré, marges 30px haut/bas -->
  <g transform="translate(165.5, 30) scale(0.4)">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 600 600"
         width="600" height="600"
         role="img"
         aria-labelledby="titre desc">
      <title id="titre">Mots cachés</title>
      <desc id="desc">Carré 6×6 de lettres « motscachés » répété. Le mot « MOTS » est écrit en de grandes lettres verticales abaissées de 5px, centré dans une bannière opaque diagonale de 750px de long.</desc>

      <rect x="0" y="0" width="600" height="600" fill="#c6202e"/>

      <g fill="#ffffff"
         font-family="Arial, Helvetica, sans-serif"
         font-weight="bold"
         font-size="70"
         text-anchor="middle"
         dominant-baseline="middle">
        <text x="50"  y="50">m</text><text x="150" y="50">o</text><text x="250" y="50">t</text>
        <text x="350" y="50">s</text><text x="450" y="50">c</text><text x="550" y="50">a</text>

        <text x="50"  y="150">c</text><text x="150" y="150">h</text><text x="250" y="150">é</text>
        <text x="350" y="150">s</text><text x="450" y="150">m</text><text x="550" y="150">o</text>

        <text x="50"  y="250">t</text><text x="150" y="250">s</text><text x="250" y="250">c</text>
        <text x="350" y="250">a</text><text x="450" y="250">c</text><text x="550" y="250">h</text>

        <text x="50"  y="350">é</text><text x="150" y="350">s</text><text x="250" y="350">m</text>
        <text x="350" y="350">o</text><text x="450" y="350">t</text><text x="550" y="350">s</text>

        <text x="50"  y="450">c</text><text x="150" y="450">a</text><text x="250" y="450">c</text>
        <text x="350" y="450">h</text><text x="450" y="450">é</text><text x="550" y="450">s</text>

        <text x="50"  y="550">m</text><text x="150" y="550">o</text><text x="250" y="550">t</text>
        <text x="350" y="550">s</text><text x="450" y="550">c</text><text x="550" y="550">a</text>
      </g>

      <rect x="-75" y="247.5" width="750" height="105" rx="52.5" ry="52.5"
            fill="#c6202e"
            stroke="#ffffff"
            stroke-width="24"
            transform="rotate(45 300 300)"/>

      <g fill="#ffffff"
         font-family="Arial, Helvetica, sans-serif"
         font-weight="bold"
         font-size="85"
         text-anchor="middle"
         dominant-baseline="middle"
         transform="rotate(45 300 300)">
        <text x="20"  y="305" transform="rotate(-45 20 305)">M</text>
        <text x="210" y="305" transform="rotate(-45 210 305)">O</text>
        <text x="390" y="305" transform="rotate(-45 390 305)">T</text>
        <text x="580" y="305" transform="rotate(-45 580 305)">S</text>
      </g>
    </svg>
  </g>
</svg>