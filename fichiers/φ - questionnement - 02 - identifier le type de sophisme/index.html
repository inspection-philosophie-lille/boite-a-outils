<!DOCTYPE html>
<!-- Daniel Boulagnon - version 2025 - Code complet "apparier" -->
<html lang="fr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="icon" href="../../src/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title id="pageTabTitle">application « apparier »</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Muli', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      overflow-x: hidden;
    }
    .main-wrapper { width: 100%; margin: 0; display: flex; flex-direction: column; align-items: center; }
    .title-wrapper, .container, .button-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; }
    .title-wrapper { flex-direction: column; }
    .button-wrapper { gap: 1rem; margin: 0; }
    .title { margin: 2vh 0; line-height: 1.5; text-align: center; color: red; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: bold; }
    .subtitle { margin: 0; line-height: 1.2; text-align: center; color: black; font-size: clamp(1rem, 3vw, 1.2rem); }
    .container { flex-direction: row; position: relative; margin: 0; max-width: 100%; gap: 2rem; }
    .column { min-width: 0; }
    .column.left { flex: 0 0 auto; }
    .column.right { flex: 1; }
    #repereTable { width: max-content; } #definitionTable { width: 100%; }
    table { border-collapse: separate; border-spacing: 0.5rem; }
    td {
      border-radius: 0.5rem;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      background-color: #e0e0e0;
      box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      word-wrap: break-word;
    }
    td:active:not(.used) { background-color: #c0c0c0; box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff; }
    td.used { background-color: #d0d0d0; cursor: not-allowed; box-shadow: none; }
    td:not(.used):hover { background-color: #d1d1d1; box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    button {
      margin: 2vh 0; padding: 0.5rem 1rem; font-size: clamp(0.9rem, 2.5vw, 1rem);
      line-height: 1; cursor: pointer; width: min(120px, 30vw); height: min(50px, 12vw);
      display: flex; align-items: center; justify-content: center; background-color: #e0e0e0;
      border: none; border-radius: 0.5rem; transition: all 0.3s ease;
      box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
      position: relative;
    }
    button:disabled { background-color: #d0d0d0; cursor: not-allowed; box-shadow: none; }
    button:hover:not(:disabled) { background-color: #d1d1d1; box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff; }
    button:active:not(:disabled) { background-color: #c0c0c0; box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff; }
    .reload-icon { font-size: clamp(1.5rem, 4vw, 2rem); color: red; line-height: normal; transform: translateY(-0.15rem); }
    .tooltip {
      position: absolute; background-color: white; color: black; padding: 5px 10px;
      border-radius: 4px; font-size: 0.9rem; white-space: nowrap; z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.2s ease; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    button:hover .tooltip { opacity: 1; }
    button .tooltip { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 5px; }
    @media (max-width: 768px) {
      .container { flex-direction: column; gap: 0.5rem; max-width: 100%; }
      .column { width: 100%; display: flex; justify-content: center; }
      .column.left, .column.right { flex: 1; }
      #repereTable, #definitionTable { width: 100%; max-width: 90%; margin: 0 auto; max-height: 35vh; overflow-y: auto; }
      #definitionTable { max-height: 40vh; }
      td { padding: 0.4rem; font-size: clamp(0.8rem, 2.5vw, 0.9rem); }
      button { margin: 0.5vh 0; width: calc((100% - 1rem) / 2); height: min(40px, 10vw); padding: 0.15rem 0.3rem; font-size: clamp(1rem, 3vw, 1.2rem); }
      .button-wrapper { gap: 1rem; flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: center; width: 90%; max-width: 100%; }
      .tooltip { font-size: 0.75rem; padding: 3px 6px; }
    }
    @media (max-width: 480px) {
      .title { font-size: clamp(1.5rem, 4vw, 2rem); }
      .subtitle { font-size: clamp(0.8rem, 2.5vw, 1rem); }
      td { padding: 0.2rem; font-size: clamp(0.7rem, 2vw, 0.8rem); }
      button { margin: 0.5vh 0; width: calc((100% - 1rem) / 2); height: min(40px, 10vw); padding: 0.1rem 0.2rem; font-size: clamp(0.8rem, 2.5vw, 1rem); }
      .button-wrapper { gap: 1rem; flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: center; width: 90%; max-width: 100%; }
      .container { margin: 0; width: 100%; max-width: 100%; justify-content: center; align-items: center; }
      #repereTable, #definitionTable { width: 100%; max-width: 90%; margin: 0 auto; }
      .tooltip { font-size: 0.65rem; padding: 2px 5px; }
    }
    @media (min-width: 769px) {
      .main-wrapper { display: flex; flex-direction: column; align-items: center; width: fit-content; margin: 0 auto; }
      .title-wrapper { width: fit-content; display: flex; flex-direction: column; align-items: center; margin: 0; }
      .button-wrapper { width: fit-content; display: flex; flex-direction: row; align-items: center; margin: 0; }
      .container { width: 100%; max-width: 90%; margin: 0 auto; }
      .column.left, .column.right { flex: 1; }
      #repereTable, #definitionTable { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="title-wrapper">
      <p class="title" id="pageTitle">application «&nbsp;apparier&nbsp;»</p>
      <p class="subtitle" id="pageSubtitle">associer un élément à un autre</p>
    </div>
    <div class="container">
      <div class="column left">
        <table id="repereTable"></table>
      </div>
      <div class="column right">
        <table id="definitionTable"></table>
      </div>
      <canvas id="lineCanvas"></canvas>
    </div>
    <div class="button-wrapper">
      <button id="actionButton" onclick="performAction()" disabled>
        vérifier
        <span class="tooltip">vérifier les associations</span>
      </button>
      <button id="scoreButton" disabled>
        0 / 0
        <span class="tooltip">score actuel (réponses correctes / total)</span>
      </button>
    </div>
  </div>
  <script src="fichier_ressource.js"></script>
  <script>
    let startX, startY, drawing = false;
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    const actionButton = document.getElementById('actionButton');
    const scoreButton = document.getElementById('scoreButton');
    let totalCorrect = 0;
    let totalAnswers = 0;
    const usedCells = new Set();
    let currentAction = "check";
    let currentRepere = null;
    let currentDefinition = null;
    let links = [];
    let selectedReperes = [];

    function loadTitleAndSubtitle() {
      if (typeof title !== 'undefined') document.getElementById('pageTitle').textContent = title;
      if (typeof subtitle !== 'undefined') document.getElementById('pageSubtitle').textContent = subtitle;
      if (typeof onglet !== 'undefined') document.getElementById('pageTabTitle').textContent = onglet;
    }
    function isVerticalLayout() { return window.innerWidth <= 768; }
    function getRandomElements(array, count) { const shuffled = array.slice().sort(() => 0.5 - Math.random()); return shuffled.slice(0, count); }

    // --- Correction : gestion des doublons pour chaque colonne :
    function loadReperes() {
      if (!argumentsData || !Array.isArray(argumentsData) || argumentsData.length === 0) {
        console.error("Erreur : argumentsData est indéfini ou vide");
        return [];
      }
      const repTable = document.getElementById('repereTable');
      const defTable = document.getElementById('definitionTable');
      repTable.innerHTML = '';
      defTable.innerHTML = '';
      const maxPairs = Math.min(5, argumentsData.length);
      const randomLeftElements = getRandomElements(argumentsData, maxPairs);
      const selectedPairs = randomLeftElements.map((leftElement, index) => ({
        colonne_de_gauche: leftElement.colonne_de_gauche,
        colonne_de_droite: leftElement.colonne_de_droite,
        id: index
      }));

      const shuffledNames = selectedPairs.map(part => part.colonne_de_gauche).sort(() => 0.5 - Math.random());
      const shuffledDefinitions = selectedPairs.map(part => part.colonne_de_droite).sort(() => 0.5 - Math.random());

      // Colonne de gauche avec gestion d'occurence
      shuffledNames.forEach((name, index) => {
        const occurrence = shuffledNames.slice(0, index).filter(n => n === name).length;
        const pair = selectedPairs.filter(part => part.colonne_de_gauche === name)[occurrence];
        const repRow = document.createElement('tr');
        const repCell = document.createElement('td');
        repCell.textContent = name;
        repCell.dataset.id = pair.id;
        repCell.dataset.index = index;
        repRow.appendChild(repCell);
        repTable.appendChild(repRow);
      });
      // Colonne de droite avec gestion d'occurence
      shuffledDefinitions.forEach((definition, index) => {
        const occurrence = shuffledDefinitions.slice(0, index).filter(n => n === definition).length;
        const pair = selectedPairs.filter(part => part.colonne_de_droite === definition)[occurrence];
        const defRow = document.createElement('tr');
        const defCell = document.createElement('td');
        defCell.textContent = definition;
        defCell.dataset.id = pair.id;
        defCell.dataset.index = index;
        defRow.appendChild(defCell);
        defTable.appendChild(defRow);
      });
      return selectedPairs;
    }
    function selectCell(event, type, info) {
      const cell = event.target;
      if (usedCells.has(cell)) return;
      const rect = cell.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const isVertical = isVerticalLayout();
      const totalCells = selectedReperes.length;
      if (type === 'repere') {
        const repereIndex = parseInt(cell.dataset.index);
        if (drawing && currentDefinition) {
          const repereRect = rect;
          const defRect = currentDefinition.cell.getBoundingClientRect();
          const startX = isVertical
            ? repereRect.left + (repereRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : repereRect.right - 5 - canvasRect.left;
          const startY = isVertical
            ? repereRect.bottom - 5 - canvasRect.top
            : repereRect.top + repereRect.height / 2 - canvasRect.top;
          const endX = isVertical
            ? defRect.left + (defRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : defRect.left + 5 - canvasRect.left;
          const endY = isVertical
            ? defRect.top + 5 - canvasRect.top
            : defRect.top + defRect.height / 2 - canvasRect.top;
          drawLink(startX, startY, endX, endY);
          links.push({
            repere: info,
            definition: currentDefinition.text,
            lineId: { startX, startY, endX, endY },
            id: cell.dataset.id,
          });
          usedCells.add(cell);
          usedCells.add(currentDefinition.cell);
          cell.classList.add('used');
          currentDefinition.cell.classList.add('used');
          resetDrawing();
          actionButton.disabled = links.length !== selectedReperes.length;
        } else {
          drawing = true;
          currentRepere = { info, cell };
          currentDefinition = null;
        }
      } else if (type === 'definition') {
        if (drawing && currentRepere) {
          const repereRect = currentRepere.cell.getBoundingClientRect();
          const defRect = rect;
          const repereIndex = parseInt(currentRepere.cell.dataset.index);
          const startX = isVertical
            ? repereRect.left + (repereRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : repereRect.right - 5 - canvasRect.left;
          const startY = isVertical
            ? repereRect.bottom - 5 - canvasRect.top
            : repereRect.top + repereRect.height / 2 - canvasRect.top;
          const endX = isVertical
            ? defRect.left + (defRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : defRect.left + 5 - canvasRect.left;
          const endY = isVertical
            ? defRect.top + 5 - canvasRect.top
            : defRect.top + defRect.height / 2 - canvasRect.top;
          drawLink(startX, startY, endX, endY);
          links.push({
            repere: currentRepere.info,
            definition: cell.textContent,
            lineId: { startX, startY, endX, endY },
            id: currentRepere.cell.dataset.id,
          });
          usedCells.add(cell);
          usedCells.add(currentRepere.cell);
          cell.classList.add('used');
          currentRepere.cell.classList.add('used');
          resetDrawing();
          actionButton.disabled = links.length !== selectedReperes.length;
        } else {
          drawing = true;
          currentDefinition = { text: cell.textContent, cell };
          currentRepere = null;
        }
      }
    }
    function drawLink(startX, startY, endX, endY, color = "black") {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      const headlen = 10;
      const angle = Math.atan2(endY - startY, endX - startX);
      ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    function resetDrawing() {
      drawing = false;
      currentRepere = null;
      currentDefinition = null;
      currentAction = "check";
      document.getElementById("actionButton").innerHTML = 'vérifier<span class="tooltip">vérifier les associations</span>';
      actionButton.disabled = links.length !== selectedReperes.length;
    }
    function performAction() {
      if (actionButton.disabled) return;
      switch (currentAction) {
        case "check": checkLinks(); break;
        case "correct": correctLinks(); break;
        case "reload": reload(); break;
      }
    }
    function checkLinks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let correctCount = 0;
      links.forEach((link) => {
        const correspondingPart = selectedReperes.find((part) => part.id == link.id);
        const isCorrect = correspondingPart ? correspondingPart.colonne_de_droite === link.definition : false;
        const color = isCorrect ? "green" : "red";
        drawLink(link.lineId.startX, link.lineId.startY, link.lineId.endX, link.lineId.endY, color);
        link.isCorrect = isCorrect;
        if (isCorrect) correctCount++;
      });
      totalCorrect += correctCount;
      totalAnswers += selectedReperes.length;
      scoreButton.innerHTML = `${totalCorrect} / ${totalAnswers}<span class="tooltip">score actuel (réponses correctes / total)</span>`;
      scoreButton.disabled = false;
      currentAction = "correct";
      document.getElementById("actionButton").innerHTML = 'corriger<span class="tooltip">afficher les corrections</span>';
      actionButton.disabled = false;
    }
    function correctLinks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const repereTable = document.getElementById("repereTable");
      const definitionTable = document.getElementById("definitionTable");
      const canvasRect = canvas.getBoundingClientRect();
      const isVertical = isVerticalLayout();
      const totalCells = selectedReperes.length;
      selectedReperes.forEach((repere) => {
        const repereCell = Array.from(repereTable.rows).find((row) => row.cells[0].dataset.id == repere.id)?.cells[0];
        const definitionCell = Array.from(definitionTable.rows).find((row) => row.cells[0].dataset.id == repere.id)?.cells[0];
        if (repereCell && definitionCell) {
          const repereRect = repereCell.getBoundingClientRect();
          const defRect = definitionCell.getBoundingClientRect();
          const repereIndex = parseInt(repereCell.dataset.index);
          const startX = isVertical
            ? repereRect.left + (repereRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : repereRect.right - 5 - canvasRect.left;
          const startY = isVertical
            ? repereRect.bottom - 5 - canvasRect.top
            : repereRect.top + repereRect.height / 2 - canvasRect.top;
          const endX = isVertical
            ? defRect.left + (defRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
            : defRect.left + 5 - canvasRect.left;
          const endY = isVertical
            ? defRect.top + 5 - canvasRect.top
            : defRect.top + defRect.height / 2 - canvasRect.top;
          drawLink(startX, startY, endX, endY, "green");
        }
      });
      currentAction = "reload";
      document.getElementById("actionButton").innerHTML = '<span class="reload-icon">↻</span><span class="tooltip">recharger l\'exercice</span>';
      actionButton.disabled = false;
    }
    function reload() {
      links.length = 0; ctx.clearRect(0, 0, canvas.width, canvas.height); usedCells.clear();
      const repCells = document.getElementById("repereTable").getElementsByTagName("td");
      const defCells = document.getElementById("definitionTable").getElementsByTagName("td");
      Array.from(repCells).forEach((cell) => cell.classList.remove("used"));
      Array.from(defCells).forEach((cell) => cell.classList.remove("used"));
      document.getElementById("repereTable").innerHTML = "";
      document.getElementById("definitionTable").innerHTML = "";
      selectedReperes = loadReperes();
      resetDrawing();
      addEventListeners();
      resizeCanvas();
      actionButton.disabled = true;
    }
    function addEventListeners() {
      const repCells = document.getElementById("repereTable").getElementsByTagName("td");
      const defCells = document.getElementById("definitionTable").getElementsByTagName("td");
      Array.from(repCells).forEach((cell) => {
        cell.addEventListener("click", (event) => selectCell(event, "repere", cell.textContent));
      });
      Array.from(defCells).forEach((cell) => {
        cell.addEventListener("click", (event) => selectCell(event, "definition", cell.textContent));
      });
    }
    function resizeCanvas() {
      const container = document.querySelector('.container');
      canvas.width = container.offsetWidth; canvas.height = container.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
    window.onload = function () {
      selectedReperes = loadReperes();
      loadTitleAndSubtitle();
      resizeCanvas();
      addEventListeners();
      actionButton.disabled = true;
      scoreButton.disabled = true;
    };
  </script>
</body>
</html>
