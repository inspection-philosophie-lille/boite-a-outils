<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3.0">
    <link rel="icon" type="image/svg+xml" href="src/favicon.ico" />
    <title>quiz φ</title>
    <style>
        /* Reset minimaliste */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .hidden {
            display: none !important;
        }

        img {
            object-fit: cover;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        /* Layout principal responsive */
        .content--v2 {
            padding: 10px;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .wrapper--with-menu {
            padding: 0;
            width: 100%;
        }

        .wrapper--with-menu > div {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
        }

        .wrapper--grid-playlist {
            display: block;
            width: 100%;
        }

        .grid-area--player {
            width: 100%;
            margin-bottom: 20px;
        }

        .grid-area--playlist {
            display: none; /* Caché sur mobile */
        }

        /* Conteneur quiz responsive - MODIFICATION IMPORTANTE */
        .container--quiz {
            background: #f8f8f8;
            border: 15px solid #FFFFFF;
            box-shadow: 0 0 0.625rem rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 500px;
            min-height: 300px;
            overflow: hidden;
            border-radius: 20px;
            margin: 10px auto;
            position: relative;
        }

        /* Écran de démarrage responsive - MODIFICATION IMPORTANTE */
        .container--quiz-start {
            border-radius: 0;
            overflow: hidden;
            position: relative;
            width: 100%; /* S'assure qu'il prend toute la largeur du conteneur parent */
        }

        .quiz-start__img {
            display: flex;
            width: 100%;
            height: 250px;
            position: relative;
            overflow: hidden;
        }

        .quiz-start__img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .quiz-start__opacity {
            background: rgba(0, 0, 0, 0.11);
            height: 100%;
            left: 0;
            top: 0;
            position: absolute;
            width: 100%;
        }

        .quiz-start__button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
        }

        /* Boutons responsive */
        .quiz-btn {
            border: 1px solid #000;
            color: #000;
            cursor: pointer;
            font-family: Arial;
            font-size: 14px;
            padding: 12px 20px;
            text-align: center;
            width: auto;
            min-width: 140px;
        }

        .quiz-btn--default {
            border-radius: 27px;
            font-size: 15px;
            line-height: 22px;
            padding: 12px 25px;
        }

        .quiz-btn--large {
            border-radius: 33px;
            font-size: 16px;
            line-height: 25px;
            padding: 16px 30px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border-radius: 2.5rem;
            box-shadow: 0 0.125rem 0 black, 0 0.375rem 0 rgba(0, 0, 0, 0.12), inset 0 -0.0625rem 0.25rem black;
            width: 90%;
            max-width: 280px;
        }

        .quiz-btn--fill {
            background: white;
            border: 1px solid #ddd;
            color: black;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Barre de progression responsive */
        .progress-bar {
            align-items: center;
            width: 100%;
            background-color: #f8f8f8;
            padding: 15px 20px;
        }

        .progress-bar__info {
            align-items: center;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: 0.5px;
            line-height: 26px;
            text-transform: uppercase;
            padding: 0 0 10px 0;
            flex-wrap: wrap;
        }

        .progress-bar__title {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 120px;
        }

        .progress-bar__title img {
            margin-right: 8px;
            width: 28px;
            height: 28px;
        }

        .progress-bar__title h1 {
            font-size: 14px;
            white-space: nowrap;
        }

        .progress-bar__count {
            display: flex;
            font-size: 14px;
            font-weight: bold;
        }

        .progress-bar__cursor {
            background: hsla(0, 0%, 50.2%, 0.39);
            border-radius: 18.5625px;
            height: 8px;
            position: relative;
            width: 100%;
        }

        .progress-bar__cursor--dynamic {
            position: absolute;
            border-radius: 18.5625px;
            height: 8px;
            background: red;
            transition: width 0.3s ease;
        }

        /* Questions et réponses responsive */
        .container--question {
            padding: 15px;
            text-align: center;
            width: 100%;
        }

        .quiz__question {
            margin-bottom: 20px;  
            font-size: 16px;
            line-height: 24px;
            text-align: center;
            font-weight: bold;
            padding: 0 10px;
        }

        fieldset {
            margin-bottom: 10px;
            padding: 0;
            border: none;
            width: 100%;
        }

        legend p {
            margin: 0;
            padding: 0;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.4;
			margin-bottom: 33px;
        }

        .quiz-answer {
            text-align: left;
            display: flex;
            align-items: center;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin-bottom: 12px;
		
            padding: 15px 20px;
            border: 0;
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-left: 15px;
            cursor: pointer;
            min-height: 60px;
            font-size: 14px;
            line-height: 1.4;
        }

        .correct {
            border: 2px solid #71e8ab;
        }

        .incorrect {
            border: 2px solid #ff878c;
        }

        .answer-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
        }

        /* Espace après les réponses - AJOUTÉ */
        .answers-spacing {
            height: 25px;
            width: 100%;
        }

        /* Explications responsive */
        .quiz-explanation {
            position: relative;
            margin: 0 auto 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0.75rem;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            padding: 15px;
            width: 95%;
            max-width: 95%;
        }

        .quiz-explanation__label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .emoji {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        /* Résultats responsive */
        .container--quiz-end {
            min-height: 400px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container--quiz-results {
            color: #000;
            font-family: Arial;
            padding: 20px;
            text-align: center;
            width: 100%;
        }

        .container--quiz-btn {
            align-items: center;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .container--quiz-btn .quiz-btn {
            margin-right: 0;
        }

        .next-button-container {
            text-align: center;
            margin-top: 20px;
            padding: 0 10px;
        }

        /* Animations */
        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes shakeY {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-5px); }
            75% { transform: translateY(5px); }
        }

        .shake-x {
            animation: shakeX 0.5s;
        }

        .shake-y {
            animation: shakeY 0.5s;
        }

        /* Responsive pour tablettes et desktop */
        @media (min-width: 768px) {
            .container--quiz {
                width: 90%;
                max-width: 600px;
                margin: 20px auto;
            }

            .quiz-start__img {
                height: 300px;
            }

            .quiz-btn--large {
                width: auto;
                padding: 16px 40px;
            }

            .quiz-answer {
                padding: 20px 25px;
                font-size: 15px;
            }

            .quiz__question {
                font-size: 18px;
                line-height: 28px;
            }

            .answers-spacing {
                height: 30px;
            }
        }

        @media (min-width: 1200px) {
            .wrapper--grid-playlist {
                display: grid;
                grid-template-columns: 1fr 340px;
                grid-template-areas: "player playlist";
                gap: 2rem;
                max-width: 1200px;
                margin: 0 auto;
            }

            .grid-area--player {
                grid-area: player;
            }

            .grid-area--playlist {
                display: block;
                grid-area: playlist;
                padding: 35px 0 0 0;
            }

            .container--quiz {
                margin: 0;
                width: 100%;
                max-width: none;
            }

            .quiz-answer {
                margin-bottom: 15px;
                padding: 20px 30px;
            }

            .answers-spacing {
                height: 35px;
            }
        }

        /* Correction pour les très petits écrans */
        @media (max-width: 360px) {
            .container--quiz {
                width: 100%;
                margin: 5px auto;
                border-width: 10px;
            }

            .quiz-start__img {
                height: 200px;
            }

            .quiz-btn--large {
                font-size: 14px;
                padding: 14px 20px;
            }

            .quiz-answer {
                padding: 12px 15px;
                font-size: 13px;
            }

            .progress-bar {
                padding: 10px 15px;
            }

            .answers-spacing {
                height: 20px;
            }
        }
    </style>
</head>

<body>
    <main id="content" class="content--v2" role="main" data-template-id="quiz">
        <div class="wrapper--with-menu content--v2--header">
            <div class="wrapper--grid-playlist">
                <div class="grid-area--player grid-area--player-relative">        
                    <div id="quiz" class="container--quiz" data-slug="quiz">
                        <div id="quizStart">
                            <div class="container--quiz-start">
                                <div class="quiz-start__img">
                                    <img class="lazy" alt="Quiz" src="couverture.png" data-src="" data-srcset="" />
                                    <div class="quiz-start__opacity"></div>
                                    <div class="quiz-start__button">
                                        <button id="quizStartBtn" class="quiz-btn quiz-btn--large quiz-btn--fill" type="button" tabindex="0" aria-label="Commencer le quiz">
                                            <span class="icon icon-play"></span> Commencer le quiz 
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>                        
                        <div id="quizQuestions" class="hidden" data-reviewing="false">
                            <div class="progress-bar">
                                <div class="progress-bar__info">
                                    <div class="progress-bar__title">
                                        <img src="src/phi.png" alt="philosophie">
                                        <h1 id="quizTitle" aria-label="Question 1/10 , cochez le bouton radio choisi pour valider votre réponse.">Quiz</h1>
                                    </div>
                                    <div class="progress-bar__count" aria-hidden="true">
                                        <span id="currentQuestion">1</span> /  
                                        <span id="totalQuestions" data-value="10">10</span>
                                    </div>
                                </div>
                                <div class="progress-bar__cursor">
                                    <span class="progress-bar__cursor--dynamic" style="width: 0%"></span>
                                </div>
                            </div>

                            <div id="questionsContainer"></div>
                        </div>

                        <div id="quizEnd" class="hidden">
                            <div class="container--quiz-end" data-result="loose">
                                <div class="container--quiz-results">
                                    <div class="container--quiz-message">
                                        <p class="quiz-end__results">
                                            <span class="quiz-end__message-failure">Votre score :</span>
                                            <br><br>
                                            <span class="quiz-end__score">0</span> bonne(s) réponse(s) sur 10.
                                        </p>
                                        <br>
                                    </div>
                                    <br><br>
                                    <div class="container--quiz-btn">
                                        <button id="quizRetry" class="quiz-btn quiz-btn--default quiz-btn--fill quiz-btn-retry" type="button" tabindex="0" aria-label="Rejouer">Réessayer</button>
                                    </div>
                                    <a href="#playlistQuiz" title="" class="quiz-end__link"></a>
                                </div>
                            </div>
                        </div>                        
                        <button class="fullscreen-quiz hidden"></button>
                    </div>    
                </div>

                <div class="grid-area--playlist" id="playlistQuiz"></div>    
            </div>
        </div>
    </main>
    <script src="quiz-questions.js"></script>
    <script>
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        const TOTAL_QUESTIONS = 10;

        document.getElementById('quizStartBtn').addEventListener('click', startQuiz);
        document.getElementById('quizRetry').addEventListener('click', startQuiz);

        function startQuiz() {
            shuffledQuestions = [...questions];
            shuffleArray(shuffledQuestions);
            shuffledQuestions = shuffledQuestions.slice(0, TOTAL_QUESTIONS);
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('quizStart').classList.add('hidden');
            document.getElementById('quizEnd').classList.add('hidden');
            document.getElementById('quizQuestions').classList.remove('hidden');
            displayNextQuestion();
        }

        function displayNextQuestion() {
            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = '';
            
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                const q = shuffledQuestions[currentQuestionIndex];
                
                // Mélanger les réponses  
                const shuffledAnswers = [...q.answers];
                shuffleArray(shuffledAnswers);

                const questionElement = document.createElement('div');
                
                questionElement.innerHTML = `
                    <div class="container--question">
                        <fieldset>
                            <legend><p>${q.question}</p></legend>
                            <ul>${shuffledAnswers.map((answer, i) => `
                                <li class='quiz-answer' data-index='${i}'>
                                    ${answer}
                                    <img src="src/false.svg" alt="false" class="answer-icon hidden">
                                </li>`).join('')}
                            </ul>
                        </fieldset>
                        <!-- ESPACE AJOUTÉ ICI après les réponses et avant les explications -->
                        <div class="answers-spacing"></div>
                        <div class='quiz-explanation hidden'>
                            <div class='quiz-explanation__label'>
                                <span></span>
                            </div>
                            <p class='quiz-explanation__detail'>${q.explanation}</p>
                        </div>
                        <div class='next-button-container'></div>
                    </div>`;
                
                questionsContainer.appendChild(questionElement);

                // Ajout des événements aux réponses  
                questionElement.querySelectorAll('.quiz-answer').forEach((answerElement, index) => {
                    answerElement.addEventListener('click', () => {
                        if (!questionElement.querySelector('.quiz-answer.correct') && !questionElement.querySelector('.quiz-answer.incorrect')) {
                            checkAnswer(answerElement, shuffledAnswers[index], q.answers[q.correct]);
                        }
                    });
                });

                document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
                updateProgressBar();
                
            } else {
                endQuiz();
            }
        }

        function checkAnswer(selectedAnswer, selectedAnswerText, correctAnswerText) {
            const answers = selectedAnswer.parentNode.children;
            const explanationLabel = selectedAnswer.closest('.container--question').querySelector('.quiz-explanation__label span');
            
            if (selectedAnswerText === correctAnswerText) {
                selectedAnswer.classList.add('correct');
                selectedAnswer.querySelector('.answer-icon').src = 'src/true.svg';
                selectedAnswer.querySelector('.answer-icon').classList.remove('hidden');
                score++;
                explanationLabel.innerHTML = '<img src="src/emoji-happy.gif" alt="emoji" class="emoji"> Bonne réponse !';
                selectedAnswer.classList.add('shake-y');
            } else {
                selectedAnswer.classList.add('incorrect');
                selectedAnswer.querySelector('.answer-icon').classList.remove('hidden');
                explanationLabel.innerHTML = '<img src="src/emoji-sad.gif" alt="emoji" class="emoji"> Mauvaise réponse !';
                selectedAnswer.classList.add('shake-x');

                // Marquer la bonne réponse  
                Array.from(answers).forEach(answer => {
                    if (answer.textContent.trim() === correctAnswerText) {
                        answer.classList.add('correct');
                        answer.querySelector('.answer-icon').src = 'src/true.svg';
                        answer.querySelector('.answer-icon').classList.remove('hidden');
                    }
                });
            }

           // Affiche l'explication  
           const explanation = selectedAnswer.closest('.container--question').querySelector('.quiz-explanation');
           explanation.classList.remove('hidden');

           // Crée un bouton pour passer à la question suivante  
           const nextButton = document.createElement('button');
           nextButton.textContent = 'Question suivante';
           nextButton.classList.add('quiz-btn', 'quiz-btn--default', 'quiz-btn--fill');
           nextButton.addEventListener('click', () => {
               currentQuestionIndex++;
               displayNextQuestion();
           });

           // Ajoute le bouton dans le conteneur dédié  
           const nextButtonContainer = selectedAnswer.closest('.container--question').querySelector('.next-button-container');
           nextButtonContainer.innerHTML = '';
           nextButtonContainer.appendChild(nextButton);
        }

        function endQuiz() {
            document.getElementById('quizQuestions').classList.add('hidden');
            document.getElementById('quizEnd').classList.remove('hidden');
            
            // Affiche le score final  
            document.querySelector('.quiz-end__score').textContent = score;
        }

        function shuffleArray(array) {
             for (let i = array.length - 1; i > 0; i--) {
                 const j = Math.floor(Math.random() * (i + 1));
                 [array[i], array[j]] = [array[j], array[i]];
             }
         }

        function updateProgressBar() {
            const progressBar = document.querySelector('.progress-bar__cursor--dynamic');
            const progress = ((currentQuestionIndex + 1) / TOTAL_QUESTIONS) * 100;
            progressBar.style.width = `${progress}%`;
        }
    </script>
</body>
</html>
