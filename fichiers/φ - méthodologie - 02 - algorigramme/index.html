<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<html lang="fr">
<head>
<meta charset="utf-8" />

<!-- Cytoscape -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>

<style>
  :root {
    --bg: #e7e7e9;
    --panel-bg: #e0e0e0;
    --shadow-1: 4px 4px 10px rgba(0,0,0,0.12);
    --shadow-2: -4px -4px 10px rgba(255,255,255,0.9);
  }

  html, body {

    font-family: 'Inter', Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
    overflow: hidden;

  #cy {
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    display: block;
  }

  /* panneau contrôles */
  .controls {
    position: fixed;
    left: -80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;

    padding: 10px;

    border: 0;

    box-shadow: var(--shadow-1), var(--shadow-2);

    padding: 8px;

  /* bouton neutre / icône */

  .btn:hover {

  /* material symbol styling */
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    font-size: 20px;
    line-height: 1;
  }

  /* shape glyphs (unicode) */
  .shape-glyph {
    font-size: 18px;

  /* palette */
  .color-palette {
    display: flex;

    background: transparent;

  .color-swatch {
    width: 28px;

    border-radius: 6px;

  }

  .color-swatch:hover {

  /* hidden file input */
  #importfile {
    display: none;

  /* inline editor input style */
  .cy-inline-input {
    position: absolute;
    z-index: 9999;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.12);
    box-shadow: 2px 2px 10px rgba(0,0,0,0.12);

    width: 80%;
    max-width: 300px;
  }

  .cy-inline-input::placeholder {
    color: #888;
    opacity: 0.7;
  }

  /* Media Queries pour responsive */
  @media (max-width: 768px) {
    .controls {
      left: -70px;
      gap: 8px;
      padding: 8px;
    }

    .controls.visible {
      left: 8px;
    }

    .btn {
      min-width: 36px;
      height: 36px;
      font-size: 16px;
    }

    .material-symbols-outlined, .shape-glyph {
      font-size: 16px;
    }

    .color-swatch {
      width: 24px;
      height: 24px;
    }

    .color-palette {
      max-width: 180px;
    }

    .cy-inline-input {
      font-size: 12px;
      padding: 4px 6px;
    }
  }

  @media (max-width: 480px) {
    .controls {
      left: -60px;
      gap: 6px;
      padding: 6px;
    }

    .controls.visible {
      left: 6px;
    }

    .btn {
      min-width: 32px;
      height: 32px;
      font-size: 14px;
    }

    .material-symbols-outlined, .shape-glyph {
      font-size: 14px;
    }

    .color-swatch {
      width: 20px;
      height: 20px;
    }

    .color-palette {
      max-width: 160px;
    }
  }
</style>
</head>
<body>

<!-- Bouton de bascule pour tous les écrans -->
<button class="toggle-menu" title="Afficher/Masquer le menu" onclick="toggleMenuMobile()">
  <span class="material-symbols-outlined">menu</span>
</button>

<!-- Controls -->
<div class="controls" role="toolbar" aria-label="outils">
  <!-- shapes -->
  <button class="btn" title="rectangle" onclick="selectNodeShape('rectangle')"><span class="shape-glyph">▭</span></button>
  <button class="btn" title="losange" onclick="selectNodeShape('diamond')"><span class="shape-glyph">◇</span></button>
  <button class="btn" title="ellipse" onclick="selectNodeShape('ellipse')"><span class="shape-glyph">◯</span></button>

  <!-- color menu -->
  <button class="btn" title="couleur (sélectionner un nœud)" onclick="toggleColorPalette()"><span class="material-symbols-outlined">palette</span></button>
  <div id="colorpalette" class="color-palette" style="display:none;">
    <div class="color-swatch" data-color="#e0e0e0" style="background:#e0e0e0"></div>
    <div class="color-swatch" data-color="#a3bffa" style="background:#a3bffa"></div>
    <div class="color-swatch" data-color="#f6e58d" style="background:#f6e58d"></div>
    <div class="color-swatch" data-color="#ff9ff3" style="background:#ff9ff3"></div>
    <div class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b"></div>
    <div class="color-swatch" data-color="#55efc4" style="background:#55efc4"></div>
    <div class="color-swatch" data-color="#74b9ff" style="background:#74b9ff"></div>
    <div class="color-swatch" data-color="#fd79a8" style="background:#fd79a8"></div>
  </div>

  <!-- add edge (arrow) -->
  <button class="btn" title="ajouter connexion" onclick="startaddedge()"><span class="material-symbols-outlined">arrow_forward</span></button>

  <!-- import / export -->
  <button class="btn" title="importer JSON" onclick="document.getElementById('importfile').click()"><span class="material-symbols-outlined">folder_open</span></button>
  <input id="importfile" type="file" accept=".json" onchange="importmindmap()" />
  <button class="btn" title="exporter JSON" onclick="exportJSON()"><span class="material-symbols-outlined">save</span></button>
  <button class="btn" title="exporter PNG" onclick="exportPNG()"><span class="material-symbols-outlined">image</span></button>
</div>

<!-- cytoscape container -->
<div id="cy"></div>

<script>
/* ---------- utilitaires ---------- */
function darkenColor(hex, percent = -30) {
  try {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
    let num = parseInt(c, 16);
    let amt = Math.round(2.55 * percent);
    let R = (num >> 16) + amt;
    let G = (num >> 8 & 0x00FF) + amt;
    let B = (num & 0x0000FF) + amt;
    R = Math.max(0, Math.min(255, R));
    G = Math.max(0, Math.min(255, G));
    B = Math.max(0, Math.min(255, B));
    return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1).toUpperCase();
  } catch (e) {
    return '#A0A0A0';
  }
}

function adjustNodeSize(node) {
  if (!node || !node.data) return;
  const text = String(node.data('label') || '');
  const lines = text.split("\n").length;
  const longest = text.split("\n").reduce((m, s) => Math.max(m, s.length), 0);
  const isMobile = window.innerWidth <= 768;
  const baseWidth = isMobile ? 120 : 160;
  const baseHeight = isMobile ? 60 : 72;
  const width = Math.min(Math.max(baseWidth, longest * (isMobile ? 8 : 10)), isMobile ? 300 : 420);
  const height = Math.min(Math.max(baseHeight, lines * (isMobile ? 22 : 26)), isMobile ? 240 : 320);
  node.style('width', width + 'px');
  node.style('height', height + 'px');
  node.style('font-size', isMobile ? '12px' : '14px');
  node.style('text-max-width', isMobile ? '200px' : '300px');
}

/* ---------- cytoscape init ---------- */
let cy = cytoscape({
  container: document.getElementById('cy'),
  style: [
    {
      selector: 'node',
      style: {
        'label': 'data(label)',
        'shape': 'data(shape)',
        'background-color': 'data(color)',
        'border-width': 2,
        'border-color': 'data(borderColor)',
        'color': '#222',
        'text-valign': 'center',
        'text-wrap': 'wrap',
        'text-max-width': '300px',
        'font-family': 'Inter, Arial, sans-serif',
        'font-size': 14,
        'padding': 8
      }
    },
    {
      selector: 'edge',
      style: {
        'width': 2,
        'curve-style': 'straight',
        'target-arrow-shape': 'triangle',
        'line-color': '#333',
        'target-arrow-color': '#333'
      }
    },
    {
      selector: ':selected',
      style: {
        'overlay-color': '#ddd',
        'overlay-opacity': 0.4
      }
    }
  ],
  layout: { name: 'preset' },
  userZoomingEnabled: true,
  userPanningEnabled: true
});

/* ---------- gestion menu coulissant ---------- */
const controls = document.querySelector('.controls');
let hideTimeout = null;
let isMobileMenuVisible = false;

function toggleMenuMobile() {
  isMobileMenuVisible = !isMobileMenuVisible;
  controls.classList.toggle('visible', isMobileMenuVisible);
  if (isMobileMenuVisible) {
    clearTimeout(hideTimeout);
  } else {
    hideTimeout = setTimeout(() => {
      controls.classList.remove('visible');
    }, 1000);
  }
}

function handleMenuVisibility(e) {
  const isMobile = window.innerWidth <= 768;
  if (isMobile) return;
  if (e.clientX < 50) {
    controls.classList.add('visible');
    clearTimeout(hideTimeout);
  } else {
    hideTimeout = setTimeout(() => {
      controls.classList.remove('visible');
    }, 1000);
  }
}

document.addEventListener('mousemove', handleMenuVisibility);

controls.addEventListener('mouseenter', () => {
  clearTimeout(hideTimeout);
});

controls.addEventListener('mouseleave', () => {
  if (window.innerWidth > 768) {
    hideTimeout = setTimeout(() => {
      controls.classList.remove('visible');
    }, 1000);
  }
});

document.addEventListener('touchstart', (e) => {
  if (window.innerWidth > 768) return;
  const touchX = e.touches[0].clientX;
  if (touchX < 50 && !isMobileMenuVisible) {
    toggleMenuMobile();
  }
});

/* ---------- UI state ---------- */
let newNodeShape = 'rectangle';
function selectNodeShape(shape) {
  newNodeShape = shape;
  const sel = cy.$('node:selected');
  if (sel.length > 0) {
    sel[0].data('shape', shape);
    adjustNodeSize(sel[0]);
  } else {
    addnode();
  }
}

/* ---------- palette color ---------- */
function toggleColorPalette() {
  const p = document.getElementById('colorpalette');
  p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
}

document.querySelectorAll('.color-swatch').forEach(s => {
  s.addEventListener('click', () => {
    const color = s.getAttribute('data-color');
    const sel = cy.$('node:selected');
    if (sel.length > 0) {
      sel[0].data('color', color);
      sel[0].data('borderColor', darkenColor(color));
      adjustNodeSize(sel[0]);
    }
    document.getElementById('colorpalette').style.display = 'none';
  });
});

/* ---------- add node ---------- */
function addnode() {
  const label = prompt('texte du nœud :', 'nouveau nœud');
  if (label === null) return;
  const n = cy.add({
    group: 'nodes',
    data: {
      label: label,
      shape: newNodeShape,
      color: '#e0e0e0',
      borderColor: darkenColor('#e0e0e0')
    },
    position: { x: 220 + Math.random() * 360, y: 160 + Math.random() * 260 }
  });
  adjustNodeSize(n);
}

/* ---------- inline edit (double-click to edit node text) ---------- */
cy.on('dblclick', 'node', function(evt) {
  console.log('Double-click detected on node:', evt.target.id());
  try {
    const node = evt.target;
    const bbox = node.renderedBoundingBox();
    const ctr = cy.container().getBoundingClientRect();
    const docLeft = ctr.left + bbox.x1 + window.scrollX;
    const docTop = ctr.top + bbox.y1 + window.scrollY;
    const width = Math.max(80, bbox.w);
    const input = document.createElement('input');
    input.type = 'text';
    input.value = node.data('label') || '';
    input.placeholder = 'Modifier le texte...';
    input.className = 'cy-inline-input';
    input.style.left = (docLeft) + 'px';
    input.style.top = (docTop) + 'px';
    input.style.width = (width + 12) + 'px';
    document.body.appendChild(input);
    input.focus();
    input.select();
    const finalize = () => {
      if (!document.body.contains(input)) return;
      node.data('label', input.value);
      adjustNodeSize(node);
      input.remove();
      console.log('Node text updated to:', input.value);
    };
    input.addEventListener('blur', finalize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        finalize();
      } else if (e.key === 'Escape') {
        input.remove();
        console.log('Edit cancelled');
      }
      // Empêcher la propagation de Delete/Backspace pour éviter la suppression du nœud
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.stopPropagation();
      }
    });
    input.addEventListener('mousedown', (ev) => ev.stopPropagation());
    input.addEventListener('touchstart', (ev) => ev.stopPropagation());
  } catch (err) {
    console.error('Inline edit error:', err);
  }
});

/* ---------- edges (add) ---------- */
let edgeMode = false;
let edgeSource = null;
function startaddedge() {
  edgeMode = true;
  edgeSource = null;
  setTimeout(() => alert('cliquez sur un nœud source puis un nœud cible'), 10);
}
cy.on('tap', 'node', function(evt) {
  if (!edgeMode) return;
  const n = evt.target;
  if (!edgeSource) {
    edgeSource = n;
    return;
  }
  if (edgeSource && n && edgeSource.id() !== n.id()) {
    cy.add({ group: 'edges', data: { source: edgeSource.id(), target: n.id() } });
    edgeMode = false;
    edgeSource = null;
  }
});

/* ---------- deletion (keyboard) ---------- */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    // Ignorer si un input est actif
    if (document.activeElement.tagName === 'INPUT') {
      console.log('Delete/Backspace ignored: input is focused');
      return;
    }
    const sel = cy.$(':selected');
    if (sel.length > 0) {
      sel.remove();
      e.preventDefault();
      console.log('Selected elements deleted');
    }
  }
});

/* ---------- import / export ---------- */
function importmindmap() {
  const fileIn = document.getElementById('importfile');
  const file = fileIn.files && fileIn.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = JSON.parse(e.target.result);
      if (!raw.nodeDataArray || !raw.linkDataArray) throw new Error('format JSON invalide (attendu nodeDataArray & linkDataArray)');
      cy.elements().remove();
      raw.nodeDataArray.forEach(nd => {
        const [x, y] = String(nd.loc || '0 0').split(' ').map(Number);
        const shape = nd.category || nd.shape || 'rectangle';
        const color = nd.color || '#e0e0e0';
        const borderColor = nd.borderColor || darkenColor(color);
        const node = cy.add({
          group: 'nodes',
          data: {
            id: String(nd.key),
            label: nd.text || nd.label || '',
            shape: shape,
            color: color,
            borderColor: borderColor
          },
          position: { x: x || 0, y: y || 0 }
        });
        adjustNodeSize(node);
      });
      raw.linkDataArray.forEach(l => {
        cy.add({ group: 'edges', data: { id: 'e' + l.from + '-' + l.to, source: String(l.from), target: String(l.to) } });
      });
      const padding = window.innerWidth <= 768 ? 20 : 50;
      cy.fit(cy.elements(), padding);
      cy.center();
      alert('importation réussie');
      fileIn.value = '';
    } catch (err) {
      alert('erreur importation : ' + (err && err.message ? err.message : err));
      console.error(err);
    }
  };
  reader.readAsText(file);
}

function exportJSON() {
  const nodeDataArray = cy.nodes().map(n => ({
    key: n.id(),
    text: n.data('label'),
    loc: (n.position().x || 0) + ' ' + (n.position().y || 0),
    category: n.data('shape'),
    color: n.data('color'),
    borderColor: n.data('borderColor')
  }));
  const linkDataArray = cy.edges().map(e => ({ from: e.data('source'), to: e.data('target') }));
  const data = { nodeDataArray, linkDataArray };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mindmap.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportPNG() {
  const data = cy.png({ full: true, scale: window.innerWidth <= 768 ? 1.2 : 1.5 });
  const a = document.createElement('a');
  a.href = data;
  a.download = 'mindmap.png';
  a.click();
}
</script>
</body>
