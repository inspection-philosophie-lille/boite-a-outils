<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

/* ---------- utilitaires ---------- */
function darkenColor(hex, percent = -30) {
  try {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
    let num = parseInt(c, 16);
    let amt = Math.round(2.55 * percent);
    let R = (num >> 16) + amt;
    let G = (num >> 8 & 0x00FF) + amt;
    let B = (num & 0x0000FF) + amt;
    R = Math.max(0, Math.min(255, R));
    G = Math.max(0, Math.min(255, G));
    B = Math.max(0, Math.min(255, B));
    return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1).toUpperCase();
  } catch (e) {
    console.error('Erreur darkenColor:', e);
    return '#A0A0A0';
  }
}

function adjustNodeSize(node) {
  if (!node || !node.data) {
    console.warn('adjustNodeSize: node invalide');
    return;

  const text = String(node.data('label') || '');
  const lines = text.split("\n").length;
  const longest = text.split("\n").reduce((m, s) => Math.max(m, s.length), 0);
  const isMobile = window.innerWidth <= 768;
  const baseWidth = isMobile ? 120 : 160;
  const baseHeight = isMobile ? 60 : 72;
  const width = Math.min(Math.max(baseWidth, longest * (isMobile ? 8 : 10)), isMobile ? 300 : 420);
  const height = Math.min(Math.max(baseHeight, lines * (isMobile ? 22 : 26)), isMobile ? 240 : 320);
  node.style('width', width + 'px');
  node.style('height', height + 'px');
  node.style('font-size', isMobile ? '12px' : '14px');
  node.style('text-max-width', isMobile ? '200px' : '300px');
  console.log(`Node ${node.id()} ajusté: width=${width}px, height=${height}px`);
}

// Fonction pour charger les données JSON initiales
function loadInitialData() {
  if (!cy) {
    console.error('Cytoscape non initialisé');
    alert('Erreur : Cytoscape non initialisé');
    return;
  }
  try {
    console.log('Début chargement JSON initial');
    cy.elements().remove();
    const nodes = [];
    initialData.nodeDataArray.forEach((nd, index) => {
      const [x, y] = String(nd.loc || '0 0').split(' ').map(Number);
      const shape = nd.category || nd.shape || 'rectangle';
      const color = nd.color || '#e0e0e0';
      const borderColor = nd.borderColor || darkenColor(color);
      const node = cy.add({
        group: 'nodes',
        data: {
          id: String(nd.key),
          label: nd.text || nd.label || '',
          shape: shape,
          color: color,
          borderColor: borderColor
        },
        position: { x: x || 0, y: y || 0 }
      });
      nodes.push(node);
      adjustNodeSize(node);
      console.log(`Nœud ${index} ajouté: ${nd.key}, label: ${nd.text}, position: (${x}, ${y})`);
    });
    initialData.linkDataArray.forEach((l, index) => {
      cy.add({
        group: 'edges',
        data: {
          id: 'e' + l.from + '-' + l.to,
          source: String(l.from),
          target: String(l.to)
        }
      });
      console.log(`Lien ${index} ajouté: ${l.from} -> ${l.to}`);
    });
    const padding = window.innerWidth <= 768 ? 20 : 50;
    const xCoords = nodes.map(node => node.position().x);
    const currentCenter = xCoords.length > 0 ? xCoords.reduce((sum, x) => sum + x, 0) / xCoords.length : 0;
    const screenCenter = window.innerWidth / 2;
    const offset = screenCenter - currentCenter;
    nodes.forEach(node => {
      const newX = node.position().x + offset;
      node.position('x', newX);
      console.log(`Nœud ${node.id()} repositionné: x=${newX}`);
    });
    cy.fit(cy.elements(), padding);
    if (window.innerWidth > 768) {
      cy.zoom(0.8);
    }
    cy.center();
    console.log('Chargement JSON initial terminé, éléments:', cy.elements().length);
  } catch (err) {
    console.error('Erreur lors du chargement des données initiales:', err);
    alert('Erreur chargement initial: ' + err.message);
  }
}

});

    const input = document.createElement('input');
    input.type = 'text';
    input.value = node.data('label') || '';
    input.placeholder = 'Modifier le texte...';
    input.className = 'cy-inline-input';
    input.style.left = (docLeft) + 'px';
    input.style.top = (docTop) + 'px';
    input.style.width = (width + 12) + 'px';
    document.body.appendChild(input);
    input.focus();
    input.select();
    const finalize = () => {
      if (!document.body.contains(input)) return;
      node.data('label', input.value);
      adjustNodeSize(node);
      input.remove();
      console.log('Node text updated to:', input.value);
    };
    input.addEventListener('blur', finalize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        finalize();
      } else if (e.key === 'Escape') {
        input.remove();
        console.log('Edit cancelled');
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.stopPropagation();
      }
    });
    input.addEventListener('mousedown', (ev) => ev.stopPropagation());
    input.addEventListener('touchstart', (ev) => ev.stopPropagation());
  } catch (err) {
    console.error('Inline edit error:', err);
    alert('Erreur édition: ' + err.message);
  }
});

/* ---------- edges (add) ---------- */
let edgeMode = false;
let edgeSource = null;
function startaddedge() {
  edgeMode = true;
  edgeSource = null;
  setTimeout(() => alert('cliquez sur un nœud source puis un nœud cible'), 10);
}
cy.on('tap', 'node', function(evt) {
  if (!edgeMode) return;
  const n = evt.target;
  if (!edgeSource) {
    edgeSource = n;
    return;
  }
  if (edgeSource && n && edgeSource.id() !== n.id()) {
    cy.add({ group: 'edges', data: { source: edgeSource.id(), target: n.id() } });
    edgeMode = false;
    edgeSource = null;
    console.log('Lien ajouté:', edgeSource.id(), '->', n.id());
  }
});

/* ---------- deletion (keyboard) ---------- */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (document.activeElement.tagName === 'INPUT') {
      console.log('Delete/Backspace ignored: input is focused');
      return;
    }
    const sel = cy.$(':selected');
    if (sel.length > 0) {
      sel.remove();
      e.preventDefault();
      console.log('Selected elements deleted:', sel.length);
    }
  }
});

/* ---------- import / export ---------- */
function importmindmap() {
  const fileIn = document.getElementById('importfile');
  const file = fileIn.files && fileIn.files[0];
  if (!file) {
    console.warn('Aucun fichier sélectionné pour l\'importation');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      console.log('Début importation JSON');
      const raw = JSON.parse(e.target.result);
      if (!raw.nodeDataArray || !raw.linkDataArray) {
        throw new Error('Format JSON invalide (attendu nodeDataArray & linkDataArray)');
      }
      cy.elements().remove();
      const nodes = [];
      raw.nodeDataArray.forEach((nd, index) => {
        const [x, y] = String(nd.loc || '0 0').split(' ').map(Number);
        const shape = nd.category || nd.shape || 'rectangle';
        const color = nd.color || '#e0e0e0';
        const borderColor = nd.borderColor || darkenColor(color);
        const node = cy.add({
          group: 'nodes',
          data: {
            id: String(nd.key),
            label: nd.text || nd.label || '',
            shape: shape,
            color: color,
            borderColor: borderColor
          },
          position: { x: x || 0, y: y || 0 }
        });
        nodes.push(node);
        adjustNodeSize(node);
        console.log(`Nœud importé ${index}: ${nd.key}, label: ${nd.text}`);
      });
      raw.linkDataArray.forEach((l, index) => {
        cy.add({
          group: 'edges',
          data: {
            id: 'e' + l.from + '-' + l.to,
            source: String(l.from),
            target: String(l.to)
          }
        });
        console.log(`Lien importé ${index}: ${l.from} -> ${l.to}`);
      });
      const padding = window.innerWidth <= 768 ? 20 : 50;
      const xCoords = nodes.map(node => node.position().x);
      const currentCenter = xCoords.length > 0 ? xCoords.reduce((sum, x) => sum + x, 0) / xCoords.length : 0;
      const screenCenter = window.innerWidth / 2;
      const offset = screenCenter - currentCenter;
      nodes.forEach(node => {
        const newX = node.position().x + offset;
        node.position('x', newX);
        console.log(`Nœud importé ${node.id()} repositionné: x=${newX}`);
      });
      cy.fit(cy.elements(), padding);
      if (window.innerWidth > 768) {
        cy.zoom(0.8);
      }
      cy.center();
      alert('Importation réussie');
      console.log('Importation terminée, éléments:', cy.elements().length);
      fileIn.value = '';
    } catch (err) {
      console.error('Erreur importation:', err);
      alert('Erreur importation: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function exportJSON() {
  try {
    const nodeDataArray = cy.nodes().map(n => ({
      key: n.id(),
      text: n.data('label'),
      loc: (n.position().x || 0) + ' ' + (n.position().y || 0),
      category: n.data('shape'),
      color: n.data('color'),
      borderColor: n.data('borderColor')
    }));
    const linkDataArray = cy.edges().map(e => ({ from: e.data('source'), to: e.data('target') }));
    const data = { nodeDataArray, linkDataArray };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'algorigramme.json';
    a.click();
    URL.revokeObjectURL(a.href);
    console.log('Export JSON réussi');
  } catch (err) {
    console.error('Erreur export JSON:', err);
    alert('Erreur export JSON: ' + err.message);
  }
}

function exportPNG() {
  try {
    const data = cy.png({ full: true, scale: window.innerWidth <= 768 ? 1.2 : 1.5 });
    const a = document.createElement('a');
    a.href = data;
    a.download = 'algorigramme.png';
    a.click();
    console.log('Export PNG réussi');
  } catch (err) {
    console.error('Erreur export PNG:', err);
    alert('Erreur export PNG: ' + err.message);
  }
}
