<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../src/favicon.ico">
    <title>application « compléter »</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 90%;
            margin: 0 auto;
            padding: 2%;
            background-color: #f4f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-size: calc(14px + 0.5vw);
            touch-action: none; /* Empêche le défilement par défaut lors du drag */
        }
        .title-container {
            text-align: center;
            margin-bottom: 1rem;
        }
        .main-title {
            color: red;
            font-size: calc(24px + 2vw);
            font-weight: bold;
            line-height: 1.2;
            margin: 0.5rem 0;
            text-shadow: 0.1rem 0.1rem 0.2rem rgba(0,0,0,0.1);
        }
        .subtitle {
            color: black;
            font-size: calc(12px + 0.8vw);
            line-height: 1;
            margin: 0;
        }
        #text-container {
            background-color: #f4f7fa;
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            line-height: 1.8; /* Réduit pour éviter le chevauchement des dropzones */
            box-shadow: 0.3rem 0.3rem 0.9rem rgba(163,177,198,0.6), -0.3rem -0.3rem 0.9rem rgba(255,255,255, 0.5);
            min-height: 6rem; /* Hauteur minimale pour éviter un conteneur trop petit */
            height: auto; /* S'adapte à la hauteur du contenu */
            font-size: calc(12px + 0.5vw);
        }
        .dropzone {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: clamp(90px, 18vw, 130px);
            height: clamp(24px, 5vw, 28px); /* Hauteur fixe */
            border: none;
            background-color: #f4f7fa;
            margin: 0 0.2rem;
            border-radius: 0.3rem;
            vertical-align: middle;
            box-shadow: inset 0.1rem 0.1rem 0.3rem #babecc, inset -0.3rem -0.3rem 0.6rem #ffffff;
            font-size: calc(10px + 0.5vw);
            line-height: clamp(24px, 5vw, 28px); /* Synchronisé avec la hauteur */
            text-align: center;
            touch-action: none;
        }
        .dropzone.filled {
            width: auto;
            min-width: clamp(70px, 14vw, 100px);
            height: clamp(24px, 5vw, 28px); /* Même hauteur que .dropzone */
            padding: 0 0.8rem; /* Ajustez le padding horizontal, pas vertical */
            background-color: #f4f7fa;
            cursor: move;
            box-shadow: inset 0.1rem 0.1rem 0.3rem #babecc, inset -0.3rem -0.3rem 0.6rem #ffffff;
            font-size: calc(10px + 0.5vw);
            line-height: clamp(24px, 5vw, 28px); /* Synchronisé avec la hauteur */
            text-align: center;
            overflow: hidden; /* Évite que le texte dépasse */
            text-overflow: ellipsis; /* Ajoute des points de suspension si le texte est trop long */
            white-space: nowrap; /* Empêche le texte de passer à la ligne */
        }
        .dropzone.dragging-over {
            background-color: #e0e0e0; /* Feedback visuel quand un mot est au-dessus */
        }
        #words-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
            gap: 0.5rem;
        }
        .draggable-word {
            padding: 0.4rem 0.8rem;
            margin: 0.3rem;
            background-color: #f4f7fa;
            border: none;
            cursor: move;
            user-select: none;
            border-radius: 0.3rem;
            box-shadow: 0.3rem 0.3rem 0.6rem #babecc, -0.3rem -0.3rem 0.6rem #ffffff;
            transition: transform 0.1s ease-in-out;
            font-size: calc(10px + 0.5vw);
            touch-action: none;
            z-index: 10; /* S'assurer que le mot est au-dessus pendant le drag */
        }
        .draggable-word.touched, .dropzone.filled.touched {
            transform: scale(1.1); /* Agrandissement léger au toucher */
            box-shadow: 0.2rem 0.2rem 0.4rem #babecc, -0.2rem -0.2rem 0.4rem #ffffff;
        }
        #button-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 1rem;
            margin: 1rem auto;
        }
        #action-button, #score-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(150px, 30vw, 200px);
            height: clamp(40px, 8vw, 50px);
            background-color: #f4f7fa;
            color: #333;
            border: none;
            border-radius: 0.3rem;
            cursor: pointer;
            box-shadow: 0.3rem 0.3rem 0.6rem #babecc, -0.3rem -0.3rem 0.6rem #ffffff;
            transition: all 0.2s ease-in-out;
            font-size: calc(12px + 0.5vw);
            text-transform: lowercase;
        }
        #action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #action-button:hover:not(:disabled), #score-button:hover {
            box-shadow: 0.1rem 0.1rem 0.3rem #babecc, -0.1rem -0.1rem 0.3rem #ffffff;
        }
        #action-button:active:not(:disabled), #score-button:active {
            box-shadow: inset 0.1rem 0.1rem 0.2rem #babecc, inset -0.1rem -0.1rem 0.2rem #ffffff;
        }
        .reload-symbol {
            color: red;
            font-size: clamp(24px, 6vw, 36px);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-0.1em); /* Déplacer le symbole 0.1 unité plus haut */
        }
        @media (max-width: 600px) {
            body {
                padding: 1rem;
                font-size: calc(12px + 0.5vw);
            }
            .main-title {
                font-size: calc(18px + 2vw);
            }
            .subtitle {
                font-size: calc(10px + 0.8vw);
            }
            #text-container {
                padding: 1rem;
                min-height: 4rem;
                line-height: 1.8; /* Réduit pour mobile */
            }
            .dropzone {
                width: clamp(70px, 20vw, 110px);
                height: clamp(20px, 5.5vw, 24px); /* Hauteur fixe pour mobile */
                font-size: calc(8px + 0.5vw);
                margin: 0 0.2rem;
                line-height: clamp(20px, 5.5vw, 24px); /* Synchronisé avec la hauteur */
            }
            .dropzone.filled {
                min-width: clamp(60px, 16vw, 90px);
                height: clamp(20px, 5.5vw, 24px); /* Même hauteur que .dropzone pour mobile */
                padding: 0 0.6rem;
                font-size: calc(8px + 0.5vw);
                line-height: clamp(20px, 5.5vw, 24px); /* Synchronisé avec la hauteur */
            }
            .draggable-word {
                padding: 0.3rem 0.6rem;
                font-size: calc(8px + 0.5vw);
            }
            #button-container {
                flex-direction: column;
                gap: 0.5rem;
            }
            #action-button, #score-button {
                width: clamp(120px, 40vw, 160px);
                height: clamp(35px, 10vw, 45px);
                font-size: calc(10px + 0.5vw);
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <p class="main-title">application « compléter »</p>
        <p class="subtitle">compléter par drag and drop</p>
    </div>
    <div id="text-container"></div>
    <div id="words-container"></div>
    <div id="button-container">
        <button id="action-button" disabled>vérifier</button>
        <button id="score-button">score : 0 / 0</button>
    </div>
    <script src="fichier_à_modifier.js"></script>
    <script>
        let currentTextIndex = 0;
        let currentState = "verify";
        let correctAnswers = 0;
        let totalAnswers = 0;
        const textContainer = document.getElementById("text-container");
        const wordsContainer = document.getElementById("words-container");
        const actionButton = document.getElementById("action-button");
        const scoreButton = document.getElementById("score-button");
        let draggedElement = null;

        function getRandomIndex(max) {
            return Math.floor(Math.random() * max);
        }

        function updateButtonState() {
            const dropzones = textContainer.querySelectorAll(".dropzone");
            const allFilled = Array.from(dropzones).every(zone => zone.textContent.trim() !== "");
            actionButton.disabled = !allFilled;
        }

        function updateDropzoneState() {
            const dropzones = textContainer.querySelectorAll(".dropzone");
            dropzones.forEach(zone => {
                if (zone.textContent.trim() !== "") {
                    zone.classList.add("filled");
                    zone.setAttribute("draggable", "true");
                } else {
                    zone.classList.remove("filled");
                    zone.removeAttribute("draggable");
                }
            });
        }

        function displayText(index) {
            const text = texts[index];
            const words = text.split(/\s+/); // Diviser la citation en mots
            const validWords = words.filter(word => word.length > 3 && !/[.,!?]/.test(word)); // Mots de plus de 3 lettres, sans ponctuation

            if (validWords.length < 5) {
                // Si moins de 5 mots valides, afficher la citation sans zone de dépôt
                textContainer.innerHTML = text;
                wordsContainer.innerHTML = "<p>pas assez de mots valides pour cette citation.</p>";
                actionButton.disabled = true;
                return;
            }

            // Choisir 5 à 6 mots aléatoires
            const numWordsToSelect = Math.floor(Math.random() * 2) + 5; // 5 ou 6
            const selectedWords = [];
            const usedIndices = new Set();
            while (selectedWords.length < numWordsToSelect && usedIndices.size < validWords.length) {
                const randomIndex = getRandomIndex(validWords.length);
                if (!usedIndices.has(randomIndex)) {
                    usedIndices.add(randomIndex);
                    selectedWords.push(validWords[randomIndex]);
                }
            }

            // Si pas assez de mots sélectionnés, compléter avec les mots restants
            if (selectedWords.length < numWordsToSelect) {
                const remainingWords = validWords.filter((_, i) => !usedIndices.has(i));
                for (let i = 0; selectedWords.length < numWordsToSelect && i < remainingWords.length; i++) {
                    selectedWords.push(remainingWords[i]);
                }
            }

            // Remplacer les mots sélectionnés par des zones de dépôt
            let modifiedText = text;
            selectedWords.forEach(word => {
                // Échapper les caractères spéciaux pour le regex
                const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`\\b${escapedWord}\\b`, "gi");
                modifiedText = modifiedText.replace(regex, `<span class="dropzone" data-answer="${word}"></span>`);
            });

            textContainer.innerHTML = modifiedText;

            // Afficher les mots sélectionnés comme éléments déplaçables, dans un ordre aléatoire
            wordsContainer.innerHTML = selectedWords
                .sort(() => Math.random() - 0.5)
                .map(word => `<span class="draggable-word" draggable="true">${word}</span>`)
                .join("");

            addDragAndDropListeners();
            updateButtonState();
            updateDropzoneState();
        }

        function addDragAndDropListeners() {
            // Écouteurs pour les mots dans #words-container
            document.querySelectorAll('.draggable-word').forEach(word => {
                word.removeEventListener('dragstart', dragStart);
                word.removeEventListener('dragend', dragEnd);
                word.removeEventListener('touchstart', touchStart);
                word.removeEventListener('touchmove', touchMove);
                word.removeEventListener('touchend', touchEnd);
                word.addEventListener('dragstart', dragStart);
                word.addEventListener('dragend', dragEnd);
                word.addEventListener('touchstart', touchStart, { passive: false });
                word.addEventListener('touchmove', touchMove, { passive: false });
                word.addEventListener('touchend', touchEnd, { passive: false });
            });
            // Écouteurs pour les dropzones (vides ou remplies)
            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.removeEventListener('dragover', dragOver);
                zone.removeEventListener('dragenter', dragEnter);
                zone.removeEventListener('dragleave', dragLeave);
                zone.removeEventListener('drop', drop);
                zone.removeEventListener('touchenter', touchEnter);
                zone.removeEventListener('touchleave', touchLeave);
                zone.removeEventListener('dragstart', dragStart);
                zone.removeEventListener('dragend', dragEnd);
                zone.removeEventListener('touchstart', touchStart);
                zone.removeEventListener('touchmove', touchMove);
                zone.removeEventListener('touchend', touchEnd);
                // Écouteurs pour le dépôt
                zone.addEventListener('dragover', dragOver);
                zone.addEventListener('dragenter', dragEnter);
                zone.addEventListener('dragleave', dragLeave);
                zone.addEventListener('drop', drop);
                zone.addEventListener('touchenter', touchEnter, { passive: false });
                zone.addEventListener('touchleave', touchLeave, { passive: false });
                // Écouteurs pour le drag si la dropzone est remplie
                if (zone.textContent.trim() !== "") {
                    zone.addEventListener('dragstart', dragStart);
                    zone.addEventListener('dragend', dragEnd);
                    zone.addEventListener('touchstart', touchStart, { passive: false });
                    zone.addEventListener('touchmove', touchMove, { passive: false });
                    zone.addEventListener('touchend', touchEnd, { passive: false });
                }
            });
            // Écouteurs pour #words-container comme zone de dépôt
            wordsContainer.removeEventListener('dragover', dragOver);
            wordsContainer.removeEventListener('dragenter', dragEnter);
            wordsContainer.removeEventListener('dragleave', dragLeave);
            wordsContainer.removeEventListener('drop', dropWordsContainer);
            wordsContainer.addEventListener('dragover', dragOver);
            wordsContainer.addEventListener('dragenter', dragEnter);
            wordsContainer.addEventListener('dragleave', dragLeave);
            wordsContainer.addEventListener('drop', dropWordsContainer);
        }

        // Gestion des événements pour la souris
        function dragStart(e) {
            if (e.target.classList.contains('draggable-word') || e.target.classList.contains('dropzone')) {
                e.dataTransfer.setData('text/plain', e.target.textContent);
                e.dataTransfer.setData('source', e.target.classList.contains('dropzone') ? 'dropzone' : 'words-container');
                e.target.classList.add('touched');
                draggedElement = e.target;
            }
        }

        function dragEnd(e) {
            e.target.classList.remove('touched');
            draggedElement = null;
            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.classList.remove('dragging-over');
            });
            wordsContainer.classList.remove('dragging-over');
            updateButtonState();
            updateDropzoneState();
            addDragAndDropListeners();
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function dragEnter(e) {
            if (e.target.classList.contains('dropzone') || e.target === wordsContainer) {
                e.target.classList.add('dragging-over');
            }
        }

        function dragLeave(e) {
            if (e.target.classList.contains('dropzone') || e.target === wordsContainer) {
                e.target.classList.remove('dragging-over');
            }
        }

        function drop(e) {
            if (e.target.classList.contains('dropzone')) {
                e.preventDefault();
                const newWord = e.dataTransfer.getData('text/plain');
                const source = e.dataTransfer.getData('source');
                const oldWord = e.target.textContent;

                if (oldWord) {
                    const oldWordElement = document.createElement('span');
                    oldWordElement.className = 'draggable-word';
                    oldWordElement.draggable = true;
                    oldWordElement.textContent = oldWord;
                    wordsContainer.appendChild(oldWordElement);
                }

                e.target.textContent = newWord;
                e.target.title = newWord; // Ajout de l'attribut title
                e.target.classList.remove('dragging-over');

                if (draggedElement && source === 'dropzone') {
                    draggedElement.textContent = "";
                    draggedElement.removeAttribute('title');
                } else if (draggedElement && source === 'words-container') {
                    draggedElement.remove();
                }

                updateButtonState();
                updateDropzoneState();
                addDragAndDropListeners();
            }
        }

        function dropWordsContainer(e) {
            e.preventDefault();
            const newWord = e.dataTransfer.getData('text/plain');
            const source = e.dataTransfer.getData('source');

            if (source === 'dropzone') {
                const newWordElement = document.createElement('span');
                newWordElement.className = 'draggable-word';
                newWordElement.draggable = true;
                newWordElement.textContent = newWord;
                wordsContainer.appendChild(newWordElement);
            }

            if (draggedElement && source === 'dropzone') {
                draggedElement.textContent = "";
                draggedElement.removeAttribute('title');
            }

            wordsContainer.classList.remove('dragging-over');
            updateButtonState();
            updateDropzoneState();
            addDragAndDropListeners();
        }

        // Gestion des événements tactiles
        function touchStart(e) {
            if (e.target.classList.contains('draggable-word') || e.target.classList.contains('dropzone')) {
                e.preventDefault();
                e.target.classList.add('touched');
                draggedElement = e.target;
                draggedElement.dataset.word = e.target.textContent;
                draggedElement.dataset.source = e.target.classList.contains('dropzone') ? 'dropzone' : 'words-container';
            }
        }

        function touchMove(e) {
            if (!draggedElement) return;
            e.preventDefault();
            const touch = e.touches[0];

            requestAnimationFrame(() => {
                draggedElement.style.position = 'fixed';
                draggedElement.style.left = `${touch.clientX - draggedElement.offsetWidth / 2}px`;
                draggedElement.style.top = `${touch.clientY - draggedElement.offsetHeight / 2}px`;

                draggedElement.style.visibility = 'hidden';
                const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                draggedElement.style.visibility = 'visible';

                document.querySelectorAll('.dropzone').forEach(zone => {
                    zone.classList.remove('dragging-over');
                });
                wordsContainer.classList.remove('dragging-over');
                if (elementBelow && (elementBelow.classList.contains('dropzone') || elementBelow === wordsContainer)) {
                    elementBelow.classList.add('dragging-over');
                }
            });
        }

        function touchEnd(e) {
            if (!draggedElement) return;
            e.preventDefault();
            const touch = e.changedTouches[0];

            draggedElement.style.visibility = 'hidden';
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            draggedElement.style.visibility = 'visible';

            draggedElement.style.position = '';
            draggedElement.style.left = '';
            draggedElement.style.top = '';
            draggedElement.classList.remove('touched');

            if (elementBelow && elementBelow.classList.contains('dropzone')) {
                const newWord = draggedElement.dataset.word;
                const source = draggedElement.dataset.source;
                const oldWord = elementBelow.textContent;

                if (oldWord) {
                    const oldWordElement = document.createElement('span');
                    oldWordElement.className = 'draggable-word';
                    oldWordElement.draggable = true;
                    oldWordElement.textContent = oldWord;
                    wordsContainer.appendChild(oldWordElement);
                }

                elementBelow.textContent = newWord;
                elementBelow.title = newWord; // Ajout de l'attribut title
                elementBelow.classList.remove('dragging-over');

                if (source === 'dropzone') {
                    draggedElement.textContent = "";
                    draggedElement.removeAttribute('title');
                } else if (source === 'words-container') {
                    draggedElement.remove();
                }
            } else if (elementBelow && (elementBelow === wordsContainer || elementBelow.closest('#words-container'))) {
                const newWord = draggedElement.dataset.word;
                const source = draggedElement.dataset.source;

                if (source === 'dropzone') {
                    const newWordElement = document.createElement('span');
                    newWordElement.className = 'draggable-word';
                    newWordElement.draggable = true;
                    newWordElement.textContent = newWord;
                    wordsContainer.appendChild(newWordElement);
                    draggedElement.textContent = "";
                    draggedElement.removeAttribute('title');
                }
            }

            draggedElement = null;
            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.classList.remove('dragging-over');
            });
            wordsContainer.classList.remove('dragging-over');

            updateButtonState();
            updateDropzoneState();
            addDragAndDropListeners();
        }

        function touchEnter(e) {
            if (e.target.classList.contains('dropzone') || e.target === wordsContainer) {
                e.target.classList.add('dragging-over');
            }
        }

        function touchLeave(e) {
            if (e.target.classList.contains('dropzone') || e.target === wordsContainer) {
                e.target.classList.remove('dragging-over');
            }
        }

        function verifyAnswers() {
            const dropzones = textContainer.querySelectorAll(".dropzone");
            let correctCount = 0;

            dropzones.forEach(zone => {
                if (zone.textContent.toLowerCase() === zone.dataset.answer.toLowerCase()) {
                    zone.style.backgroundColor = "#90EE90";
                    correctCount++;
                } else {
                    zone.style.backgroundColor = "#FFB6C1";
                }
            });

            correctAnswers += correctCount;
            totalAnswers += dropzones.length;
            scoreButton.textContent = `score : ${correctAnswers} / ${totalAnswers}`;

            const allCorrect = correctCount === dropzones.length;

            return allCorrect;
        }

        function showCorrections() {
            const dropzones = textContainer.querySelectorAll(".dropzone");
            const words = document.querySelectorAll(".draggable-word");

            dropzones.forEach((zone) => {
                const correctWord = zone.dataset.answer;
                const currentWord = zone.textContent;

                if (currentWord.toLowerCase() !== correctWord.toLowerCase()) {
                    zone.textContent = correctWord;
                    zone.title = correctWord; // Ajout de l'attribut title pour la correction
                    zone.style.backgroundColor = "#90EE90";
                }
                zone.classList.remove("filled");
                zone.removeAttribute("draggable");
            });

            setTimeout(() => {
                words.forEach(word => word.remove());
            }, 500);
        }

        function resetDropzones() {
            const dropzones = textContainer.querySelectorAll(".dropzone");
            dropzones.forEach(zone => {
                zone.textContent = "";
                zone.style.backgroundColor = "#f4f7fa";
                zone.classList.remove("filled");
                zone.removeAttribute("draggable");
                zone.removeAttribute("title");
            });
            updateButtonState();
            updateDropzoneState();
        }

        actionButton.addEventListener("click", () => {
            switch (currentState) {
                case "verify":
                    if (verifyAnswers()) {
                        actionButton.innerHTML = "<span class='reload-symbol'>&#8635;</span>";
                        currentState = "change";
                    } else {
                        actionButton.textContent = "correction";
                        currentState = "correct";
                    }
                    break;
                case "correct":
                    showCorrections();
                    actionButton.innerHTML = "<span class='reload-symbol'>&#8635;</span>";
                    currentState = "change";
                    break;
                case "change":
                    currentTextIndex = getRandomIndex(texts.length);
                    displayText(currentTextIndex);
                    resetDropzones();
                    actionButton.textContent = "vérifier";
                    currentState = "verify";
                    break;
            }
        });

        currentTextIndex = getRandomIndex(texts.length);
        displayText(currentTextIndex);
    </script>
</body>
</html>
