<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modifier une application « distinguer »</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.rel='stylesheet'">
    <link rel="icon" href="favicon.ico" />
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px;
            background-color: #e0e0e0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: all 0.3s ease;
        }
        :root { --text-scale: 1; --base-font-size: 16px; }
        body { font-size: calc(var(--base-font-size) * var(--text-scale)); }
        .title-inputs input, input, select, button, .tooltip, .settings-group h3, .color-label-item, .checkbox-item label, .select-group label, .default-mode-label {
            font-size: calc(1rem * var(--text-scale));
        }
        h1 { font-size: calc(clamp(1.8rem, 5vw, 2.5rem) * var(--text-scale)); color: red; text-align: center; text-shadow: 1px 1px 2px #bebebe, -1px -1px 2px #ffffff; transition: all 0.3s ease; }
        .loading { font-size: calc(1rem * var(--text-scale)); display: none; color: #333; margin-top: 10px; }
        .entry, .title-inputs, .part-entry { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; max-width: 800px; align-items: stretch; }
        .entry-container, .part-container { width: 100%; }
        .entry, .part-entry { padding: 0; border: none; box-shadow: none; background-color: transparent; }
        input, select {
            padding: 5px; width: 100%; border: none; border-radius: 8px; background-color: #e0e0e0;
            box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; font-size: calc(1rem * var(--text-scale));
            outline: none; transition: all 0.2s ease;
        }
        input:focus, select:focus { box-shadow: inset 1px 1px 3px #bebebe, inset -1px -1px 3px #ffffff; }
        button {
            padding: 10px; background-color: #e0e0e0; color: #333; border: none; border-radius: 8px;
            cursor: pointer; font-size: calc(1rem * var(--text-scale)); box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; position: relative;
        }
        button:hover { background-color: #d0d0d0; box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; }
        button:active { box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; }
        .remove-button, .add-button, .open-button, .save-button, .add-part-button, .remove-part-button, .settings-button { width: 40px; height: 40px; }
        .remove-button .cross, .remove-part-button .cross { color: red; font-size: 24px; transform: translateY(-1px); font-style: normal; }
        .add-button .plus, .add-part-button .plus { font-size: 24px; transform: translateY(-1px); font-style: normal; }
        i.far, i.fas { font-style: normal !important; }
        .button-container { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; width: 100%; }
        .title-inputs input { width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 40px; }
        #file-input { display: none; }
        .part-container { margin-left: 20px; border-left: 2px solid #ccc; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; }
        .part-examples { margin-top: 5px; }
        .button-container button i { color: #000; }
        .button-container button:hover i { color: #000; }
        .svg-icon { width: 24px; height: 24px; stroke: #333; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .fa-folder-open::before { content: "📂"; font-style: normal; color: #000; }
        .fa-save::before { content: "💾"; font-style: normal; color: #000; }
        .fa-times::before { content: "✗"; color: #000; font-style: normal; }
        .fa-plus::before { content: "+"; font-style: normal; color: #000; }
        .fa-cog::before { content: "⚙"; font-style: normal; color: #000; }
        .tooltip {
            position: absolute; background-color: white; color: black; padding: 5px 10px; border-radius: 4px;
            white-space: nowrap; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); border: 1px solid #ccc; bottom: 100%; left: 50%;
            transform: translateX(-50%); margin-bottom: 5px;
        }
        button:hover .tooltip { opacity: 1; }
        .settings-panel {
            display: none; width: 100%; max-width: 800px; margin-top: 20px; padding: 20px; border-radius: 8px;
            background-color: #e0e0e0; box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
        }
        .settings-group { margin-bottom: 20px; }
        .settings-group h3 { margin-top: 0; margin-bottom: 10px; color: #333; transition: all 0.3s ease; }
        .color-picker { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .color-picker label { width: 150px; text-align: right; }
        .color-picker input[type="color"], .color-input-item input[type="color"] {
            width: 40px; height: 40px; padding: 0; border: none; cursor: pointer; border-radius: 50%;
            box-shadow: 2px 2px 5px #bebebe, -2px -2px 5px #ffffff;
        }
        .color-picker input[type="color"]:hover, .color-input-item input[type="color"]:hover { box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; }
        .checkbox-group { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .checkbox-group label { width: auto; }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; }
        .select-group { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .select-group label { width: 180px; transition: all 0.3s ease; }
        .select-group select { flex: 1; min-width: 250px; }
        .color-settings-container { display: flex; gap: 0px; width: 100%; }
        .color-labels-column { flex: 0 0 160px; display: flex; flex-direction: column; gap: 10px; padding-right: 15px; }
        .color-label-item { height: 40px; display: flex; align-items: center; justify-content: flex-end; text-align: right; margin-bottom: 10px; font-weight: normal; transition: all 0.3s ease; }
        .color-modes-columns { flex: 1; display: flex; gap: 20px; }
        .color-mode-column { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .color-mode-column h3 { text-align: center; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; }
        .mode-icon { width: 20px; height: 20px; }
        .color-input-item { height: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .separator { height: 2px; background: linear-gradient(to right, transparent, #bebebe, transparent); margin: 25px 0; width: 100%; }
        .checkbox-horizontal { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }
        .checkbox-item { display: flex; gap: 5px; align-items: center; white-space: nowrap; flex-shrink: 0; }
        .checkbox-item label { transition: all 0.3s ease; }
        .default-mode-label { font-weight: bold; margin-right: 5px; white-space: nowrap; transition: all 0.3s ease; }
        .font-size-control-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .font-size-display {
            display: flex; align-items: center; gap: 8px; background: #e0e0e0; border-radius: 8px; padding: 4px 8px;
            box-shadow: inset 2px 2px 4px #bebebe, inset -2px -2px 4px #ffffff; min-width: 70px; justify-content: center; height: 32px;
        }
        .font-size-value { color: #333; min-width: 40px; text-align: center; }
        .triangle-buttons { display: flex; flex-direction: column; gap: 2px; height: 32px; }
        .triangle-btn {
            width: 24px; height: 15px; background: #e0e0e0; border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; box-shadow: 2px 2px 4px #bebebe, -2px -2px 4px #ffffff;
            border-radius: 4px; padding: 0; color: #333; transition: all 0.2s ease;
        }
        .triangle-btn:hover { box-shadow: 1px 1px 2px #bebebe, -1px -1px 2px #ffffff; }
        .triangle-btn:active { box-shadow: inset 1px 1px 2px #bebebe, inset -1px -1px 2px #ffffff; }
        .triangle-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .triangle-up svg, .triangle-down svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .category-name-left, .category-name-right {
            padding: 5px; width: 100%; border: none; border-radius: 8px; background-color: #e0e0e0;
            box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; font-size: calc(1rem * var(--text-scale));
            outline: none; transition: all 0.2s ease; text-align: center; display: flex; align-items: center;
            justify-content: center; min-height: 40px; height: auto;
        }
        .category-name-left:focus, .category-name-right:focus { box-shadow: inset 1px 1px 3px #bebebe, inset -1px -1px 3px #ffffff; }
        .remove-button, .add-button { display: flex; align-items: center; justify-content: center; height: auto; }
        
        /* ===== OVERLAY DRAG & DROP (SANS pointer-events: none) ===== */
        #drop-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(224, 224, 224, 0.95); z-index: 99999;
            display: none; align-items: center; justify-content: center; flex-direction: column;
            border: 4px dashed #333;
        }
        #drop-overlay h2 { color: #333; font-size: 2rem; text-align: center; pointer-events: none; }
        /* ===== FIN OVERLAY DRAG & DROP ===== */

        @media (max-width: 768px) {
            .tooltip { font-size: 0.75rem; padding: 3px 6px; }
            .entry, .title-inputs, .part-entry { flex-direction: column; gap: 5px; align-items: stretch; }
            .remove-button, .add-button, .add-part-button, .remove-part-button, .settings-button { width: 100%; height: 36px; }
            .color-picker, .checkbox-group, .select-group { flex-direction: column; align-items: flex-start; }
            .color-picker label, .checkbox-group label, .select-group label { width: 100%; margin-bottom: 5px; text-align: left; }
            .color-settings-container { flex-direction: column; }
            .color-labels-column { flex: none; width: 100%; padding-right: 0; }
            .color-label-item { justify-content: flex-start; text-align: left; }
            .color-modes-columns { flex-direction: column; }
            .checkbox-horizontal { flex-wrap: wrap; gap: 10px; overflow-x: visible; }
            .select-group label { width: 100%; }
            .select-group select { min-width: auto; width: 100%; }
            h1 { font-size: calc(clamp(1.5rem, 4vw, 2rem) * var(--text-scale)); }
            .category-name-left, .category-name-right { width: 100%; min-height: 36px; }
            .entry { flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .tooltip { font-size: 0.65rem; padding: 2px 5px; }
            .checkbox-horizontal { flex-direction: column; align-items: flex-start; gap: 8px; }
            .category-name-left, .category-name-right { width: 100%; min-height: 36px; }
        }
    </style>
</head>
<body>
    <div id="drop-overlay">
        <h2>📂 Déposez le fichier .js ici</h2>
    </div>

    <h1>modifier une application « distinguer »</h1>
    
    <div class="title-inputs">
        <input type="text" id="app-title" placeholder="titre de l'application">
        <input type="text" id="app-subtitle" placeholder="sous-titre de l'application">
    </div>
    
    <div id="entries" class="entry-container">
        <div class="entry">
            <button onclick="removeEntry(this)" class="remove-button">
                <i class="far fa-times cross"></i>
                <span class="tooltip">supprimer cette catégorie</span>
            </button>
            <input type="text" placeholder="nom de la catégorie gauche" class="category-name-left">
            <input type="text" placeholder="nom de la catégorie droite" class="category-name-right">
            <div class="part-container">
                <div class="part-entry">
                    <button onclick="removePart(this)" class="remove-part-button">
                        <i class="far fa-times cross"></i>
                        <span class="tooltip">supprimer cette sous-catégorie</span>
                    </button>
                    <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                    <button onclick="addPart(this)" class="add-part-button">
                        <i class="far fa-plus plus"></i>
                        <span class="tooltip">ajouter une sous-catégorie</span>
                    </button>
                </div>
            </div>
            <button onclick="addEntry()" class="add-button">
                <i class="far fa-plus plus"></i>
                <span class="tooltip">ajouter une nouvelle catégorie</span>
            </button>
        </div>
    </div>
    
    <div class="button-container">
        <button onclick="openFile()" class="open-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-labelledby="open-folder-title" role="img">           
              <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10z"/>
            </svg>
            <span class="tooltip">ouvrir un fichier javaScript</span>
        </button>

        <button onclick="toggleSettings()" class="settings-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-labelledby="settings-title" role="img">       
              <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.08-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.08.49 0 .61.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>         
		   </svg>
            <span class="tooltip">paramètres avancés</span>
        </button>

        <button onclick="saveData()" class="save-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-labelledby="save-title" role="img">           
              <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zM12 12c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/>
            </svg>
            <span class="tooltip">sauvegarder les données</span>
        </button>

        <input type="file" id="file-input" accept=".js" style="display: none;" onchange="loadFile(event)">
    </div>
    
    <div id="settings-panel" class="settings-panel">
        <div class="settings-group">
            <h3>paramètres d'affichage</h3>
            <div class="select-group">
                <label for="font-family">police de caractères&nbsp;:</label>
                <select id="font-family">
                    <option value="'Muli', Arial, sans-serif">muli (par défaut)</option>
                    <option value="Arial, sans-serif">arial</option>
                    <option value="'Helvetica Neue', Helvetica, sans-serif">helvetica</option>
                    <option value="'Segoe UI', Tahoma, Geneva, sans-serif">segoe ui</option>
                    <option value="'Times New Roman', Times, serif">times new roman</option>
                    <option value="'Courier New', Courier, monospace">courier new</option>
                </select>
            </div>
            <div class="select-group">
                <label for="title-size">taille du titre&nbsp;:</label>
                <select id="title-size">
                    <option value="clamp(1.8rem, 5vw, 2.5rem)">normale (par défaut)</option>
                    <option value="clamp(1.5rem, 4vw, 2rem)">petite</option>
                    <option value="clamp(2rem, 6vw, 3rem)">grande</option>
                </select>
            </div>
            <div class="select-group">
                <label for="cell-size">taille des cellules&nbsp;:</label>
                <select id="cell-size">
                    <option value="clamp(0.9rem, 2.5vw, 1rem)">normale (par défaut)</option>
                    <option value="clamp(0.8rem, 2vw, 0.9rem)">petite</option>
                    <option value="clamp(1rem, 3vw, 1.2rem)">grande</option>
                </select>
            </div>
            <div class="select-group">
                <label for="global-text-size">taille du texte global&nbsp;:</label>
                <div class="font-size-control-group">
                    <div class="font-size-display">
                        <span class="font-size-value" id="fontSizeValue">16px</span>
                    </div>
                    <div class="triangle-buttons">
                        <button class="triangle-btn triangle-up" id="fontSizeUpBtn" title="augmenter la taille">
                            <svg viewBox="0 0 12 12" fill="none"><path d="M3 7L6 4L9 7" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                        <button class="triangle-btn triangle-down" id="fontSizeDownBtn" title="diminuer la taille">
                            <svg viewBox="0 0 12 12" fill="none"><path d="M3 5L6 8L9 5" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="checkbox-horizontal">
                <span class="default-mode-label">mode par défaut&nbsp;:</span>
                <div class="checkbox-item">
                    <input type="checkbox" id="enable-animations" checked>
                    <label for="enable-animations">animations</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="enable-dark-mode">
                    <label for="enable-dark-mode">mode sombre</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="enable-colorblind-mode">
                    <label for="enable-colorblind-mode">mode daltonien</label>
                </div>
            </div>
        </div>
        <div class="separator"></div>
        <div class="settings-group">
            <h3>couleur en fonction du mode clair / sombre</h3>
            <div class="color-settings-container">
                <div class="color-labels-column">
                    <div class="color-label-item" style="height: 40px; margin-bottom: 15px;"></div>
                    <div class="color-label-item">titre&nbsp;:</div>
                    <div class="color-label-item">sous-titre&nbsp;:</div>
                    <div class="color-label-item">texte&nbsp;:</div>
                    <div class="color-label-item">fond&nbsp;:</div>
                    <div class="color-label-item">cellules&nbsp;:</div>
                    <div class="color-label-item">boutons&nbsp;:</div>
                    <div class="color-label-item">bonnes réponses&nbsp;:</div>
                    <div class="color-label-item">réponses fausses&nbsp;:</div>
                </div>
                <div class="color-modes-columns">
                    <div class="color-mode-column">
                        <h3 style="height: 40px; margin-bottom: 15px;">
                            <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </h3>
                        <div class="color-input-item"><input type="color" id="title-color" value="#ff0000"></div>
                        <div class="color-input-item"><input type="color" id="subtitle-color" value="#000000"></div>
                        <div class="color-input-item"><input type="color" id="text-color" value="#000000"></div>
                        <div class="color-input-item"><input type="color" id="background-color" value="#f0f0f0"></div>
                        <div class="color-input-item"><input type="color" id="cell-color" value="#e0e0e0"></div>
                        <div class="color-input-item"><input type="color" id="button-color" value="#e0e0e0"></div>
                        <div class="color-input-item"><input type="color" id="correct-color" value="#008000"></div>
                        <div class="color-input-item"><input type="color" id="incorrect-color" value="#ff0000"></div>
                    </div>
                    <div class="color-mode-column">
                        <h3 style="height: 40px; margin-bottom: 15px;">
                            <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </h3>
                        <div class="color-input-item"><input type="color" id="title-color-dark" value="#ff6666"></div>
                        <div class="color-input-item"><input type="color" id="subtitle-color-dark" value="#ffffff"></div>
                        <div class="color-input-item"><input type="color" id="text-color-dark" value="#ffffff"></div>
                        <div class="color-input-item"><input type="color" id="background-color-dark" value="#121212"></div>
                        <div class="color-input-item"><input type="color" id="cell-color-dark" value="#2d2d2d"></div>
                        <div class="color-input-item"><input type="color" id="button-color-dark" value="#3d3d3d"></div>
                        <div class="color-input-item"><input type="color" id="correct-color-dark" value="#4CAF50"></div>
                        <div class="color-input-item"><input type="color" id="incorrect-color-dark" value="#f44336"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="separator"></div>
        <div class="settings-group">
            <h3>paramètres du jeu</h3>
            <div class="select-group">
                <label for="max-examples">nombre maximum d'exemples par catégorie&nbsp;:</label>
                <select id="max-examples">
                    <option value="5">5 (par défaut)</option><option value="3">3</option><option value="4">4</option>
                    <option value="6">6</option><option value="7">7</option><option value="8">8</option>
                    <option value="9">9</option><option value="10">10</option>
                </select>
            </div>
            <div class="checkbox-horizontal">
                <div class="checkbox-item"><input type="checkbox" id="show-score" checked><label for="show-score">score</label></div>
                <div class="checkbox-item"><input type="checkbox" id="random-order" checked><label for="random-order">mélanger l'ordre des éléments</label></div>
                <div class="checkbox-item"><input type="checkbox" id="show-hints" checked><label for="show-hints">afficher les indices</label></div>
            </div>
        </div>
    </div>
    
    <div id="loading" class="loading">chargement...</div>
    
    <script>
        let settings = {
            titleColor: "#ff0000", subtitleColor: "#000000", textColor: "#000000", backgroundColor: "#f0f0f0",
            cellColor: "#e0e0e0", buttonColor: "#e0e0e0", correctColor: "#008000", incorrectColor: "#ff0000",
            titleColorDark: "#ff6666", subtitleColorDark: "#ffffff", textColorDark: "#ffffff", backgroundColorDark: "#121212",
            cellColorDark: "#2d2d2d", buttonColorDark: "#3d3d3d", correctColorDark: "#4CAF50", incorrectColorDark: "#f44336",
            fontFamily: "'Muli', Arial, sans-serif", titleSize: "clamp(1.8rem, 5vw, 2.5rem)", cellSize: "clamp(0.9rem, 2.5vw, 1rem)",
            enableAnimations: true, enableDarkMode: false, enableColorblindMode: false, maxExamples: 5,
            showScore: true, randomOrder: true, showHints: true, baseFontSize: 16
        };
        let fontSizePx = 16;
        
        function addEntry() {
            const entriesDiv = document.getElementById('entries');
            const newEntry = document.createElement('div');
            newEntry.className = 'entry';
            newEntry.innerHTML = `
                <button onclick="removeEntry(this)" class="remove-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette catégorie</span></button>
                <input type="text" placeholder="nom de la catégorie gauche" class="category-name-left">
                <input type="text" placeholder="nom de la catégorie droite" class="category-name-right">
                <div class="part-container">
                    <div class="part-entry">
                        <button onclick="removePart(this)" class="remove-part-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette sous-catégorie</span></button>
                        <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                        <button onclick="addPart(this)" class="add-part-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une sous-catégorie</span></button>
                    </div>
                </div>
                <button onclick="addEntry()" class="add-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une nouvelle catégorie</span></button>`;
            entriesDiv.appendChild(newEntry);
        }

        function removeEntry(button) {
            if (document.querySelectorAll('.entry').length > 1) button.parentElement.remove();
        }

        function addPart(button) {
            const partContainer = button.parentElement.parentElement;
            const newPart = document.createElement('div');
            newPart.className = 'part-entry';
            newPart.innerHTML = `
                <button onclick="removePart(this)" class="remove-part-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette sous-catégorie</span></button>
                <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                <button onclick="addPart(this)" class="add-part-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une sous-catégorie</span></button>`;
            partContainer.appendChild(newPart);
        }

        function removePart(button) {
            const partContainer = button.parentElement.parentElement;
            if (partContainer.querySelectorAll('.part-entry').length > 1) button.parentElement.remove();
        }
        
        function toggleSettings() {
            const settingsPanel = document.getElementById('settings-panel');
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
        }
        
        function setupColorPickers() {
            document.querySelectorAll('input[type="color"]').forEach(input => {
                input.addEventListener('input', function() {
                    if (this.id === 'button-color' || this.id === 'button-color-dark') updateHoverColor();
                });
            });
        }
        
        function updateHoverColor() {
            const buttonColor = document.getElementById('button-color').value;
            const darkerColor = shadeColor(buttonColor, -20);
            let style = document.getElementById('dynamic-hover-styles');
            if (!style) {
                style = document.createElement('style');
                style.id = 'dynamic-hover-styles';
                document.head.appendChild(style);
            }
            style.textContent = `button:hover { background-color: ${darkerColor}; box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff; }`;
        }

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16), G = parseInt(color.substring(3,5),16), B = parseInt(color.substring(5,7),16);
            R = Math.min(255, Math.round(R * (100 + percent) / 100));
            G = Math.min(255, Math.round(G * (100 + percent) / 100));
            B = Math.min(255, Math.round(B * (100 + percent) / 100));
            const RR = (R.toString(16).length===1) ? "0"+R.toString(16) : R.toString(16);
            const GG = (G.toString(16).length===1) ? "0"+G.toString(16) : G.toString(16);
            const BB = (B.toString(16).length===1) ? "0"+B.toString(16) : B.toString(16);
            return "#"+RR+GG+BB;
        }
        
        function loadSettingsFromFile(loadedSettings) {
            if (loadedSettings) {
                settings = { ...settings, ...loadedSettings };
                document.getElementById('title-color').value = settings.titleColor;
                document.getElementById('subtitle-color').value = settings.subtitleColor;
                document.getElementById('text-color').value = settings.textColor || "#000000";
                document.getElementById('background-color').value = settings.backgroundColor;
                document.getElementById('cell-color').value = settings.cellColor;
                document.getElementById('button-color').value = settings.buttonColor;
                document.getElementById('correct-color').value = settings.correctColor;
                document.getElementById('incorrect-color').value = settings.incorrectColor;
                
                document.getElementById('title-color-dark').value = settings.titleColorDark || "#ff6666";
                document.getElementById('subtitle-color-dark').value = settings.subtitleColorDark || "#ffffff";
                document.getElementById('text-color-dark').value = settings.textColorDark || "#ffffff";
                document.getElementById('background-color-dark').value = settings.backgroundColorDark || "#121212";
                document.getElementById('cell-color-dark').value = settings.cellColorDark || "#2d2d2d";
                document.getElementById('button-color-dark').value = settings.buttonColorDark || "#3d3d3d";
                document.getElementById('correct-color-dark').value = settings.correctColorDark || "#4CAF50";
                document.getElementById('incorrect-color-dark').value = settings.incorrectColorDark || "#f44336";
                
                document.getElementById('font-family').value = settings.fontFamily;
                document.getElementById('title-size').value = settings.titleSize;
                document.getElementById('cell-size').value = settings.cellSize;
                document.getElementById('enable-animations').checked = settings.enableAnimations;
                document.getElementById('enable-dark-mode').checked = settings.enableDarkMode;
                document.getElementById('enable-colorblind-mode').checked = settings.enableColorblindMode;
                document.getElementById('max-examples').value = settings.maxExamples;
                document.getElementById('show-score').checked = settings.showScore;
                document.getElementById('random-order').checked = settings.randomOrder;
                document.getElementById('show-hints').checked = settings.showHints;
                
                if (loadedSettings.baseFontSize) {
                    fontSizePx = loadedSettings.baseFontSize;
                    document.getElementById('fontSizeValue').textContent = fontSizePx + 'px';
                    updateFontSize();
                    updateTriangleButtons();
                }
                updateHoverColor();
            }
        }

        function increaseFontSize() {
            if (fontSizePx < 24) {
                fontSizePx += 1;
                document.getElementById('fontSizeValue').textContent = fontSizePx + 'px';
                updateFontSize();
                updateTriangleButtons();
                localStorage.setItem('fontSizePx', fontSizePx.toString());
            }
        }

        function decreaseFontSize() {
            if (fontSizePx > 8) {
                fontSizePx -= 1;
                document.getElementById('fontSizeValue').textContent = fontSizePx + 'px';
                updateFontSize();
                updateTriangleButtons();
                localStorage.setItem('fontSizePx', fontSizePx.toString());
            }
        }

        function updateFontSize() {
            const scale = fontSizePx / 16;
            document.documentElement.style.setProperty('--text-scale', scale.toString());
            settings.baseFontSize = fontSizePx;
        }

        function updateTriangleButtons() {
            document.getElementById('fontSizeUpBtn').disabled = fontSizePx >= 24;
            document.getElementById('fontSizeDownBtn').disabled = fontSizePx <= 8;
        }

        function setupFontSizeControls() {
            document.getElementById('fontSizeUpBtn').addEventListener('click', increaseFontSize);
            document.getElementById('fontSizeDownBtn').addEventListener('click', decreaseFontSize);
            const savedFontSize = localStorage.getItem('fontSizePx');
            if (savedFontSize) {
                fontSizePx = parseInt(savedFontSize);
                document.getElementById('fontSizeValue').textContent = fontSizePx + 'px';
                updateFontSize();
            }
            updateTriangleButtons();
        }

        function saveData() {
            const title = document.getElementById('app-title').value.trim();
            const subtitle = document.getElementById('app-subtitle').value.trim();
            const entries = document.querySelectorAll('.entry');
            
            settings.titleColor = document.getElementById('title-color').value;
            settings.subtitleColor = document.getElementById('subtitle-color').value;
            settings.textColor = document.getElementById('text-color').value;
            settings.backgroundColor = document.getElementById('background-color').value;
            settings.cellColor = document.getElementById('cell-color').value;
            settings.buttonColor = document.getElementById('button-color').value;
            settings.correctColor = document.getElementById('correct-color').value;
            settings.incorrectColor = document.getElementById('incorrect-color').value;
            
            settings.titleColorDark = document.getElementById('title-color-dark').value;
            settings.subtitleColorDark = document.getElementById('subtitle-color-dark').value;
            settings.textColorDark = document.getElementById('text-color-dark').value;
            settings.backgroundColorDark = document.getElementById('background-color-dark').value;
            settings.cellColorDark = document.getElementById('cell-color-dark').value;
            settings.buttonColorDark = document.getElementById('button-color-dark').value;
            settings.correctColorDark = document.getElementById('correct-color-dark').value;
            settings.incorrectColorDark = document.getElementById('incorrect-color-dark').value;
            
            settings.fontFamily = document.getElementById('font-family').value;
            settings.titleSize = document.getElementById('title-size').value;
            settings.cellSize = document.getElementById('cell-size').value;
            settings.enableAnimations = document.getElementById('enable-animations').checked;
            settings.enableDarkMode = document.getElementById('enable-dark-mode').checked;
            settings.enableColorblindMode = document.getElementById('enable-colorblind-mode').checked;
            settings.maxExamples = parseInt(document.getElementById('max-examples').value);
            settings.showScore = document.getElementById('show-score').checked;
            settings.randomOrder = document.getElementById('random-order').checked;
            settings.showHints = document.getElementById('show-hints').checked;
            settings.baseFontSize = fontSizePx;
            
            let jsContent = '// fichier_ressource.js\n// Application de classement par glisser-déposer\n\n';
            jsContent += `window.title = "${title.replace(/"/g, '\\"')}";\n`;
            jsContent += `window.subtitle = "${subtitle.replace(/"/g, '\\"')}";\n\n`;
            jsContent += 'window.dropzone = [\n';
            
            const validEntries = [];
            entries.forEach(entry => {
                const categoryNameLeft = entry.querySelector('.category-name-left').value.trim();
                const categoryNameRight = entry.querySelector('.category-name-right').value.trim();
                const parts = entry.querySelectorAll('.part-entry');
                if (categoryNameLeft && categoryNameRight && parts.length >= 1) {
                    const leftExamples = [], rightExamples = [];
                    parts.forEach((part, index) => {
                        const examples = part.querySelector('.part-examples').value.trim().split(',').map(ex => ex.trim()).filter(ex => ex);
                        if (index % 2 === 0) leftExamples.push(...examples);
                        else rightExamples.push(...examples);
                    });
                    if (leftExamples.length > 0 || rightExamples.length > 0) {
                        validEntries.push({ categoryNameLeft, categoryNameRight, leftExamples, rightExamples });
                    }
                }
            });
            
            validEntries.forEach((entry, index) => {
                jsContent += `\t{\n\t"colonne_gauche": "${entry.categoryNameLeft.replace(/"/g, '\\"')}",\n\t"colonne_droite": "${entry.categoryNameRight.replace(/"/g, '\\"')}",\n`;
                jsContent += `\t"exemples_gauche": [\n`;
                entry.leftExamples.forEach((ex, exIndex) => {
                    jsContent += `\t\t"${ex.replace(/"/g, '\\"')}"`;
                    if (exIndex < entry.leftExamples.length - 1) jsContent += ',';
                    jsContent += '\n';
                });
                jsContent += `\t],\n`;
                jsContent += `\t"exemples_droite": [\n`;
                entry.rightExamples.forEach((ex, exIndex) => {
                    jsContent += `\t\t"${ex.replace(/"/g, '\\"')}"`;
                    if (exIndex < entry.rightExamples.length - 1) jsContent += ',';
                    jsContent += '\n';
                });
                jsContent += `\t]\n\t}`;
                if (index < validEntries.length - 1) jsContent += ',\n';
                else jsContent += '\n';
            });
            jsContent += '];\n\nwindow.settings = ' + JSON.stringify(settings, null, 4) + ';\n';

            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fichier_ressource.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openFile() {
            document.getElementById('file-input').click();
        }

        // === FONCTION CENTRALISÉE DE TRAITEMENT DU FICHIER ===
        // Adaptée au format RÉEL : window.dropzone avec colonne_gauche/colonne_droite
        function processFile(file) {
            if (!file || !file.name.endsWith('.js')) {
                alert('Veuillez sélectionner un fichier JavaScript (.js).');
                return;
            }

            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsContent = e.target.result;
                    
                    // Parsing adapté au format réel : window.title, window.subtitle, window.dropzone, window.settings
                    const titleMatch = jsContent.match(/window\.title\s*=\s*["']([^"']*)["']/);
                    const subtitleMatch = jsContent.match(/window\.subtitle\s*=\s*["']([^"']*)["']/);
                    const dropzoneMatch = jsContent.match(/window\.dropzone\s*=\s*(\[[\s\S]*?\]);/);
                    const settingsMatch = jsContent.match(/window\.settings\s*=\s*({[\s\S]*?});/);
                    
                    const entriesDiv = document.getElementById('entries');
                    entriesDiv.innerHTML = '';
                    
                    if (titleMatch) document.getElementById('app-title').value = titleMatch[1];
                    else document.getElementById('app-title').value = '';
                    
                    if (subtitleMatch) document.getElementById('app-subtitle').value = subtitleMatch[1];
                    else document.getElementById('app-subtitle').value = '';
                    
                    if (settingsMatch) {
                        try {
                            loadSettingsFromFile(eval(`(${settingsMatch[1]})`));
                        } catch (err) { console.error('Erreur parsing paramètres:', err); }
                    }
                    
                    if (dropzoneMatch) {
                        try {
                            const dropzoneData = eval(`(${dropzoneMatch[1]})`);
                            if (Array.isArray(dropzoneData)) {
                                dropzoneData.forEach(item => {
                                    const newEntry = document.createElement('div');
                                    newEntry.className = 'entry';
                                    let partsHtml = '';
                                    if (item.exemples_gauche && Array.isArray(item.exemples_gauche)) {
                                        partsHtml += `<div class="part-entry"><button onclick="removePart(this)" class="remove-part-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette sous-catégorie</span></button><input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples" value="${item.exemples_gauche.join(', ')}"><button onclick="addPart(this)" class="add-part-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une sous-catégorie</span></button></div>`;
                                    }
                                    if (item.exemples_droite && Array.isArray(item.exemples_droite)) {
                                        partsHtml += `<div class="part-entry"><button onclick="removePart(this)" class="remove-part-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette sous-catégorie</span></button><input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples" value="${item.exemples_droite.join(', ')}"><button onclick="addPart(this)" class="add-part-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une sous-catégorie</span></button></div>`;
                                    }
                                    newEntry.innerHTML = `<button onclick="removeEntry(this)" class="remove-button"><i class="far fa-times cross"></i><span class="tooltip">supprimer cette catégorie</span></button><input type="text" placeholder="nom de la catégorie gauche" class="category-name-left" value="${item.colonne_gauche || ''}"><input type="text" placeholder="nom de la catégorie droite" class="category-name-right" value="${item.colonne_droite || ''}"><div class="part-container">${partsHtml}</div><button onclick="addEntry()" class="add-button"><i class="far fa-plus plus"></i><span class="tooltip">ajouter une nouvelle catégorie</span></button>`;
                                    entriesDiv.appendChild(newEntry);
                                });
                            }
                        } catch (err) {
                            console.error('Erreur chargement données:', err);
                            addEntry();
                        }
                    } else {
                        addEntry();
                    }
                    loadingIndicator.style.display = 'none';
                } catch (err) {
                    loadingIndicator.style.display = 'none';
                    alert('Erreur lors du chargement du fichier : ' + err.message);
                    if (document.querySelectorAll('.entry').length === 0) addEntry();
                }
            };
            reader.readAsText(file);
        }

        function loadFile(event) {
            processFile(event.target.files[0]);
            event.target.value = '';
        }

        // === DRAG & DROP ROBUSTE (qui fonctionne VRAIMENT) ===
        // Exécuté immédiatement au chargement du script
        (function setupDragAndDrop() {
            const overlay = document.getElementById('drop-overlay');
            if (!overlay) return;

            let isDragging = false;
            let dragEnterTarget = null;

            // CRUCIAL : preventDefault sur dragover pour autoriser le drop
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            }, false);

            document.addEventListener('dragenter', (e) => {
                e.preventDefault();
                // Vérifier si c'est un fichier (compatible tous navigateurs)
                const types = e.dataTransfer.types;
                const hasFiles = (types && (
                    (types.includes && types.includes('Files')) ||
                    (types.contains && types.contains('Files')) ||
                    (Array.from(types).includes('Files'))
                ));
                
                if (hasFiles) {
                    isDragging = true;
                    dragEnterTarget = e.target;
                    overlay.style.display = 'flex';
                }
            }, false);

            document.addEventListener('dragleave', (e) => {
                // Ne cacher que si on quitte vraiment la fenêtre
                if (e.relatedTarget === null || !document.contains(e.relatedTarget)) {
                    isDragging = false;
                    overlay.style.display = 'none';
                }
            }, false);

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isDragging = false;
                overlay.style.display = 'none';
                
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    const file = files[0];
                    if (file.name.endsWith('.js')) {
                        processFile(file);
                    } else {
                        alert('Veuillez déposer un fichier JavaScript (.js).');
                    }
                }
            }, false);

            // Sécurité : masquer l'overlay si on quitte la fenêtre
            window.addEventListener('blur', () => {
                isDragging = false;
                overlay.style.display = 'none';
            });
        })();
        // === FIN DRAG & DROP ===
        
        document.addEventListener('DOMContentLoaded', function() {
            setupColorPickers();
            updateHoverColor();
            setupFontSizeControls();
            if (document.querySelectorAll('.entry').length === 0) {
                addEntry();
            }
        });
    </script>
</body>
