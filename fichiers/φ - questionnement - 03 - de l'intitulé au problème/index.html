<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />	
	<link rel="icon" href="../../src/favicon.ico" />
	<title>de l'intitulé au problème</title>
	<style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Muli', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      overflow-x: hidden;
    }
    .main-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .title-wrapper {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .title {
      margin: 2vh 1rem;
      color: red;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: bold;
    }
    .subtitle {
      margin: 0 1rem 2vh;
      line-height: 1.2;
      color: #555;
      font-size: clamp(1rem, 3vw, 1.2rem);
      text-transform: none;
    }
    .button-wrapper {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2vh 0;
    }
    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      position: relative;
      margin: 2vh 1rem;
      width: 90%;
      max-width: 1200px;
      gap: 2rem;
    }
    .column {
      min-width: 0;
    }
    .column.left {
      flex: 0 0 auto;
    }
    .column.right {
      flex: 1;
    }
    #repereTable {
      width: max-content;
    }
    #definitionTable {
      width: 100%;
    }
    table {
      border-collapse: separate;
      border-spacing: 0.5rem;
    }
    td {
      border-radius: 0.5rem;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      background-color: #e0e0e0;
      box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      word-wrap: break-word;
    }
    td:active:not(.used) {
      background-color: #c0c0c0;
      box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
    }
    td.used {
      background-color: #d0d0d0;
      cursor: not-allowed;
      box-shadow: none;
    }
    td:not(.used):hover {
      background-color: #d1d1d1;
      box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      line-height: 1;
      cursor: pointer;
      width: 120px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #e0e0e0;
      border: none;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
    }
    button:disabled {
      background-color: #d0d0d0;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #d1d1d1;
      box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
    }
    button:active:not(:disabled) {
      background-color: #c0c0c0;
      box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
    }
    #scoreButton {
      background-color: #e0e0e0;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      cursor: default;
      box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
      width: 120px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reload-icon {
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: red;
      line-height: normal;
      transform: translateY(-0.15rem);
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 0.5rem;
        margin: 0.5vh 0.5rem;
      }
      .column {
        margin: 0;
      }
      .column.left, .column.right {
        flex: 1;
      }
      #repereTable, #definitionTable {
        width: 100%;
        max-height: 35vh;
        overflow-y: auto;
      }
      #definitionTable {
        max-height: 40vh;
      }
      td {
        padding: 0.4rem;
        font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      }
      .button-wrapper {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      button {
        width: 100px;
        height: 50px;
      }
    }
    @media (max-width: 480px) {
      .title {
        font-size: clamp(1.5rem, 4vw, 2rem);
      }
      .subtitle {
        font-size: clamp(0.8rem, 2.5vw, 1rem);
      }
      td {
        padding: 0.2rem;
        font-size: clamp(0.7rem, 2vw, 0.8rem);
      }
      button {
        width: 90px;
        height: 50px;
      }
    }
    @media (min-width: 769px) {
      .main-wrapper {
        width: fit-content;
      }
      .container {
        width: auto;
        max-width: none;
        margin: 2vh auto;
        padding: 0 1rem;
      }
      .column.left {
        flex: 0 0 auto;
        width: auto;
      }
      .column.right {
        flex: 1;
      }
      #repereTable {
        width: auto;
        display: inline-block;
      }
      #definitionTable {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="main-wrapper">
	<div class="title-wrapper">
		<p class="title">de l'intitulé au problème</p>
		<p class="subtitle">transformer une question en problème</p>
	</div>
	<div class="container">
    <div class="column left">
		<table id="repereTable"></table>
    </div>
    <div class="column right">
		<table id="definitionTable"></table>
    </div>
    <canvas id="lineCanvas"></canvas>
  </div>
  <div class="button-wrapper">
    <button id="actionButton" onclick="performAction()" disabled>vérifier</button>
    <button id="scoreButton" disabled>score : 0/0</button>
  </div>
</div>
<!-- Chargement du fichier externe fichier_à_modifier.js -->
<script src="fichier_à_modifier.js"></script>
<script>
// Variables globales
let startX, startY, drawing = false;
const canvas = document.getElementById('lineCanvas');
const ctx = canvas.getContext('2d');
const actionButton = document.getElementById('actionButton');
const scoreButton = document.getElementById('scoreButton');
let totalGoodAnswers = 0;
let totalExpectedAnswers = 0;
const usedCells = new Set();
let currentAction = "check";
let currentRepere = null;
let currentDefinition = null;
let links = [];
let selectedReperes = [];
let repereCellsData = []; // nouvelle variable pour stocker les infos uniques de la colonne de gauche

// Fonction pour redimensionner le canvas
function resizeCanvas() {
  const container = document.querySelector('.container');
  canvas.width = container.offsetWidth;
  canvas.height = container.offsetHeight;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);

function isVerticalLayout() {
  return window.innerWidth <= 768;
}

// Sélectionne aléatoirement des éléments dans un tableau (et retient index unique)
function getRandomElementsWithIndex(array, count) {
  const shuffled = array.map((item, idx) => ({...item, _idx: idx})).sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
}

// Charge les repères et définitions dans les tables
function loadReperes() {
  if (!argumentsData || !Array.isArray(argumentsData) || argumentsData.length === 0) {
    console.error("Erreur : argumentsData est indéfini ou vide");
    return [];
  }
  const repTable = document.getElementById('repereTable');
  const defTable = document.getElementById('definitionTable');
  repTable.innerHTML = '';
  defTable.innerHTML = '';
  const randomParts = getRandomElementsWithIndex(argumentsData, 5);
  repereCellsData = randomParts.map((part, j) => ({
    colonne_de_gauche: part.colonne_de_gauche,
    display: part.colonne_de_gauche,
    idx: part._idx, // index d'origine dans argumentsData pour unicité
    colonne_de_droite: part.colonne_de_droite // utile pour la vérif
  }));
  selectedReperes = randomParts;
  // Mélange indépendant pour affichage
  const names = [...repereCellsData].sort(() => 0.5 - Math.random());
  const definitions = randomParts.map(part => part.colonne_de_droite).sort(() => 0.5 - Math.random());

  names.forEach((obj, index) => {
    const repRow = document.createElement('tr');
    const repCell = document.createElement('td');
    repCell.textContent = obj.display;
    repCell.dataset.idx = obj.idx;
    repCell.dataset.colonne_de_droite = obj.colonne_de_droite; // pour vérif éventuelle
    repCell.dataset.logicIndex = index;
    repRow.appendChild(repCell);
    repTable.appendChild(repRow);
  });

  definitions.forEach((colonne_de_droite, index) => {
    const defRow = document.createElement('tr');
    const defCell = document.createElement('td');
    defCell.textContent = colonne_de_droite;
    defCell.dataset.logicIndex = index;
    defRow.appendChild(defCell);
    defTable.appendChild(defRow);
  });
  return randomParts; // inutile mais conservé pour compat
}

function selectCell(event, type) {
  const cell = event.target;
  if (usedCells.has(cell)) return;
  const rect = cell.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  const isVertical = isVerticalLayout();
  const totalCells = 5;
  if (type === 'repere') {
    const idx = parseInt(cell.dataset.idx);
    const logicIndex = parseInt(cell.dataset.logicIndex);
    if (drawing && currentDefinition) {
      const repereRect = rect;
      const defRect = currentDefinition.cell.getBoundingClientRect();
      const startX = isVertical ? repereRect.left + (repereRect.width * (logicIndex + 0.5) / totalCells) - canvasRect.left : repereRect.right - 5 - canvasRect.left;
      const startY = isVertical ? repereRect.bottom - 5 - canvasRect.top : repereRect.top + repereRect.height / 2 - canvasRect.top;
      const endX = isVertical ? defRect.left + (defRect.width * (logicIndex + 0.5) / totalCells) - canvasRect.left : defRect.left + 5 - canvasRect.left;
      const endY = isVertical ? defRect.top + 5 - canvasRect.top : defRect.top + defRect.height / 2 - canvasRect.top;
      drawLink(startX, startY, endX, endY);
      links.push({ repereIdx: idx, repereCell: cell, defCell: currentDefinition.cell, colonne_de_droite: currentDefinition.text, lineId: { startX, startY, endX, endY } });
      usedCells.add(cell);
      usedCells.add(currentDefinition.cell);
      cell.classList.add('used');
      currentDefinition.cell.classList.add('used');
      resetDrawing();
      actionButton.disabled = links.length !== 5;
    } else {
      drawing = true;
      currentRepere = { idx, cell, logicIndex };
      currentDefinition = null;
    }
  } else if (type === 'definition') {
    const logicIndex = parseInt(cell.dataset.logicIndex);
    if (drawing && currentRepere) {
      const repereRect = currentRepere.cell.getBoundingClientRect();
      const defRect = rect;
      const startX = isVertical ? repereRect.left + (repereRect.width * (currentRepere.logicIndex + 0.5) / totalCells) - canvasRect.left : repereRect.right - 5 - canvasRect.left;
      const startY = isVertical ? repereRect.bottom - 5 - canvasRect.top : repereRect.top + repereRect.height / 2 - canvasRect.top;
      const endX = isVertical ? defRect.left + (defRect.width * (currentRepere.logicIndex + 0.5) / totalCells) - canvasRect.left : defRect.left + 5 - canvasRect.left;
      const endY = isVertical ? defRect.top + 5 - canvasRect.top : defRect.top + defRect.height / 2 - canvasRect.top;
      drawLink(startX, startY, endX, endY);
      links.push({ repereIdx: currentRepere.idx, repereCell: currentRepere.cell, defCell: cell, colonne_de_droite: cell.textContent, lineId: { startX, startY, endX, endY } });
      usedCells.add(cell);
      usedCells.add(currentRepere.cell);
      cell.classList.add('used');
      currentRepere.cell.classList.add('used');
      resetDrawing();
      actionButton.disabled = links.length !== 5;
    } else {
      drawing = true;
      currentDefinition = { text: cell.textContent, cell, logicIndex };
      currentRepere = null;
    }
  }
}

// Dessine un lien entre deux cellules
function drawLink(startX, startY, endX, endY, color = "black") {
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(endX, endY);
  const headlen = 10;
  const angle = Math.atan2(endY - startY, endX - startX);
  ctx.lineTo(
    endX - headlen * Math.cos(angle - Math.PI / 6),
    endY - headlen * Math.sin(angle - Math.PI / 6)
  );
  ctx.moveTo(endX, endY);
  ctx.lineTo(
    endX - headlen * Math.cos(angle + Math.PI / 6),
    endY - headlen * Math.sin(angle + Math.PI / 6)
  );
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// Réinitialise le dessin
function resetDrawing() {
  drawing = false;
  currentRepere = null;
  currentDefinition = null;
  currentAction = "check";
  document.getElementById("actionButton").innerHTML = "vérifier";
  actionButton.disabled = links.length !== 5;
}

// Met à jour le bouton de score
function updateScoreButton(currentGoodAnswers) {
  totalExpectedAnswers += 5;
  totalGoodAnswers += currentGoodAnswers;
  scoreButton.textContent = `score : ${totalGoodAnswers}/${totalExpectedAnswers}`;
  scoreButton.disabled = false;
}

// Exécute l'action en cours (vérifier, corriger, recharger)
function performAction() {
  if (actionButton.disabled) return;
  switch (currentAction) {
    case "check":
      checkLinks();
      break;
    case "correct":
      correctLinks();
      break;
    case "reload":
      reload();
      break;
  }
}

// Vérifie les liens créés
function checkLinks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let currentGoodAnswers = 0;
  links.forEach((link) => {
    const parti = argumentsData[link.repereIdx];
    const isCorrect = parti && parti.colonne_de_droite === link.colonne_de_droite;
    const color = isCorrect ? "green" : "red";
    drawLink(link.lineId.startX, link.lineId.startY, link.lineId.endX, link.lineId.endY, color);
    link.isCorrect = isCorrect;
    if (isCorrect) currentGoodAnswers++;
  });
  updateScoreButton(currentGoodAnswers);
  currentAction = "correct";
  document.getElementById("actionButton").innerHTML = "corriger";
  actionButton.disabled = false;
}

// Corrige les liens (affiche les bonnes réponses)
function correctLinks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const repereTable = document.getElementById("repereTable");
  const definitionTable = document.getElementById("definitionTable");
  const canvasRect = canvas.getBoundingClientRect();
  const isVertical = isVerticalLayout();
  const totalCells = 5;

  // Récupérer les repères avec leurs cellules et trier par logicIndex
  const repereWithCells = repereCellsData.map((repere) => {
    const repereCell = Array.from(repereTable.rows).find(
      (row) => parseInt(row.cells[0].dataset.idx) === repere.idx
    )?.cells[0];
    const logicIndex = repereCell ? parseInt(repereCell.dataset.logicIndex) : -1;
    return { repere, repereCell, logicIndex };
  }).filter(rep => rep.repereCell).sort((a, b) => a.logicIndex - b.logicIndex);

  // Récupérer les cellules de définition et trier par logicIndex
  let definitionCells = Array.from(definitionTable.rows)
    .map(row => ({
      cell: row.cells[0],
      text: row.cells[0].textContent,
      logicIndex: parseInt(row.cells[0].dataset.logicIndex)
    }))
    .sort((a, b) => a.logicIndex - b.logicIndex);

  // Assigner chaque repère à la prochaine cellule de définition disponible
  repereWithCells.forEach((rep) => {
    // Trouver la première cellule de définition non utilisée correspondant à rep.repere.colonne_de_droite
    const defIndex = definitionCells.findIndex(def => def.text === rep.repere.colonne_de_droite);
    if (defIndex !== -1) {
      const definitionCell = definitionCells[defIndex].cell;
      const repereRect = rep.repereCell.getBoundingClientRect();
      const defRect = definitionCell.getBoundingClientRect();
      const logicIndex = rep.logicIndex;

      const startX = isVertical
        ? repereRect.left + (repereRect.width * (logicIndex + 0.5) / totalCells) - canvasRect.left
        : repereRect.right - 5 - canvasRect.left;
      const startY = isVertical
        ? repereRect.bottom - 5 - canvasRect.top
        : repereRect.top + repereRect.height / 2 - canvasRect.top;
      const endX = isVertical
        ? defRect.left + (defRect.width * (logicIndex + 0.5) / totalCells) - canvasRect.left
        : defRect.left + 5 - canvasRect.left;
      const endY = isVertical
        ? defRect.top + 5 - canvasRect.top
        : defRect.top + defRect.height / 2 - canvasRect.top;

      drawLink(startX, startY, endX, endY, "green");

      // Retirer la cellule de définition utilisée
      definitionCells.splice(defIndex, 1);
    } else {
      console.warn(
        `Erreur : Aucune cellule de définition disponible pour repère "${rep.repere.colonne_de_gauche}" index ${rep.repere.idx} avec définition "${rep.repere.colonne_de_droite}"`
      );
    }
  });

  currentAction = "reload";
  document.getElementById("actionButton").innerHTML = '<span class="reload-icon">↻</span>';
  actionButton.disabled = false;
}

// Recharge les données
function reload() {
  links.length = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  usedCells.clear();
  document.getElementById("repereTable").innerHTML = "";
  document.getElementById("definitionTable").innerHTML = "";
  loadReperes();
  resetDrawing();
  addEventListeners();
  resizeCanvas();
  actionButton.disabled = true;
}

// Ajoute les écouteurs d'événements aux cellules
function addEventListeners() {
  const repCells = document.getElementById("repereTable").getElementsByTagName("td");
  const defCells = document.getElementById("definitionTable").getElementsByTagName("td");
  Array.from(repCells).forEach((cell) => {
    cell.addEventListener("click", (event) => selectCell(event, "repere"));
  });
  Array.from(defCells).forEach((cell) => {
    cell.addEventListener("click", (event) => selectCell(event, "definition"));
  });
}

// Initialisation au chargement de la page
window.onload = function () {
  loadReperes();
  resizeCanvas();
  addEventListeners();
  actionButton.disabled = true;
};
</script>
</body>
</html>
