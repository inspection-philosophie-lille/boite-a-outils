<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de textes philosophiques</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3498db;
        }

        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #d68910;
        }

        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .author-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            border-left: 4px solid #3498db;
        }

        .author-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .author-card h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .author-card .text-count {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .texts-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
        }

        .text-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            background: #fafafa;
        }

        .text-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .text-header h3 {
            color: #2c3e50;
            font-size: 1.3em;
        }

        .text-actions {
            display: flex;
            gap: 10px;
        }

        .text-content {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            border-left: 3px solid #3498db;
        }

        .text-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-weight: 600;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 3px;
        }

        .meta-value {
            color: #2c3e50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #7f8c8d;
        }

        .close:hover {
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .phrase-num {
            color: #3498db;
            font-weight: 600;
            margin-right: 5px;
        }

        .export-area {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .search-box {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .filter-badge {
            display: inline-block;
            padding: 5px 10px;
            background: #e0e0e0;
            border-radius: 15px;
            font-size: 12px;
            margin: 0 5px 5px 0;
            cursor: pointer;
        }

        .filter-badge.active {
            background: #3498db;
            color: white;
        }

        .auteur-section {
            margin-bottom: 30px;
        }

        .auteur-title {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .stat-item {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .file-input {
            display: none;
        }

        .file-label {
            background: #f39c12;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
        }

        .file-label:hover {
            background: #d68910;
        }

        .warning {
            background: #fcf8e3;
            border: 1px solid #faebcc;
            color: #8a6d3b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #dff0d8;
            border: 1px solid #d6e9c6;
            color: #3c763d;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Gestionnaire de textes philosophiques</h1>

        <div class="toolbar">
            <input type="text" class="search-box" id="searchInput" placeholder="Rechercher un texte, un auteur, un thème...">
            <button class="btn btn-primary" onclick="showAddModal()">➕ Nouveau texte</button>
            <button class="btn btn-success" onclick="showExport()">📤 Exporter textes.js</button>
            <label for="fileImport" class="btn btn-warning" style="cursor:pointer;">📥 Importer fichier JS</label>
            <input type="file" id="fileImport" class="file-input" accept=".js" onchange="importFromFile(event)">
        </div>

        <div id="authorsFilter" class="toolbar">
            <!-- Les filtres d'auteurs seront générés ici -->
        </div>

        <div id="stats" class="stats">
            <!-- Les statistiques seront affichées ici -->
        </div>

        <div id="messageArea"></div>

        <div id="textsContainer" class="texts-container">
            <!-- Les textes seront affichés ici -->
        </div>
    </div>

    <!-- Modal pour ajouter/modifier un texte -->
    <div id="textModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un texte</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="textForm">
                <div class="form-group">
                    <label for="auteur">Auteur *</label>
                    <select id="auteur" required>
                        <option value="">Sélectionner un auteur</option>
                        <!-- Les options seront générées dynamiquement -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="nouvelAuteur">Ou ajouter un nouvel auteur</label>
                    <input type="text" id="nouvelAuteur" placeholder="Nom de l'auteur">
                </div>
                <div class="form-group">
                    <label for="contenu">Contenu du texte *</label>
                    <textarea id="contenu" required placeholder="Entrez le texte avec les balises &lt;span class=&quot;phrase-num&quot;&gt;..."></textarea>
                </div>
                <div class="form-group">
                    <label for="origine">Origine *</label>
                    <input type="text" id="origine" required placeholder="Ex: Auteur, Titre, Éditeur, année, p.X">
                </div>
                <div class="form-group">
                    <label for="theme">Thème *</label>
                    <input type="text" id="theme" required placeholder="Ex: La liberté, Le travail...">
                </div>
                <div class="form-group">
                    <label for="these">Thèse *</label>
                    <textarea id="these" required placeholder="La thèse principale du texte..."></textarea>
                </div>
                <div class="form-group">
                    <label for="interet">Intérêt philosophique *</label>
                    <textarea id="interet" required placeholder="L'intérêt du texte..."></textarea>
                </div>
                <div class="form-group">
                    <label for="problematique">Problématique *</label>
                    <input type="text" id="problematique" required placeholder="La question posée...">
                </div>
                <input type="hidden" id="textId" value="">
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-danger" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal pour l'export -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Fichier textes.js</h2>
                <span class="close" onclick="closeExportModal()">&times;</span>
            </div>
            <pre id="exportContent" class="export-area"></pre>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-primary" onclick="copyToClipboard()">📋 Copier</button>
                <button class="btn btn-success" onclick="downloadTextes()">💾 Télécharger</button>
            </div>
        </div>
    </div>

    <script>
        // Données initiales
        let textes = [];

        // Variable pour suivre l'auteur filtré
        let currentFilter = null;
        let searchTerm = '';

        // Chargement initial
        document.addEventListener('DOMContentLoaded', function() {
            loadTextes();
            updateUI();
        });

        function loadTextes() {
            const saved = localStorage.getItem('philosophicalTexts');
            if (saved) {
                try {
                    textes = JSON.parse(saved);
                } catch (e) {
                    console.error('Erreur de parsing des données sauvegardées', e);
                    textes = [];
                }
            }
        }

        function saveTextes() {
            localStorage.setItem('philosophicalTexts', JSON.stringify(textes));
            showMessage('Données sauvegardées', 'success');
        }

        function showMessage(msg, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="${type}">${msg}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 3000);
        }

        function getUniqueAuteurs() {
            const auteurs = new Set();
            textes.forEach(texte => {
                const match = texte.reponses.origine.match(/^([^,<]+)/);
                if (match) {
                    auteurs.add(match[1].trim());
                }
            });
            return Array.from(auteurs).sort();
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const totalTextes = textes.length;
            const totalAuteurs = getUniqueAuteurs().length;
            
            statsDiv.innerHTML = `
                <div class="stat-item">📚 Total textes: ${totalTextes}</div>
                <div class="stat-item">✍️ Total auteurs: ${totalAuteurs}</div>
            `;
        }

        function updateUI() {
            updateAuthorsFilter();
            displayTexts();
            updateAuteurSelect();
            updateStats();
        }

        function updateAuthorsFilter() {
            const auteurs = getUniqueAuteurs();
            const filterDiv = document.getElementById('authorsFilter');
            
            let html = '<span style="font-weight:600; margin-right:10px;">Filtres:</span>';
            html += '<span class="filter-badge ' + (currentFilter === null ? 'active' : '') + '" onclick="setFilter(null)">Tous</span>';
            
            auteurs.forEach(auteur => {
                html += `<span class="filter-badge ${currentFilter === auteur ? 'active' : ''}" onclick="setFilter('${auteur.replace(/'/g, "\\'")}')">${auteur}</span>`;
            });
            
            filterDiv.innerHTML = html;
        }

        function setFilter(auteur) {
            currentFilter = auteur;
            updateAuthorsFilter();
            displayTexts();
        }

        function displayTexts() {
            const container = document.getElementById('textsContainer');
            let filteredTexts = textes;

            if (filteredTexts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#7f8c8d;">Aucun texte. Importez un fichier textes.js pour commencer.</div>';
                return;
            }

            // Appliquer le filtre par auteur
            if (currentFilter) {
                filteredTexts = filteredTexts.filter(texte => {
                    const match = texte.reponses.origine.match(/^([^,<]+)/);
                    return match && match[1].trim() === currentFilter;
                });
            }

            // Appliquer la recherche
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filteredTexts = filteredTexts.filter(texte => 
                    texte.reponses.origine.toLowerCase().includes(searchTerm) ||
                    texte.reponses.theme.toLowerCase().includes(searchTerm) ||
                    texte.reponses.these.toLowerCase().includes(searchTerm) ||
                    texte.contenu.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredTexts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#7f8c8d;">Aucun texte trouvé</div>';
                return;
            }

            // Grouper par auteur
            const textsByAuteur = {};
            filteredTexts.forEach(texte => {
                const match = texte.reponses.origine.match(/^([^,<]+)/);
                const auteur = match ? match[1].trim() : 'Auteur inconnu';
                if (!textsByAuteur[auteur]) {
                    textsByAuteur[auteur] = [];
                }
                textsByAuteur[auteur].push(texte);
            });

            let html = '';
            Object.keys(textsByAuteur).sort().forEach(auteur => {
                html += `<div class="auteur-section">`;
                html += `<div class="auteur-title">${auteur} (${textsByAuteur[auteur].length} texte${textsByAuteur[auteur].length > 1 ? 's' : ''})</div>`;
                
                textsByAuteur[auteur].forEach(texte => {
                    html += `
                        <div class="text-card">
                            <div class="text-header">
                                <h3>Texte #${texte.id}</h3>
                                <div class="text-actions">
                                    <button class="btn btn-warning" onclick="editText(${texte.id})">✏️ Modifier</button>
                                    <button class="btn btn-danger" onclick="deleteText(${texte.id})">🗑️ Supprimer</button>
                                </div>
                            </div>
                            <div class="text-content">${texte.contenu}</div>
                            <div class="text-meta">
                                <div class="meta-item">
                                    <span class="meta-label">Origine</span>
                                    <span class="meta-value">${texte.reponses.origine}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Thème</span>
                                    <span class="meta-value">${texte.reponses.theme}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Thèse</span>
                                    <span class="meta-value">${texte.reponses.these}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Intérêt</span>
                                    <span class="meta-value">${texte.reponses.interet}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Problématique</span>
                                    <span class="meta-value">${texte.reponses.problematique}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function updateAuteurSelect() {
            const select = document.getElementById('auteur');
            const auteurs = getUniqueAuteurs();
            
            let options = '<option value="">Sélectionner un auteur</option>';
            auteurs.forEach(auteur => {
                options += `<option value="${auteur.replace(/"/g, '&quot;')}">${auteur}</option>`;
            });
            
            select.innerHTML = options;
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Ajouter un texte';
            document.getElementById('textForm').reset();
            document.getElementById('textId').value = '';
            document.getElementById('textModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('textModal').style.display = 'none';
        }

        function editText(id) {
            const texte = textes.find(t => t.id === id);
            if (!texte) return;

            document.getElementById('modalTitle').textContent = 'Modifier le texte';
            document.getElementById('textId').value = id;
            
            // Remplir le formulaire
            const match = texte.reponses.origine.match(/^([^,<]+)/);
            if (match) {
                document.getElementById('auteur').value = match[1].trim();
            }
            
            document.getElementById('contenu').value = texte.contenu;
            document.getElementById('origine').value = texte.reponses.origine;
            document.getElementById('theme').value = texte.reponses.theme;
            document.getElementById('these').value = texte.reponses.these;
            document.getElementById('interet').value = texte.reponses.interet;
            document.getElementById('problematique').value = texte.reponses.problematique;
            
            document.getElementById('textModal').style.display = 'block';
        }

        function deleteText(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce texte ?')) {
                textes = textes.filter(t => t.id !== id);
                saveTextes();
                updateUI();
            }
        }

        document.getElementById('textForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const auteurSelect = document.getElementById('auteur').value;
            const nouvelAuteur = document.getElementById('nouvelAuteur').value;
            const auteur = nouvelAuteur || auteurSelect;
            
            if (!auteur) {
                alert('Veuillez sélectionner ou saisir un auteur');
                return;
            }

            const id = document.getElementById('textId').value;
            const contenu = document.getElementById('contenu').value;
            
            // Formater l'origine avec l'auteur si nécessaire
            let origine = document.getElementById('origine').value;
            if (!origine.startsWith(auteur)) {
                origine = auteur + ', ' + origine;
            }

            const textData = {
                id: id ? parseInt(id) : Math.max(...textes.map(t => t.id), 0) + 1,
                contenu: contenu,
                reponses: {
                    origine: origine,
                    theme: document.getElementById('theme').value,
                    these: document.getElementById('these').value,
                    interet: document.getElementById('interet').value,
                    problematique: document.getElementById('problematique').value
                }
            };

            if (id) {
                // Modification
                const index = textes.findIndex(t => t.id === parseInt(id));
                if (index !== -1) {
                    textes[index] = textData;
                }
            } else {
                // Ajout
                textes.push(textData);
            }

            saveTextes();
            updateUI();
            closeModal();
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            displayTexts();
        });

        function showExport() {
            const exportContent = document.getElementById('exportContent');
            exportContent.textContent = generateTextesJS();
            document.getElementById('exportModal').style.display = 'block';
        }

        function closeExportModal() {
            document.getElementById('exportModal').style.display = 'none';
        }

        function generateTextesJS() {
            let output = 'const textes = [\n';
            
            // Grouper par auteur pour les commentaires
            const textsByAuteur = {};
            textes.forEach(texte => {
                const match = texte.reponses.origine.match(/^([^,<]+)/);
                const auteur = match ? match[1].trim() : 'Auteur inconnu';
                if (!textsByAuteur[auteur]) {
                    textsByAuteur[auteur] = [];
                }
                textsByAuteur[auteur].push(texte);
            });

            Object.keys(textsByAuteur).sort().forEach(auteur => {
                output += `\n\t// --------------------------------\n`;
                output += `\t// ${auteur.toUpperCase()}\n`;
                output += `\t// --------------------------------\n`;
                
                textsByAuteur[auteur].forEach(texte => {
                    output += `\t{\n`;
                    output += `\t\tid: ${texte.id},\n`;
                    
                    // Échapper les backticks dans le contenu
                    const contenuEchappe = texte.contenu.replace(/`/g, '\\`');
                    output += `\t\tcontenu: \`${contenuEchappe}\`,\n`;
                    
                    output += `\t\treponses: {\n`;
                    output += `\t\t\torigine: "${texte.reponses.origine.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\ttheme: "${texte.reponses.theme.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tthese: "${texte.reponses.these.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tinteret: "${texte.reponses.interet.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tproblematique: "${texte.reponses.problematique.replace(/"/g, '\\"')}"\n`;
                    output += `\t\t}\n`;
                    output += `\t},\n`;
                });
            });

            output += '];';
            return output;
        }

        function copyToClipboard() {
            const content = document.getElementById('exportContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('Copié dans le presse-papier !');
            });
        }

        function downloadTextes() {
            const content = generateTextesJS();
            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'textes.js';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    
                    // Extraire le tableau en utilisant une fonction Function
                    // C'est plus sûr que eval car ça crée un nouveau scope
                    const extractTextes = new Function(`
                        ${content}
                        return textes;
                    `);
                    
                    const imported = extractTextes();
                    
                    if (Array.isArray(imported)) {
                        // Vérifier que chaque élément a la bonne structure
                        let validCount = 0;
                        let invalidItems = [];
                        
                        imported.forEach((item, index) => {
                            if (item && 
                                typeof item.id === 'number' &&
                                typeof item.contenu === 'string' &&
                                item.reponses &&
                                typeof item.reponses.origine === 'string' &&
                                typeof item.reponses.theme === 'string' &&
                                typeof item.reponses.these === 'string' &&
                                typeof item.reponses.interet === 'string' &&
                                typeof item.reponses.problematique === 'string') {
                                validCount++;
                            } else {
                                invalidItems.push(index + 1);
                            }
                        });

                        if (invalidItems.length > 0) {
                            if (!confirm(`${invalidItems.length} élément(s) (lignes ${invalidItems.join(', ')}) ont une structure invalide. Importer quand même les éléments valides ?`)) {
                                document.getElementById('fileImport').value = '';
                                return;
                            }
                            
                            // Filtrer les éléments valides
                            textes = imported.filter(item => 
                                item && 
                                typeof item.id === 'number' &&
                                typeof item.contenu === 'string' &&
                                item.reponses &&
                                typeof item.reponses.origine === 'string' &&
                                typeof item.reponses.theme === 'string' &&
                                typeof item.reponses.these === 'string' &&
                                typeof item.reponses.interet === 'string' &&
                                typeof item.reponses.problematique === 'string'
                            );
                        } else {
                            textes = imported;
                        }
                        
                        saveTextes();
                        updateUI();
                        showMessage(`${textes.length} textes importés avec succès depuis ${file.name}`, 'success');
                    } else {
                        throw new Error('Le fichier ne contient pas un tableau valide');
                    }
                    
                } catch (error) {
                    console.error('Erreur d\'import:', error);
                    alert('Erreur lors de l\'import : ' + error.message + '\n\nVérifiez que le fichier est au format textes.js valide.');
                }
                
                // Reset l'input file
                document.getElementById('fileImport').value = '';
            };
            
            reader.readAsText(file);
        }
    </script>
</body>
