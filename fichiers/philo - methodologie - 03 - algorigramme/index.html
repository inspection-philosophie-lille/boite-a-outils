<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>algorigramme</title>

<!-- Police moderne pour le texte -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<!-- Material Symbols (icônes stylées) -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<!-- Cytoscape (CDN) -->
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

<style>
  :root {
    --bg: #e7e7e9;
    --panel-bg: #e0e0e0;
    --shadow-1: 4px 4px 10px rgba(0,0,0,0.12);
    --shadow-2: -4px -4px 10px rgba(255,255,255,0.9);
  }
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #cy {
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    display: block;
  }
  .controls {
    position: fixed;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 2200;
    padding: 10px;
    transition: left 0.3s ease;
  }
  .toggle-menu {
    position: fixed;
    left: 10px;
    top: 10px;
    z-index: 2300;
    background: var(--panel-bg);
    border: 0;
    border-radius: 8px;
    box-shadow: var(--shadow-1), var(--shadow-2);
    cursor: pointer;
    padding: 8px;
    display: none;
  }
  .toggle-menu .material-symbols-outlined {
    font-size: 24px;
    color: #222;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    height: 44px;
    padding: 6px 10px;
    background: var(--panel-bg);
    border: 0;
    border-radius: 10px;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.08), -3px -3px 6px rgba(255,255,255,0.9);
    cursor: pointer;
    transition: all .12s ease;
    font-size: 18px;
    color: #222;
    user-select: none;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.04), inset -3px -3px 6px rgba(255,255,255,0.9);
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    font-size: 20px;
    line-height: 1;
  }
  .shape-glyph {
    font-size: 18px;
    font-weight: 600;
    line-height: 1;
  }
  .color-palette {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px;
    max-width: 220px;
    background: transparent;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2px solid rgba(0,0,0,0.08);
    cursor: pointer;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.06), -2px -2px 6px rgba(255,255,255,0.9);
  }
  .color-swatch:hover {
    transform: scale(1.08);
  }
  #importfile { display: none; }
  .cy-inline-textarea {
    position: absolute;
    z-index: 9999;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.12);
    box-shadow: 2px 2px 10px rgba(0,0,0,0.12);
    background: #fff;
    outline: none;
    width: 80%;
    max-width: 300px;
    min-height: 40px;
    resize: vertical;
    box-sizing: border-box;
  }
  .resize-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #666;
    border: 1px solid #fff;
    border-radius: 2px;
    cursor: nwse-resize;
    z-index: 9998;
    display: none;
  }
  .context-menu {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    z-index: 9999;
    display: none;
  }
  .context-menu div {
    padding: 4px 8px;
    cursor: pointer;
  }
  .context-menu div:hover {
    background: #f0f0f0;
  }
  .title-container {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 2100;
    font-family: 'Inter', Arial, sans-serif;
  }
  @media (max-width: 768px) {
    .controls { left: -70px; gap: 8px; padding: 8px; }
    .controls.visible { left: 8px; }
    .toggle-menu { display: block; }
    .btn { min-width: 36px; height: 36px; font-size: 16px; }
    .material-symbols-outlined, .shape-glyph { font-size: 16px; }
    .color-swatch { width: 24px; height: 24px; }
    .color-palette { max-width: 180px; }
    .cy-inline-textarea { font-size: 12px; padding: 4px 6px; min-height: 32px; }
    .title-container { font-size: 0.9em; }
  }
  @media (max-width: 480px) {
    .controls { left: -60px; gap: 6px; padding: 6px; }
    .controls.visible { left: 6px; }
    .btn { min-width: 32px; height: 32px; font-size: 14px; }
    .material-symbols-outlined, .shape-glyph { font-size: 14px; }
    .color-swatch { width: 20px; height: 20px; }
    .color-palette { max-width: 160px; }
    .title-container { font-size: 0.8em; }
  }
</style>
</head>
<body>
<div class="title-container">
  <h1 style="color: red; font-size: 24px; margin: 0;">algorigramme</h1>
  <h2 style="color: black; font-size: 18px; margin: 5px 0 0 0;">construire un raisonnement</h2>
</div>

<button class="toggle-menu" title="Afficher/Masquer le menu" onclick="toggleMenuMobile()">
  <span class="material-symbols-outlined">menu</span>
</button>

<div id="contextMenu" class="context-menu">
  <div onclick="changeShape('rectangle')">Rectangle (▭)</div>
  <div onclick="changeShape('diamond')">Losange (◇)</div>
  <div onclick="changeShape('ellipse')">Ellipse (◯)</div>
</div>

<div id="resizeHandle" class="resize-handle"></div>

<div class="controls" role="toolbar" aria-label="outils">
  <button class="btn" title="ajouter nœud" onclick="addnode()"><span class="material-symbols-outlined">add</span></button>
  <button class="btn" title="rectangle" onclick="changeShape('rectangle')"><span class="shape-glyph">▭</span></button>
  <button class="btn" title="losange" onclick="changeShape('diamond')"><span class="shape-glyph">◇</span></button>
  <button class="btn" title="ellipse" onclick="changeShape('ellipse')"><span class="shape-glyph">◯</span></button>
  <button class="btn" title="couleur (sélectionner un nœud)" onclick="toggleColorPalette()"><span class="material-symbols-outlined">palette</span></button>
  <div id="colorpalette" class="color-palette" style="display:none;">
    <div class="color-swatch" data-color="#e0e0e0" style="background:#e0e0e0"></div>
    <div class="color-swatch" data-color="#a3bffa" style="background:#a3bffa"></div>
    <div class="color-swatch" data-color="#f6e58d" style="background:#f6e58d"></div>
    <div class="color-swatch" data-color="#ff9ff3" style="background:#ff9ff3"></div>
    <div class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b"></div>
    <div class="color-swatch" data-color="#55efc4" style="background:#55efc4"></div>
    <div class="color-swatch" data-color="#74b9ff" style="background:#74b9ff"></div>
    <div class="color-swatch" data-color="#fd79a8" style="background:#fd79a8"></div>
  </div>
  <button class="btn" title="ajouter connexion" onclick="startaddedge()"><span class="material-symbols-outlined">arrow_forward</span></button>
  <button class="btn" title="importer JSON" onclick="document.getElementById('importfile').click()"><span class="material-symbols-outlined">folder_open</span></button>
  <input id="importfile" type="file" accept=".json" onchange="importmindmap()" />
  <button class="btn" title="exporter JSON" onclick="exportJSON()"><span class="material-symbols-outlined">save</span></button>
  <button class="btn" title="exporter PNG" onclick="exportPNG()"><span class="material-symbols-outlined">image</span></button>
</div>

<div id="cy"></div>

<script>
let cy, isResizing = false, startX, startY, startWidth, startHeight, colorPaletteVisible = false, edgeMode = false, edgeSource = null;

/* ========== DONNÉES JSON INTÉGRÉES (algorigramme.json) ========== */
const algorigrammeData = {
  "nodeDataArray": [
    {"key": "05694500-79ef-46f4-a61f-08a2221311b1","text": "intitulé du sujet","loc": "637.1442217775647 106.15322895442534","category": "rectangle","color": "#f6e58d","borderColor": "#AA9941","width": 117,"height": 50},
    {"key": "ba3cc6c8-ca87-4394-9191-5c313f5a47e6","text": "problématisation :\nchoix entre les options","loc": "638.5710523711662 206.18823277913538","category": "diamond","color": "#74b9ff","borderColor": "#286DB3","width": 260,"height": 82},
    {"key": "fa3a66c5-fe59-4894-b551-7d5817ba406c","text": "option 1","loc": "392.0150799477638 207.2049589635645","category": "rectangle","color": "#55efc4","borderColor": "#09A378","width": 100,"height": 50},
    {"key": "f4fe4e48-a969-433f-b5ce-f49bc2329158","text": "option 2","loc": "894.3257679446409 206.80173831136017","category": "rectangle","color": "#55efc4","borderColor": "#09A378","width": 100,"height": 50},
    {"key": "7ec0f9e4-d0e3-4546-8481-b126f0067a8f","text": "justification(s) \nde l'option 1","loc": "390.2801279941409 320.98295555396004","category": "rectangle","color": "#74b9ff","borderColor": "#286DB3","width": 114,"height": 50},
    {"key": "e3a8ca39-1628-444c-8f5f-1c607837bfbc","text": "justification(s) \nde l'option 2","loc": "894.891551714367 323.15849320808707","category": "rectangle","color": "#74b9ff","borderColor": "#286DB3","width": 114,"height": 50},
    {"key": "405c0c74-f9f2-44af-a907-3c048ceea747","text": "problème : \nsoit option 1, soit option 2","loc": "648.3854817310919 324.70172409456796","category": "rectangle","color": "#ff6b6b","borderColor": "#B31F1F","width": 185,"height": 50}
  ],
  "linkDataArray": [
    {"from": "05694500-79ef-46f4-a61f-08a2221311b1","to": "ba3cc6c8-ca87-4394-9191-5c313f5a47e6"},
    {"from": "ba3cc6c8-ca87-4394-9191-5c313f5a47e6","to": "fa3a66c5-fe59-4894-b551-7d5817ba406c"},
    {"from": "ba3cc6c8-ca87-4394-9191-5c313f5a47e6","to": "f4fe4e48-a969-433f-b5ce-f49bc2329158"},
    {"from": "fa3a66c5-fe59-4894-b551-7d5817ba406c","to": "7ec0f9e4-d0e3-4546-8481-b126f0067a8f"},
    {"from": "f4fe4e48-a969-433f-b5ce-f49bc2329158","to": "e3a8ca39-1628-444c-8f5f-1c607837bfbc"},
    {"from": "7ec0f9e4-d0e3-4546-8481-b126f0067a8f","to": "405c0c74-f9f2-44af-a907-3c048ceea747"},
    {"from": "e3a8ca39-1628-444c-8f5f-1c607837bfbc","to": "405c0c74-f9f2-44af-a907-3c048ceea747"}
  ]
};

/* ========== FONCTIONS UTILITAIRES ========== */
function darkenColor(color) {
  if (color.startsWith('rgb')) {
    const match = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    if (match) {
      let r = Math.max(0, parseInt(match[1]) - 76);
      let g = Math.max(0, parseInt(match[2]) - 76);
      let b = Math.max(0, parseInt(match[3]) - 76);
      return `rgb(${r}, ${g}, ${b})`;
    }
  }
  if (color.startsWith('#')) {
    let r, g, b;
    if (color.length === 4) {
      r = parseInt(color[1] + color[1], 16);
      g = parseInt(color[2] + color[2], 16);
      b = parseInt(color[3] + color[3], 16);
    } else {
      r = parseInt(color.slice(1, 3), 16);
      g = parseInt(color.slice(3, 5), 16);
      b = parseInt(color.slice(5, 7), 16);
    }
    r = Math.max(0, r - 76);
    g = Math.max(0, g - 76);
    b = Math.max(0, b - 76);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }
  return '#888888';
}

function adjustNodeSize(node) {
  if (!node || !node.data) return;

  const label = node.data('label') || '';
  const shape = node.data('shape') || 'rectangle';

  // Mesure du texte
  const tempSpan = document.createElement('span');
  tempSpan.style.cssText = 'position:absolute;visibility:hidden;white-space:pre-wrap;font-family:Inter,Arial,sans-serif;font-size:14px;padding:4px;max-width:300px;line-height:1.2';
  tempSpan.textContent = label;
  document.body.appendChild(tempSpan);

  let width = Math.max(100, tempSpan.offsetWidth + 12);
  let height = Math.max(50, tempSpan.offsetHeight + 12);

  // ✅ AJUSTEMENT SPÉCIFIQUE POUR LES LOSANGES
  if (shape === 'diamond') {
    // Le losange prend plus de place en diagonale : on compense
    const ratio = 1.3; // ajustable : 1.2–1.4 selon le rendu visuel souhaité
    const side = Math.max(width, height) * ratio;
    width = side;
    height = side;
  }

  document.body.removeChild(tempSpan);

  // Application des dimensions au nœud
  node.style('width', width + 'px');
  node.style('height', height + 'px');
  node.data('width', width);
  node.data('height', height);
}

/* ========== INITIALISATION ========== */
document.addEventListener('DOMContentLoaded', function() {
  if (typeof cytoscape === 'undefined') {
    alert('Erreur : Cytoscape n\'est pas chargé.');
    return;
  }

  cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      {selector: 'node', style: {
        'label': 'data(label)', 'shape': 'data(shape)', 'background-color': 'data(color)',
        'border-width': 2, 'border-color': 'data(borderColor)', 'color': '#222',
        'text-valign': 'center', 'text-wrap': 'wrap', 'text-max-width': '300px',
        'font-family': 'Inter, Arial, sans-serif', 'font-size': 14, 'padding': '4px',
        'text-events': 'yes', 'content': 'data(label)', 'width': 'data(width)', 'height': 'data(height)'
      }},
      {selector: 'edge', style: {
        'width': 2, 'curve-style': 'straight', 'target-arrow-shape': 'triangle',
        'line-color': '#333', 'target-arrow-color': '#333'
      }},
      {selector: ':selected', style: {'overlay-color': '#ddd', 'overlay-opacity': 0.4}}
    ],
    layout: {name: 'preset'},
    userZoomingEnabled: true,
    userPanningEnabled: true
  });

  // CHARGEMENT AUTOMATIQUE DES DONNÉES INTÉGRÉES
  loadDataFromJson(algorigrammeData);
  initInteractions();
});

/* ========== CHARGEMENT DONNÉES ========== */
function loadDataFromJson(data) {
  cy.elements().remove();
  const nodes = [];
  data.nodeDataArray.forEach(nd => {
    const [x, y] = String(nd.loc || '0 0').split(' ').map(Number);
    const shape = nd.category || 'rectangle';
    const color = nd.color || '#e0e0e0';
    const borderColor = nd.borderColor || darkenColor(color);
    const width = nd.width || 100;
    const height = nd.height || 60;
    const node = cy.add({
      group: 'nodes',
      data: {id: String(nd.key), label: nd.text || '', shape, color, borderColor, width, height},
      position: {x, y}
    });
    nodes.push(node);
  });
  if (data.linkDataArray) {
    data.linkDataArray.forEach(l => {
      cy.add({group: 'edges', data: {id: 'e'+l.from+'-'+l.to, source: String(l.from), target: String(l.to)}});
    });
  }
  const padding = window.innerWidth <= 768 ? 20 : 50;
  const xCoords = nodes.map(n => n.position().x);
  const currentCenter = xCoords.length ? xCoords.reduce((a,b)=>a+b,0)/xCoords.length : 0;
  const offset = window.innerWidth/2 - currentCenter;
  nodes.forEach(n => n.position('x', n.position().x + offset));
  cy.fit(cy.elements(), padding);
  if (window.innerWidth > 768) cy.zoom(0.8);
  cy.center();
}

/* ========== INTERACTIONS ========== */
function initInteractions() {
  const resizeHandle = document.getElementById('resizeHandle');
  
  cy.on('cxttap', evt => {
    if (evt.target === cy || !evt.target.isNode()) return;
    const menu = document.getElementById('contextMenu');
    menu.style.cssText = `display:block;left:${evt.originalEvent.clientX}px;top:${evt.originalEvent.clientY}px`;
    document.addEventListener('click', () => menu.style.display = 'none', {once: true});
  });

  cy.on('select', 'node', evt => {
    const node = evt.target, pos = node.renderedPosition(), ctr = cy.container().getBoundingClientRect();
    resizeHandle.style.cssText = `display:block;left:${ctr.left + pos.x + node.width()/2 - 6}px;top:${ctr.top + pos.y + node.height()/2 - 6}px`;
  });
  cy.on('unselect', 'node', () => resizeHandle.style.display = 'none');

  resizeHandle.onmousedown = e => {
    const node = cy.$('node:selected')[0];
    if (!node) return;
    e.preventDefault(); isResizing = true;
    startX = e.clientX; startY = e.clientY;
    startWidth = node.width(); startHeight = node.height();
    document.onmousemove = handleResize;
    document.onmouseup = () => {isResizing = false; document.onmousemove = document.onmouseup = null;};
  };

  cy.on('dblclick', 'node', evt => {
    const node = evt.target, bbox = node.renderedBoundingBox(), ctr = cy.container().getBoundingClientRect();
    const textarea = document.createElement('textarea');
    textarea.value = node.data('label') || '';
    textarea.className = 'cy-inline-textarea';
    textarea.style.cssText = `left:${ctr.left + bbox.x1 + window.scrollX}px;top:${ctr.top + bbox.y1 + window.scrollY}px;width:${Math.max(80, bbox.w) + 12}px`;
    document.body.appendChild(textarea); textarea.focus(); textarea.select();
    const finalize = () => {node.data('label', textarea.value); adjustNodeSize(node); textarea.remove();};
    textarea.onblur = textarea.onkeydown = e => (e.key === 'Enter' && !e.shiftKey ? finalize() : e.key === 'Escape' ? textarea.remove() : null) && e.preventDefault();
  });

  document.onkeydown = e => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.tagName !== 'TEXTAREA') {
      cy.$(':selected').remove();
    }
  };
}

function handleResize(e) {
  if (!isResizing) return;
  const node = cy.$('node:selected')[0];
  if (!node) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  const newWidth = Math.max(60, startWidth + dx);
  const newHeight = Math.max(40, startHeight + dy);
  node.style('width', newWidth + 'px');
  node.style('height', newHeight + 'px');
  node.data('width', newWidth);
  node.data('height', newHeight);
}

/* ========== FONCTIONS BOUTONS ========== */
function changeShape(shape) {
  const node = cy.$('node:selected')[0];
  if (!node) return alert('Sélectionnez un nœud');
  node.data('shape', shape);
  adjustNodeSize(node);
}

function toggleColorPalette() {
  const palette = document.getElementById('colorpalette');
  if (colorPaletteVisible) return palette.style.display = 'none', void(colorPaletteVisible = false);
  const btn = event.target.closest('.btn'), btnRect = btn.getBoundingClientRect();
  palette.style.cssText = `position:absolute;left:${btnRect.left + btnRect.width + 10}px;top:${btnRect.top}px;display:flex;z-index:3000`;
  colorPaletteVisible = true;
  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.onclick = () => {
      const node = cy.$('node:selected')[0];
      if (node) {
        node.data('color', swatch.dataset.color);
        node.data('borderColor', darkenColor(swatch.dataset.color));
      } else alert('Sélectionnez un nœud');
      palette.style.display = 'none'; colorPaletteVisible = false;
    };
  });
}

function addnode() {
  const label = prompt('Texte du nœud :', 'nouveau nœud');
  if (label === null) return;
  const n = cy.add({
    group: 'nodes',
    data: {label, shape: 'rectangle', color: '#e0e0e0', borderColor: darkenColor('#e0e0e0'), width: 100, height: 60},
    position: {x: 220 + Math.random() * 360, y: 160 + Math.random() * 260}
  });
  adjustNodeSize(n);
}

function startaddedge() {
  edgeMode = true; edgeSource = null; alert('Cliquez source → cible');
}
cy.on('tap', 'node', evt => {
  if (!edgeMode) return;
  const n = evt.target;
  if (!edgeSource) return edgeSource = n;
  if (edgeSource.id() !== n.id()) {
    cy.add({group: 'edges', data: {source: edgeSource.id(), target: n.id()}});
    edgeMode = false; edgeSource = null;
  }
});

function importmindmap() {
  const file = document.getElementById('importfile').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      loadDataFromJson(JSON.parse(e.target.result));
      alert('Importé !');
    } catch(err) { alert('Erreur: ' + err.message); }
  };
  reader.readAsText(file);
}

function exportJSON() {
  const data = {
    nodeDataArray: cy.nodes().map(n => {
      // PRIORITÉ 1: dimensions stockées dans data (redimensionnement manuel ou ajustement auto)
      const width = n.data('width') || n.width();
      const height = n.data('height') || n.height();
      
      return {
        key: n.id(),
        text: n.data('label'),
        loc: `${Math.round(n.position().x * 100) / 100} ${Math.round(n.position().y * 100) / 100}`,
        category: n.data('shape'),
        color: n.data('color'),
        borderColor: n.data('borderColor'),
        width: width,    // ✅ DIMENSION STOCKÉE
        height: height   // ✅ DIMENSION STOCKÉE
      };
    }),
    linkDataArray: cy.edges().map(e => ({
      from: e.data('source'),
      to: e.data('target')
    }))
  };
  
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'algorigramme.json';
  a.click();
}

function exportPNG() {
  const a = document.createElement('a');
  a.href = cy.png({full: true, scale: 1.5});
  a.download = 'algorigramme.png'; a.click();
}

/* ========== MOBILE ========== */
let isMobileMenuVisible = false;
function toggleMenuMobile() {
  if (window.innerWidth > 768) return;
  isMobileMenuVisible = !isMobileMenuVisible;
  document.querySelector('.controls').classList.toggle('visible', isMobileMenuVisible);
}
window.onresize = () => {
  const controls = document.querySelector('.controls'), toggleBtn = document.querySelector('.toggle-menu');
  if (window.innerWidth > 768) {
    toggleBtn.style.display = 'none'; controls.classList.remove('visible'); controls.style.left = '12px';
  } else {
    toggleBtn.style.display = 'block';
    if (!isMobileMenuVisible) controls.style.left = '-70px';
  }
};
</script>
</body>
