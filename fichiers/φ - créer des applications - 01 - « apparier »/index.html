<!DOCTYPE html>
<html lang="fr">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<link rel="icon" href="favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
	<title id="pageTabTitle">apparier</title>
	
	<!-- Styles optimisés -->
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			font-family: 'Muli', Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			background-color: #f0f0f0;
			transition: background-color 0.3s ease, color 0.3s ease;
			color: #000000;
			font-size: 16px; /* Taille de base par défaut */
		}
		/* Toolbar */
		.toolbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			position: relative;
			padding: 10px 15px;
			flex-shrink: 0;
			height: 60px;
			background: transparent;
			margin: 0;
			border-radius: 0;
			width: 100%;
			margin-top: 15px;
			margin-bottom: 0px;
		}
		.toolbar-left {
			display: flex;
			align-items: center;
			z-index: 1;
			flex: 1;
			justify-content: flex-start;
			gap: 10px;
			min-height: 60px;
		}
		.toolbar-center {
			position: absolute;
			left: 0;
			right: 0;
			top: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			pointer-events: none;
		}
		.toolbar-right {
			display: flex;
			align-items: center;
			z-index: 1;
			flex: 1;
			justify-content: flex-end;
			position: relative;
			gap: 10px;
			min-height: 60px;
		}
		/* ===== STYLES UNIFIÉS POUR TOUS LES BOUTONS DE LA TOOLBAR ===== */
		/* Styles de base pour TOUS les boutons ET le lien accueil */
		.toolbar-btn, .toolbar-btn.home {
			position: relative;
			z-index: 1;
			cursor: pointer;
			border: none;
			font-size: 18px;
			border-radius: 50%;
			width: 60px;
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
			flex-shrink: 0;
			text-decoration: none;
			padding: 0;
			margin: 0;
			outline: none;
			
			/* COULEURS MODE CLAIR */
			background-color: #e0e5ec;
			color: #444;
			box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
		}

.toolbar-btn:hover, .toolbar-btn.home:hover {
			background-color: #d1d1d1;
			color: #333;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
			transform: translateY(-1px);
		}

.toolbar-btn:active, .toolbar-btn.home:active {
			transform: translateY(1px);
			box-shadow: inset 0.3rem 0.3rem 0.5rem #bebebe, inset -0.3rem -0.3rem 0.5rem #ffffff;
		}

.toolbar-btn.active, .toolbar-btn.home.active {
			background-color: #d1d1d1;
			color: #333;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

		/* ===== STYLES SPÉCIFIQUES AUX ICÔNES ===== */

		/* SVG d'accueil */
		.toolbar-btn.home svg {
			width: 28px;
			height: 28px;
			display: block;
		}

		/* Icône reload */
		.reload-icon {
			font-size: 32px;
			font-weight: normal;
			transition: transform 0.3s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			line-height: 1;
		}

.toolbar-btn:hover .reload-icon {
			transform: rotate(90deg);
		}

.toolbar-btn:active .reload-icon {
			transform: rotate(180deg);
		}

		/* Icône hamburger */
		.hamburger-icon {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			width: 20px;
			height: 16px;
			transition: all 0.3s ease;
		}

.hamburger-icon span {
			display: block;
			width: 20px;
			height: 2px;
			background-color: currentColor;
			border-radius: 1px;
			transition: all 0.3s ease;
		}

.toolbar-btn.active .hamburger-icon,
		.toolbar-btn.menu:hover .hamburger-icon {
			transform: rotate(90deg);
		}

		/* Icônes plein écran */
		.fullscreen-icon,
		.fullscreen-exit-icon {
			width: 26px;
			height: 26px;
			display: block;
		}

.fullscreen-exit-icon {
			display: none;
		}

		body.fullscreen-mode .fullscreen-icon {
			display: none;
		}

		body.fullscreen-mode .fullscreen-exit-icon {
			display: block;
		}

		/* ===== MODE SOMBRE - STYLES UNIFIÉS ===== */
		body.dark-mode {
			background-color: #121212;
			color: #e0e0e0;
		}

		body.dark-mode .title {
			color: inherit !important;
		}

		body.dark-mode .subtitle {
			color: #b0b0b0;
		}

		/* Styles pour TOUS les boutons en mode sombre */
		body.dark-mode .toolbar-btn, 
		body.dark-mode .toolbar-btn.home {
			background-color: #2d3748;
			color: #e0e0e0;
			box-shadow: 0.3rem 0.3rem 0.6rem #1a202c, -0.3rem -0.3rem 0.6rem #4a5568;
		}

		body.dark-mode .toolbar-btn:hover,
		body.dark-mode .toolbar-btn.home:hover {
			background-color: #4a5568;
			color: #e0e0e0;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		body.dark-mode .toolbar-btn:active,
		body.dark-mode .toolbar-btn.home:active {
			background-color: #1a202c;
			box-shadow: inset 0.3rem 0.3rem 0.5rem #1a202c, inset -0.3rem -0.3rem 0.5rem #4a5568;
		}

		body.dark-mode .toolbar-btn.active,
		body.dark-mode .toolbar-btn.home.active {
			background-color: #4a5568;
			color: #ffffff;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		/* Menu coulissant */
		.menu-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			z-index: 1000;
			opacity: 0;
			visibility: hidden;
			transition: all 0.3s ease;
		}

.menu-overlay.open {
			opacity: 1;
			visibility: visible;
		}

.slide-menu {
			position: fixed;
			top: 0;
			right: -300px;
			width: 280px;
			height: 100vh;
			background-color: #e0e5ec;
			transition: right 0.3s ease;
			z-index: 1001;
			padding: 80px 20px 20px;
			display: flex;
			flex-direction: column;
			border-radius: 20px 0 0 20px;
		}

.slide-menu.open {
			right: 0;
		}

		/* Boutons du menu */
		.menu-item {
			display: flex;
			align-items: center;
			padding: 15px;
			border: none;
			background: #e0e5ec;
			color: #444;
			font-size: 14px;
			cursor: pointer;
			border-radius: 8px;
			transition: all 0.2s ease;
			margin-bottom: 5px;
			width: 100%;
			min-width: 240px;
			justify-content: flex-start;
		}

.menu-item:hover {
			background-color: #d1d1d1;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

.menu-item .svg-icon {
			width: 24px;
			height: 24px;
			margin-right: 12px;
			flex-shrink: 0;
			/* La couleur sera héritée du parent .menu-item */
			fill: currentColor;
		}			

		/* Styles pour le menu en mode sombre */
		body.dark-mode .slide-menu {
			background-color: #1a1a1a;
		}

		body.dark-mode .menu-item {
			background: #1a1a1a;
			color: #e0e0e0;
		}

		body.dark-mode .menu-item:hover {
			background-color: #2d2d2d;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #121212, inset -0.2rem -0.2rem 0.3rem #2d2d2d;
		}

		body.dark-mode .menu-item .svg-icon {
			/* La couleur sera héritée du parent .menu-item en mode sombre aussi */
			fill: currentColor;
		}

		/* Styles du jeu */
		body.dark-mode td {
			background-color: #2d2d2d;
			color: #e0e0e0;
			box-shadow: 0.3rem 0.3rem 0.6rem #121212, -0.3rem -0.3rem 0.6rem #4a4a4a;
		}

		body.dark-mode td:active:not(.used) {
			background-color: #1a1a1a;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #121212, inset -0.2rem -0.2rem 0.3rem #2d2d2d;
		}

		body.dark-mode td.used {
			background-color: #1a1a1a;
			color: #a0a0a0;
		}

		body.dark-mode td:not(.used):hover {
			background-color: #3d3d3d;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #121212, inset -0.2rem -0.2rem 0.3rem #2d2d2d;
		}

		/* Styles pour les boutons vérifier et score avec les mêmes ombres */
		#actionButton, #scoreButton {
			margin: 2vh 0;
			padding: 0.5rem 1rem;
			font-size: 14px;
			line-height: 1;
			cursor: pointer;
			width: min(120px, 30vw);
			height: min(50px, 12vw);
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #e0e5ec;
			border: none;
			border-radius: 0.5rem;
			transition: all 0.3s ease;
			
			/* MÊME OMBRE QUE LES BOUTONS TOOLBAR */
			box-shadow: 0.3rem 0.3rem 0.6rem #bebebe, -0.3rem -0.3rem 0.6rem #ffffff;
			position: relative;
		}

		#actionButton:disabled, #scoreButton:disabled {
			background-color: #d0d0d0;
			cursor: not-allowed;
			box-shadow: none;
		}

		#actionButton:hover:not(:disabled), #scoreButton:hover:not(:disabled) {
			background-color: #d1d1d1;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

		#actionButton:active:not(:disabled), #scoreButton:active:not(:disabled) {
			background-color: #c0c0c0;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

		body.dark-mode #actionButton, body.dark-mode #scoreButton {
			background-color: #2d3748;
			color: #e0e0e0;
			box-shadow: 0.3rem 0.3rem 0.6rem #1a202c, -0.3rem -0.3rem 0.6rem #4a5568;
		}

		body.dark-mode #actionButton:hover:not(:disabled), body.dark-mode #scoreButton:hover:not(:disabled) {
			background-color: #4a5568;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		body.dark-mode #actionButton:active:not(:disabled), body.dark-mode #scoreButton:active:not(:disabled) {
			background-color: #1a202c;
			box-shadow: inset 0.3rem 0.3rem 0.5rem #1a202c, inset -0.3rem -0.3rem 0.5rem #4a5568;
		}

		body.dark-mode #actionButton:disabled, body.dark-mode #scoreButton:disabled {
			background-color: #1a1a1a;
			color: #a0a0a0;
		}

		body.dark-mode button {
			background-color: #2d3748;
			color: #e0e0e0;
			box-shadow: 0.3rem 0.3rem 0.6rem #1a202c, -0.3rem -0.3rem 0.6rem #4a5568;
		}

		body.dark-mode button:disabled {
			background-color: #1a1a1a;
			color: #a0a0a0;
		}

		body.dark-mode button:hover:not(:disabled) {
			background-color: #4a5568;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		body.dark-mode button:active:not(:disabled) {
			background-color: #1a1a1a;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		/* Tooltip */
		.tooltip {
			position: absolute;
			background-color: white;
			color: black;
			padding: 5px 10px;
			border-radius: 4px;
			font-size: 12px;
			white-space: nowrap;
			z-index: 10;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.2s ease;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			bottom: 100%;
			left: 50%;
			transform: translateX(-50%);
			margin-bottom: 5px;
		}

		body.dark-mode .tooltip {
			background-color: #1a1a1a;
			color: #e0e0e0;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
		}

		button:hover .tooltip {
			opacity: 1;
		}

		/* Mode daltonien - STYLES RÉPARÉS */
		body.colorblind-mode .correct-mark {
			color: #0000FF !important; /* Bleu au lieu de vert */
		}

		body.colorblind-mode .incorrect-mark {
			color: #FF8C00 !important; /* Orange au lieu de rouge */
		}

		body.colorblind-mode.dark-mode .correct-mark {
			color: #87CEEB !important; /* Bleu clair en mode sombre */
		}

		body.colorblind-mode.dark-mode .incorrect-mark {
			color: #FFA500 !important; /* Orange en mode sombre */
		}

		/* Styles pour les marques de validation - UNIQUEMENT en mode daltonien */
		.validation-mark {
			position: absolute;
			right: 10px;
			top: 50%;
			transform: translateY(-50%);
			font-size: 1.2em;
			pointer-events: none;
			display: none; /* Caché par défaut */
		}

		body.colorblind-mode .validation-mark {
			display: block; /* Affiché uniquement en mode daltonien */
		}

.correct-mark {
			color: #008000;
		}

.incorrect-mark {
			color: #ff0000;
		}

		/* Mode sombre pour les marques */
		body.dark-mode .correct-mark {
			color: #4caf50;
		}

		body.dark-mode .incorrect-mark {
			color: #f44336;
		}

		/* Styles pour les tailles de texte */
		body.text-small {
			font-size: 14px;
		}

		body.text-small .title {
			font-size: clamp(1.5rem, 4vw, 2rem);
		}

		body.text-small .subtitle {
			font-size: clamp(0.8rem, 2.5vw, 1rem);
		}

		body.text-small td {
			font-size: clamp(0.5rem, 2vw, 0.9rem);
		}

		body.text-small button {
			font-size: clamp(0.5rem, 2vw, 0.9rem);
		}

		body.text-small .tooltip {
			font-size: clamp(0.5rem, 2vw, 0.9rem);
		}

		body.text-large {
			font-size: 18px;
		}

		body.text-large .title {
			font-size: clamp(2rem, 6vw, 3rem);
		}

		body.text-large .subtitle {
			font-size: clamp(1.1rem, 3.5vw, 1.4rem);
		}

		body.text-large td {
			font-size: clamp(0.5rem, 3vw, 1.2rem);
		}

		body.text-large button {
			font-size: clamp(0.5rem, 3vw, 1.2rem);
		}

		body.text-large .tooltip {
			font-size: clamp(0.5rem, 3vw, 1.2rem);
		}

		/* Boutons de taille de texte circulaires */
		.text-size-btn {
			padding: 0;
			border-radius: 50%;
			border: none;
			background: #e0e0e0;
			color: #444;
			cursor: pointer;
			font-weight: bold;
			width: 40px;
			height: 40px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
			box-shadow: 0.2rem 0.2rem 0.4rem #bebebe, -0.2rem -0.2rem 0.4rem #ffffff;
		}

		body.dark-mode .text-size-btn {
			background: #2d3748;
			color: #e0e0e0;
			box-shadow: 0.2rem 0.2rem 0.4rem #1a202c, -0.2rem -0.2rem 0.4rem #4a5568;
		}

.text-size-btn.active {
			background: #c0c0c0;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

		body.dark-mode .text-size-btn.active {
			background: #4a5568;
			color: #ffffff;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

.text-size-btn:hover {
			background: #d0d0d0;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #bebebe, inset -0.2rem -0.2rem 0.3rem #ffffff;
		}

		body.dark-mode .text-size-btn:hover {
			background: #4a5568;
			box-shadow: inset 0.2rem 0.2rem 0.3rem #1a202c, inset -0.2rem -0.2rem 0.3rem #4a5568;
		}

		/* NOUVEAUX STYLES POUR LA TAILLE ET POLICE */
		.font-size-control-group {
			display: flex;
			align-items: stretch;
			gap: 0;
		}

.font-size-display {
			display: flex;
			align-items: center;
			background: #e0e5ec;
			border-radius: 8px 0 0 8px;
			padding: 4px 8px;
			box-shadow: inset 2px 2px 4px #bebebe, inset -2px -2px 4px #ffffff;
			min-width: 70px;
			justify-content: center;
			height: 32px;
			border-right: none;
		}

.font-size-value {
			color: #444;
			font-size: 14px;
			min-width: 40px;
			text-align: center;
		}

.triangle-buttons {
			display: flex;
			flex-direction: column;
			gap: 0;
			height: 32px;
			margin-left: 0;
		}

.triangle-btn {
			width: 24px;
			height: 16px;
			background: #e0e5ec;
			border: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 2px 2px 4px #bebebe, -2px -2px 4px #ffffff;
			border-radius: 0;
			padding: 0;
			color: #444;
			transition: all 0.2s ease;
			margin: 0;
			position: relative;
		}

.triangle-btn:first-child {
			border-radius: 0 4px 0 0;
			box-shadow: 2px 0px 2px #bebebe, -2px -2px 2px #ffffff;
			margin-bottom: -1px;
			z-index: 1;
		}

.triangle-btn:last-child {
			border-radius: 0 0 4px 0;
			box-shadow: 2px 2px 2px #bebebe, -2px 0px 2px #ffffff;
			margin-top: -1px;
			z-index: 1;
		}

.triangle-btn:hover {
			box-shadow: 1px 1px 2px #bebebe, -1px -1px 2px #ffffff;
			z-index: 2;
		}

.triangle-btn:active {
			box-shadow: inset 1px 1px 2px #bebebe, inset -1px -1px 2px #ffffff;
		}

.triangle-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

.triangle-up svg,
		.triangle-down svg {
			width: 12px;
			height: 12px;
			fill: none;
			stroke: currentColor;
			stroke-width: 2;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		/* Styles pour les sélecteurs de police */
		.select-container {
			display: flex;
			flex-direction: column;
			gap: 8px;
			margin-top: 10px;
		}

.select {
			width: 100%;
			padding: 8px 12px;
			border-radius: 8px;
			background: #e0e5ec;
			border: none;
			color: #444;
			box-shadow: inset 2px 2px 4px #bebebe, inset -2px -2px 4px #ffffff;
			cursor: pointer;
			font-size: 14px;
		}

		/* Styles pour les icônes dans les paramètres */
		.option-icon {
			width: 20px;
			height: 20px;
			flex-shrink: 0;
		}

.font-size-icon {
			width: 45px;
			height: 35px;
		}

		/* Mode sombre pour les nouveaux éléments */
		body.dark-mode .font-size-display {
			background: #2d3748;
			color: #e0e0e0;
			box-shadow: inset 2px 2px 4px #1a202c, inset -2px -2px 4px #4a5568;
		}

		body.dark-mode .font-size-value {
			color: #e0e0e0;
		}

		body.dark-mode .triangle-btn {
			background: #2d3748;
			color: #e0e0e0;
			box-shadow: 2px 2px 4px #1a202c, -2px -2px 4px #4a5568;
		}

		body.dark-mode .triangle-btn:hover {
			box-shadow: 1px 1px 2px #1a202c, -1px -1px 2px #4a5568;
		}

		body.dark-mode .triangle-btn:active {

		// Fonction utilitaire pour assombrir une couleur
		function darkenColor(color, percent) {
			const num = parseInt(color.replace("#", ""), 16);
			const amt = Math.round(2.55 * percent);
			const R = (num >> 16) - amt;
			const G = (num >> 8 & 0x00FF) - amt;
			const B = (num & 0x0000FF) - amt;
			return "#" + (
				0x1000000 +
				(R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
				(G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
				(B < 255 ? (B < 1 ? 0 : B) : 255)
			).toString(16).slice(1);
		}

		// Gestion du menu coulissant
		function setupMenuListeners() {
			const menuButton = document.getElementById('menuButton');
			const menuOverlay = document.getElementById('menuOverlay');
			const slideMenu = document.getElementById('slideMenu');
			const fullscreenButton = document.getElementById('fullscreenButton');

			// Boutons du menu
			const instructionsButton = document.getElementById('instructionsButton');
			const statsButton = document.getElementById('statsButton');
			const settingsButton = document.getElementById('settingsButton');
			const resetButton = document.getElementById('resetButton');
			const aboutButton = document.getElementById('aboutButton');

			// Ouvrir/fermer le menu
			menuButton.addEventListener('click', toggleMenu);
			menuOverlay.addEventListener('click', closeMenu);

			// Bouton plein écran
			fullscreenButton.addEventListener('click', toggleFullscreen);

			// Actions des boutons du menu
			instructionsButton.addEventListener('click', function () {
				closeMenu();
				showInstructions();
			});

			statsButton.addEventListener('click', function () {
				closeMenu();
				showStats();
			});

			settingsButton.addEventListener('click', function () {
				closeMenu();
				openSettings();
			});

				closeMenu();
				showResetConfirm();
			});

			aboutButton.addEventListener('click', function () {
				closeMenu();
				showAbout();
			});

			// Fermer avec la touche Escape
			document.addEventListener('keydown', function (event) {
				if (event.key === 'Escape') {
					if (showMenu) {
						closeMenu();
					}
					if (document.getElementById('settingsModal').classList.contains('open')) {
						closeSettings();
					}
					if (document.fullscreenElement) {
						document.exitFullscreen();
					}
				}
			});

			// Écouter les changements de mode plein écran
			document.addEventListener('fullscreenchange', updateFullscreenButton);
			document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
			document.addEventListener('mozfullscreenchange', updateFullscreenButton);
			document.addEventListener('MSFullscreenChange', updateFullscreenButton);
		}

		// Mettre à jour l'icône du bouton plein écran
		function updateFullscreenButton() {
			if (document.fullscreenElement || 
				document.webkitFullscreenElement || 
				document.mozFullScreenElement || 
				document.msFullscreenElement) {
				document.body.classList.add('fullscreen-mode');
			} else {
				document.body.classList.remove('fullscreen-mode');
			}
		}

		// Fonction pour basculer le mode plein écran
		function toggleFullscreen() {
			if (!document.fullscreenElement) {
				// Entrer en mode plein écran
				const docEl = document.documentElement;
				if (docEl.requestFullscreen) {
					docEl.requestFullscreen();
				} else if (docEl.webkitRequestFullscreen) {
					docEl.webkitRequestFullscreen();
				} else if (docEl.mozRequestFullScreen) {
					docEl.mozRequestFullScreen();
				} else if (docEl.msRequestFullscreen) {
					docEl.msRequestFullscreen();
				}
			} else {
				// Sortir du mode plein écran
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				} else if (document.mozCancelFullScreen) {
					document.mozCancelFullScreen();
				} else if (document.msExitFullscreen) {
					document.msExitFullscreen();
				}
			}
		}

		function toggleMenu() {
			showMenu = !showMenu;
			const menuButton = document.getElementById('menuButton');
			const slideMenu = document.getElementById('slideMenu');
			const menuOverlay = document.getElementById('menuOverlay');

			if (showMenu) {
				menuButton.classList.add('active');
				slideMenu.classList.add('open');
				menuOverlay.classList.add('open');
			} else {
				menuButton.classList.remove('active');
				slideMenu.classList.remove('open');
				menuOverlay.classList.remove('open');
			}
		}

		function closeMenu() {
			showMenu = false;
			document.getElementById('menuButton').classList.remove('active');
			document.getElementById('slideMenu').classList.remove('open');
			document.getElementById('menuOverlay').classList.remove('open');
		}

		// Gestion des paramètres
		function setupSettingsModal() {
			const settingsModal = document.getElementById('settingsModal');
			const closeSettingsBtn = document.getElementById('closeSettings');
			const darkModeToggle = document.getElementById('darkModeToggle');
			const colorblindModeToggle = document.getElementById('colorblindModeToggle');

			// Gestion des toggles
			darkModeToggle.addEventListener('change', function() {
				toggleDarkMode(this.checked);

			});

			// Initialiser l'état des toggles
			darkModeToggle.checked = darkMode;
			colorblindModeToggle.checked = colorblindMode;

		function isVerticalLayout() {
			return window.innerWidth <= 768;

		function getRandomElements(array, count, useRandomOrder) {
			const maxPairs = Math.min(count, array.length);
			
			if (useRandomOrder) {
				const shuffled = array.slice().sort(() => 0.5 - Math.random());
				return shuffled.slice(0, maxPairs);
			} else {
				return array.slice(0, maxPairs);
			}
		}
		
		function loadReperes(argsData) {
			const repTable = document.getElementById('repereTable');
			const defTable = document.getElementById('definitionTable');
			repTable.innerHTML = '';
			defTable.innerHTML = '';
			
			const maxPairs = window.settings.maxPairs ? Math.min(window.settings.maxPairs, argsData.length) : Math.min(5, argsData.length);
			const randomParts = getRandomElements(argsData, maxPairs, window.settings.randomOrder);
			const shuffledNames = randomParts.map(part => part.colonne_de_gauche).sort(() => 0.5 - Math.random());
			const shuffledDefinitions = randomParts.map(part => part.colonne_de_droite).sort(() => 0.5 - Math.random());
			
			// Tableau de gauche (inchangé)
			shuffledNames.forEach((name, index) => {
				const repRow = document.createElement('tr');
				const repCell = document.createElement('td');
				repCell.textContent = name;
				repCell.dataset.index = index;
				repCell.dataset.original = name; // Stocker le texte original
				repRow.appendChild(repCell);
				repTable.appendChild(repRow);
			});
			
			// Tableau de droite (2e colonne seulement)
			shuffledDefinitions.forEach((definition, index) => {
				const defRow = document.createElement('tr');
				
				// Cellule de définition (seule cellule maintenant)
				const defCell = document.createElement('td');
				defCell.textContent = definition;
				defCell.dataset.index = index;
				defCell.dataset.definition = definition; // Stocker la définition pour la vérification
				defCell.dataset.original = definition; // Stocker le texte original
				defRow.appendChild(defCell);
				
				defTable.appendChild(defRow);
			});
			
			return randomParts;
		}
		
		function selectCell(event, type, info) {
			const cell = event.target;
			if (usedCells.has(cell)) return;
			const rect = cell.getBoundingClientRect();
			const canvasRect = canvas.getBoundingClientRect();
			const isVertical = isVerticalLayout();
			const totalCells = selectedReperes.length;
			if (type === 'repere') {
				const repereIndex = parseInt(cell.dataset.index);
				if (drawing && currentDefinition) {
					const repereRect = rect;
					const defRect = currentDefinition.cell.getBoundingClientRect();
					const startX = isVertical
							? repereRect.left + (repereRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
							: repereRect.right - 5 - canvasRect.left;
					const startY = isVertical
							? repereRect.bottom - 5 - canvasRect.top
							: repereRect.top + repereRect.height / 2 - canvasRect.top;
					const endX = isVertical
							? defRect.left + (defRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
							: defRect.left + 5 - canvasRect.left;
					const endY = isVertical
							? defRect.top + 5 - canvasRect.top
							: defRect.top + defRect.height / 2 - canvasRect.top;
					// Flèches adaptées selon les paramètres
					let lineColor = "black";
					if (darkMode) lineColor = "white";
					drawLink(startX, startY, endX, endY, lineColor);
					links.push({
						repere: info,
						definition: currentDefinition.text,
						lineId: { startX, startY, endX, endY },
					});
					usedCells.add(cell);
					usedCells.add(currentDefinition.cell);
					cell.classList.add('used');
					currentDefinition.cell.classList.add('used');
					
					
					resetDrawing();
					actionButton.disabled = links.length !== selectedReperes.length;
				} else {
					drawing = true;
					currentRepere = { info, cell };
					currentDefinition = null;
				}
			} else if (type === 'definition') {
				if (drawing && currentRepere) {
					const repereRect = currentRepere.cell.getBoundingClientRect();
					const defRect = rect;
					const repereIndex = parseInt(currentRepere.cell.dataset.index);
					const startX = isVertical
							? repereRect.left + (repereRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
							: repereRect.right - 5 - canvasRect.left;
					const startY = isVertical
							? repereRect.bottom - 5 - canvasRect.top
							: repereRect.top + repereRect.height / 2 - canvasRect.top;
					const endX = isVertical
							? defRect.left + (defRect.width * (repereIndex + 0.5) / totalCells) - canvasRect.left
							: defRect.left + 5 - canvasRect.left;
					const endY = isVertical
							? defRect.top + 5 - canvasRect.top
							: defRect.top + defRect.height / 2 - canvasRect.top;
					// Flèches adaptées selon les paramètres
					let lineColor = "black";
					if (darkMode) lineColor = "white";
					drawLink(startX, startY, endX, endY, lineColor);
					links.push({
						repere: currentRepere.info,
						definition: cell.textContent,
						lineId: { startX, startY, endX, endY },
					});
					usedCells.add(cell);
					usedCells.add(currentRepere.cell);
					cell.classList.add('used');
					currentRepere.cell.classList.add('used');
					resetDrawing();
					actionButton.disabled = links.length !== selectedReperes.length;
				} else {
					drawing = true;
					currentDefinition = { text: cell.textContent, cell };
					currentRepere = null;
				}
			}
		}
		
		function drawLink(startX, startY, endX, endY, color = "black") {
			ctx.beginPath();
			ctx.moveTo(startX, startY);
			ctx.lineTo(endX, endY);
			const headlen = 10;
			const angle = Math.atan2(endY - startY, endX - startX);
			ctx.lineTo(
				endX - headlen * Math.cos(angle - Math.PI / 6),
				endY - headlen * Math.sin(angle - Math.PI / 6)
			);
			ctx.moveTo(endX, endY);
			ctx.lineTo(
				endX - headlen * Math.cos(angle + Math.PI / 6),
				endY - headlen * Math.sin(angle + Math.PI / 6)
			);
			ctx.strokeStyle = color;
			ctx.lineWidth = 2;
			ctx.stroke();
		}
		
		function resetDrawing() {
			drawing = false;
			currentRepere = null;
			currentDefinition = null;
			currentAction = "check";
			document.getElementById("actionButton").innerHTML = 'vérifier<span class="tooltip">Vérifier les associations, afficher les corrections ou recharger l\'exercice</span>';
			actionButton.disabled = links.length !== selectedReperes.length;
		}
		
		function performAction() {
			if (actionButton.disabled) return;
			switch (currentAction) {
				case "check":
					checkLinks();
					break;
				case "correct":
					correctLinks();
					break;
				case "reload":
					reload();
					break;
				}
		}
		
		// Fonction checkLinks avec support du mode daltonien - CORRIGÉE
		function checkLinks() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			let correctCount = 0;
			
			links.forEach((link) => {
				const correspondingPart = selectedReperes.find(
					(part) => part.colonne_de_gauche === link.repere
				);
				const isCorrect = correspondingPart
					? correspondingPart.colonne_de_droite === link.definition
					: false;
				
				// COULEURS selon le mode daltonien - CORRECTION
				let color;
				if (colorblindMode) {
					// Mode daltonien - utiliser bleu/orange
					color = isCorrect ? '#0000FF' : '#FF8C00'; // Bleu/Orange
				} else {
					// Mode normal - utiliser vert/rouge
					color = isCorrect ? '#008000' : '#ff0000';
				}
				
				// Ajuster pour le mode sombre si nécessaire
				if (darkMode && !colorblindMode) {
					color = isCorrect ? '#4caf50' : '#f44336';
				} else if (darkMode && colorblindMode) {
					color = isCorrect ? '#87CEEB' : '#FFA500'; // Bleu clair/Orange en mode sombre
				}
				
				drawLink(link.lineId.startX, link.lineId.startY, link.lineId.endX, link.lineId.endY, color);
				link.isCorrect = isCorrect;
				if (isCorrect) correctCount++;
				
				// Afficher les marques de validation UNIQUEMENT en mode daltonien
				if (colorblindMode) {
					showValidationMark(link.definition, isCorrect);
				}
			});
			
			totalCorrect += correctCount;
			totalAnswers += selectedReperes.length;
			scoreButton.innerHTML = `${totalCorrect} / ${totalAnswers}<span class="tooltip">Affiche le score actuel (réponses correctes / total)</span>`;
			scoreButton.disabled = false;
			currentAction = "correct";
			document.getElementById("actionButton").innerHTML = 'corriger<span class="tooltip">Vérifier les associations, afficher les corrections ou recharger l\'exercice</span>';
			actionButton.disabled = false;
		}

		// Fonction pour afficher les marques de validation dans la 2e colonne
		function showValidationMark(definition, isCorrect) {
			const definitionCells = document.querySelectorAll('#definitionTable td');
			definitionCells.forEach(cell => {
				if (cell.textContent === definition) {
					// Supprimer toute marque existante
					const existingMark = cell.querySelector('.validation-mark');
					if (existingMark) {
						existingMark.remove();
					}
					
					// Ajouter la nouvelle marque
					const mark = document.createElement('span');
					mark.className = `validation-mark ${isCorrect ? 'correct-mark' : 'incorrect-mark'}`;
					mark.textContent = isCorrect ? '✔' : '❌';
					
					// Appliquer la couleur selon le mode daltonien
					if (colorblindMode) {
						if (darkMode) {
							mark.style.color = isCorrect ? '#87CEEB' : '#FFA500';
						} else {
							mark.style.color = isCorrect ? '#0000FF' : '#FF8C00';
						}
					} else {
						if (darkMode) {
							mark.style.color = isCorrect ? '#4caf50' : '#f44336';
						} else {
							mark.style.color = isCorrect ? '#008000' : '#ff0000';
						}
					}
					
					cell.appendChild(mark);
				}
			});
		}
		
		// Fonction correctLinks avec support du mode daltonien - CORRIGÉE
		function correctLinks() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			const repereTable = document.getElementById("repereTable");
			const definitionTable = document.getElementById("definitionTable");
			const canvasRect = canvas.getBoundingClientRect();
			const isVertical = isVerticalLayout();
			
			selectedReperes.forEach((repere) => {
				// CORRECTION : Utiliser dataset.original pour trouver les cellules
				const repereCell = Array.from(repereTable.querySelectorAll('td')).find(
					(cell) => cell.dataset.original === repere.colonne_de_gauche
				);
				const definitionCell = Array.from(definitionTable.querySelectorAll('td')).find(
					(cell) => cell.dataset.original === repere.colonne_de_droite
				);
				
				if (repereCell && definitionCell) {
					const repereRect = repereCell.getBoundingClientRect();
					const defRect = definitionCell.getBoundingClientRect();
					
					// CORRECTION : Calculer les coordonnées correctes
					const startX = isVertical
							? repereRect.left + repereRect.width / 2 - canvasRect.left
							: repereRect.right - 5 - canvasRect.left;
					const startY = isVertical
							? repereRect.bottom - 5 - canvasRect.top
							: repereRect.top + repereRect.height / 2 - canvasRect.top;
					const endX = isVertical
							? defRect.left + defRect.width / 2 - canvasRect.left
							: defRect.left + 5 - canvasRect.left;
					const endY = isVertical
							? defRect.top + 5 - canvasRect.top
							: defRect.top + defRect.height / 2 - canvasRect.top;
					
					// COULEURS selon le mode daltonien - CORRECTION
					let color;
					if (colorblindMode) {
						// Mode daltonien - utiliser bleu
						color = darkMode ? '#87CEEB' : '#0000FF'; // Bleu clair/Bleu
					} else {
						// Mode normal - utiliser vert
						color = darkMode ? '#4caf50' : '#008000';
					}
					
					drawLink(startX, startY, endX, endY, color);
				} else {
					console.warn(
						`Erreur : Cellule non trouvée pour repère "${repere.colonne_de_gauche}" ou définition "${repere.colonne_de_droite}"`
					);
				}
			});
			
			currentAction = "reload";
			document.getElementById("actionButton").innerHTML = '<span class="reload-icon">↻</span><span class="tooltip">Vérifier les associations, afficher les corrections ou recharger l\'exercice</span>';
			actionButton.disabled = false;
		}
		
		function reload() {
			links.length = 0;
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			usedCells.clear();
			const repCells = document.getElementById("repereTable").getElementsByTagName("td");
			const defCells = document.getElementById("definitionTable").getElementsByTagName("td");
			Array.from(repCells).forEach((cell) => cell.classList.remove("used"));
			Array.from(defCells).forEach((cell) => {
				cell.classList.remove("used");
				// Supprimer les marques de validation
				const existingMark = cell.querySelector('.validation-mark');
				if (existingMark) {
					existingMark.remove();
				}
			});
			
			document.getElementById("repereTable").innerHTML = "";
			document.getElementById("definitionTable").innerHTML = "";
			selectedReperes = loadReperes(window.argumentsData);
			resetDrawing();
			addEventListeners();
			resizeCanvas();
			actionButton.disabled = true;
		}
		
		function addEventListeners() {
			const repCells = document.getElementById("repereTable").getElementsByTagName("td");
			const defCells = document.getElementById("definitionTable").getElementsByTagName("td");
			Array.from(repCells).forEach((cell) => {
				cell.addEventListener("click", (event) => selectCell(event, "repere", cell.textContent));
			});
			Array.from(defCells).forEach((cell) => {
				cell.addEventListener("click", (event) => selectCell(event, "definition", cell.textContent));
			});
		}
		
		function resizeCanvas() {
			const container = document.querySelector('.container');
			canvas.width = container.offsetWidth;
			canvas.height = container.offsetHeight;
		}

		// Écouter le redimensionnement pour ajuster le titre
		window.addEventListener('resize', function() {
			resizeCanvas();
			formatTitleForMobile(window.title);
		});

		window.addEventListener('load', resizeCanvas);
		
		// Démarrer l'application
		document.addEventListener('DOMContentLoaded', function() {
			loadExternalResources();
		});
	</script>
</body>
</html>
