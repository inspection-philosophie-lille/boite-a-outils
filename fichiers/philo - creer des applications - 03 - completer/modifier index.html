<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico" />
	<title>application « compléter »</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg-color: #e0e5ec;
			--primary-light: #ffffff;
			--primary-dark: #a3b1c6;
			--text-color: #4a5568;
			--accent-color: #4f46e5;
			--accent-light: #6366f1;
			--accent-dark: #4338ca;
			--success-color: #10b981;
			--warning-color: #f59e0b;
			--danger-color: #ef4444;
			--shadow-light: rgba(255, 255, 255, 0.8);
			--shadow-dark: rgba(163, 177, 198, 0.6);
			--highlight-color: #bbf7d0;
			--highlight-border: #22c55e;
		}

		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			line-height: 1.6;
			color: var(--text-color);
			background-color: var(--bg-color);
			padding: 20px;
			max-width: 1400px;
			margin: 0 auto;
			min-height: 100vh;
		}

		header {
			text-align: center;
			margin-bottom: 10px;
			padding: 10px 20px;
			background: var(--bg-color);
			border-radius: 25px;
			box-shadow:
				8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light),
				inset 1px 1px 2px var(--shadow-light), inset -1px -1px 2px var(--shadow-dark);
		}

		h1 {
			color: red;
			margin-bottom: 0px;
			font-size: 2.2rem;
			font-weight: 700;
			text-shadow: 1px 1px 1px var(--shadow-light);
		}

		.subtitle {
			color: var(--text-color);
			font-size: 1.1rem;
			margin-bottom: 0px;
			opacity: 0.8;
		}

		.container {
			display: flex;
			flex-direction: column;
			gap: 30px;
		}

		.panel {
			background: var(--bg-color);
			border-radius: 25px;
			padding: 30px;
			box-shadow:
				8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light),
				inset 1px 1px 2px var(--shadow-light), inset -1px -1px 2px var(--shadow-dark);
			transition: all 0.3s ease;
		}

		.panel:hover {
			box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light),
				inset 1px 1px 2px var(--shadow-light), inset -1px -1px 2px var(--shadow-dark);
		}

		.panel h2 {
			color: var(--accent-color);
			margin-bottom: 20px;
			font-size: 1.5rem;
			padding-bottom: 15px;
			border-bottom: 2px solid;
			border-image: linear-gradient(to right, var(--accent-color), transparent) 1;
			font-weight: 600;
		}

		.form-group {
			margin-bottom: 25px;
		}

		label {
			display: block;
			margin-bottom: 10px;
			font-weight: 600;
			color: var(--text-color);
		}

		input[type="text"],
		.rich-editor {
			width: 100%;
			padding: 15px;
			background: var(--bg-color);
			border: none;
			border-radius: 15px;
			font-family: 'Inter', sans-serif;
			font-size: 1rem;
			color: var(--text-color);
			box-shadow:
				inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
			transition: all 0.3s ease;
		}

		.rich-editor {
			min-height: 180px;
			overflow-y: auto;
			line-height: 1.6;
		}

		.rich-editor:focus {
			outline: none;
			box-shadow: inset 6px 6px 12px var(--shadow-dark),
				inset -6px -6px 12px var(--shadow-light), 0 0 0 2px rgba(79, 70, 229, 0.2);
		}

		/* Style pour surlignage des mots manquants */
		.hl-word {
			background-color: var(--highlight-color);
			border-bottom: 2px solid var(--highlight-border);
			border-radius: 4px;
			cursor: pointer;
			transition: all 0.1s ease;
			display: inline-block;
			padding: 0 2px;
		}

		.hl-word:hover {
			background-color: #a3e9b5;
			transform: scale(1.01);
		}

		.citation-container {
			margin-bottom: 30px;
			padding: 25px;
			background: var(--bg-color);
			border-radius: 20px;
			box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light),
				inset 1px 1px 2px var(--shadow-light), inset -1px -1px 2px var(--shadow-dark);
			border-left: 5px solid var(--accent-color);
		}

		.citation-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.citation-title {
			background: linear-gradient(145deg, var(--accent-light), var(--accent-color));
			display: inline-flex;
			align-items: center;
			padding: 6px 18px;

			box-shadow: 4px 4px 8px rgba(79, 70, 229, 0.3);

		.citation-title .counter {
			background: transparent;
			color: white;

		.source-line {
			text-align: right;
			margin-top: 15px;
			padding-top: 10px;
			border-top: 1px dashed rgba(163, 177, 198, 0.4);
		}

		.manques-list {
			margin-top: 15px;
			padding: 12px 15px;
			background: rgba(79, 70, 229, 0.08);
			border-radius: 12px;
			font-size: 0.9rem;
			border-left: 3px solid var(--accent-color);
		}

		.manques-list strong {
			color: var(--accent-color);
		}

		.manques-list .manque-badge {
			display: inline-block;
			background: var(--highlight-color);
			color: #166534;
			padding: 4px 10px;
			border-radius: 20px;
			margin: 4px 6px 4px 0;
			font-size: 0.85rem;
			border: 1px solid var(--highlight-border);
		}

		.button-group {
			display: flex;
			gap: 20px;
			margin-top: 25px;
			flex-wrap: wrap;
		}

		button {
			padding: 14px 28px;
			border: none;
			border-radius: 15px;
			font-size: 1rem;
			cursor: pointer;
			font-weight: 600;
			transition: all 0.3s ease;
			color: var(--text-color);
			background: var(--bg-color);
			box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
			position: relative;
			overflow: hidden;

		button:active {
			transform: translateY(2px);
			box-shadow:

				inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
		}

		button:hover {
			transform: translateY(-1px);
		}

		.btn-primary {
			color: white;
			background: linear-gradient(145deg, var(--accent-light), var(--accent-color));
			box-shadow: 4px 4px 8px rgba(79, 70, 229, 0.3), -4px -4px 8px rgba(255, 255, 255, 0.8);
		}

		.btn-secondary {
			color: white;
			background: linear-gradient(145deg, var(--success-color), #0da271);
		}

		.btn-warning {
			color: white;
			background: linear-gradient(145deg, var(--warning-color), #d97706);
		}

		.btn-danger {
			color: white;
			background: linear-gradient(145deg, var(--danger-color), #dc2626);
		}

		.btn-add {
			color: white;
			background: linear-gradient(145deg, #8b5cf6, #7c3aed);
			margin-top: 20px;
			margin-bottom: 20px;
		}

		.format-toolbar {
			display: flex;
			gap: 8px;
			margin-bottom: 12px;
			flex-wrap: wrap;
		}

		.format-btn {
			padding: 8px 14px;
			font-size: 0.85rem;
			background: var(--bg-color);
			box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
			border-radius: 12px;
			cursor: pointer;
			font-weight: 600;
		}

		.format-btn:hover {
			transform: translateY(-1px);
			background: var(--accent-light);
			color: white;
		}

		.file-load-row {
			display: flex;
			align-items: stretch;
			gap: 15px;
			flex-wrap: wrap;
			margin-bottom: 20px;
		}

		.file-input-label {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 25px;
			background: linear-gradient(145deg, var(--accent-light), var(--accent-color));
			color: white;
			border-radius: 15px;
			cursor: pointer;
			font-weight: 600;
			transition: all 0.3s ease;
			box-shadow: 4px 4px 8px rgba(79, 70, 229, 0.3);
			height: 52px;
			flex: 1;
			min-width: 200px;
		}

		.file-input-label:hover {
			transform: translateY(-2px);
		}

		.file-input-label input {
			display: none;
		}

		.new-file-btn {
			flex: 1;
			min-width: 200px;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 52px;
		}

		.new-file-btn button {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
		}

		.download-section {
			margin-top: 10px;
			text-align: center;
		}

		.download-section button {
			width: 100%;
			max-width: 400px;
			margin: 0 auto;
		}

		.alert {
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 25px;
			animation: slideIn 0.3s ease;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.alert-success {
			background: #d1fae5;
			color: #065f46;
			border-left: 5px solid var(--success-color);
		}

		.alert-error {
			background: #fee2e2;
			color: #7f1d1d;
			border-left: 5px solid var(--danger-color);
		}

		@media (max-width: 768px) {

			.file-load-row {
				flex-direction: column;
			}

			.citation-header {
				flex-direction: column;
				align-items: flex-start;
				gap: 12px;
			}

			.delete-citation-btn {
				align-self: flex-end;
			}

	</style>

<body>
	<header>
		<h1>application « compléter »</h1>
		<p class="subtitle">désigner les mots qui seront à trouver en les surlignant</p>
	</header>
	<div class="container">
		<div class="panel">
			<h2>charger un fichier existant</h2>
			<div class="file-load-row">
				<label class="file-input-label">
					<input type="file" id="jsFileInput" class="file-input" accept=".js">
					📂 choisir un fichier JS
				</label>
				<div class="new-file-btn">
					<button type="button" class="btn-secondary" id="newFileBtn">📄 nouveau fichier</button>
				</div>
			</div>
		</div>
		<div id="alertContainer"></div>
		<div class="panel">
			<h2>1. titres de l'application</h2>
			<div class="form-group"><label>titre</label><input type="text" id="appTitle"
					placeholder="ex: citations à compléter"></div>
			<div class="form-group"><label>sous-titre</label><input type="text" id="appSubtitle"
					placeholder="ex: réviser le cours"></div>
		</div>
		<div class="panel">
			<h2>2. texte avec mots manquants</h2>
			<div id="citationsContainer"></div>
			<div class="add-button-container"><button type="button" class="btn-add" id="addCitation">+ ajouter un nouveau texte</button></div>
		</div>
		<div class="download-section"><button type="button" class="btn-primary" id="downloadBtn"
				style="padding:15px 30px; font-size:1.1rem;">📥 exporter fichier JS</button></div>
	</div>
	<script>
		// ---------- État ----------
		let citations = [];
		const appTitleInput = document.getElementById('appTitle');
		const appSubtitleInput = document.getElementById('appSubtitle');
		const citationsContainer = document.getElementById('citationsContainer');
		const addCitationBtn = document.getElementById('addCitation');
		const newFileBtn = document.getElementById('newFileBtn');
		const downloadBtn = document.getElementById('downloadBtn');
		const jsFileInput = document.getElementById('jsFileInput');
		const alertContainer = document.getElementById('alertContainer');

		function showAlert(msg, type = 'info') {
			const div = document.createElement('div');
			div.className = `alert alert-${type}`;
			div.innerHTML = msg;
			alertContainer.innerHTML = '';
			alertContainer.appendChild(div);
			setTimeout(() => { div.style.opacity = '0'; setTimeout(() => { if (div.parentNode) alertContainer.removeChild(div); }, 500); }, 4000);
		}

		// Convertir le stockage (avec **) en affichage (sans **, avec spans)
		function convertStorageToDisplay(storageText) {
			if (!storageText) return '';
			return storageText.replace(/\*\*([^*]+)\*\*/g, '<span class="hl-word" data-manque="true">$1</span>');
		}

		// Convertir l'affichage (avec spans) en stockage (avec **)
		function convertDisplayToStorage(displayHtml) {
			if (!displayHtml) return '';
			const div = document.createElement('div');
			div.innerHTML = displayHtml;
			const spans = div.querySelectorAll('.hl-word');
			spans.forEach(span => {
				const text = span.innerText;
				const replacement = `**${text}**`;
				span.outerHTML = replacement;
			});
			return div.innerHTML;
		}

		// Extraire la liste des mots manquants à partir du texte stocké (avec **)
		function extractManquesFromStorage(text) {
			const matches = text.match(/\*\*([^*]+)\*\*/g);
			if (!matches) return [];
			return matches.map(m => m.slice(2, -2));
		}

		// Appliquer mise en forme classique
		function applyFormatOnEditor(editor, openTag, closeTag) {
			if (!editor) return;
			editor.focus();
			const selection = window.getSelection();
			if (selection.rangeCount === 0) return;
			const range = selection.getRangeAt(0);
			if (range.collapsed) {
				showAlert("sélectionner d'abord le texte à mettre en forme.", "info");
				return;
			}
			
			const selectedHTML = range.extractContents();
			const wrapper = document.createElement('span');
			wrapper.appendChild(selectedHTML);
			const beforeHTML = wrapper.innerHTML;
			const newContent = openTag + beforeHTML + closeTag;
			const frag = document.createRange().createContextualFragment(newContent);
			range.deleteContents();
			range.insertNode(frag);
			editor.normalize();
			editor.dispatchEvent(new Event('input'));
		}

		// Marquer la sélection comme mot manquant - transformation directe en span.hl-word
		function markAsManquant(editor, citationIdx, manquesListDiv) {
			if (!editor) return;
			editor.focus();
			const selection = window.getSelection();
			if (selection.rangeCount === 0) return;
			const range = selection.getRangeAt(0);
			if (range.collapsed) {
				showAlert("sélectionner d'abord le mot ou la portion à marquer comme manquant.", "info");
				return;
			}
			
			const selectedText = range.toString();
			if (!selectedText.trim()) {
				showAlert("sélectionner du texte non vide.", "info");
				return;
			}
			
			// Vérifier si la sélection est déjà dans un span .hl-word
			let parent = range.commonAncestorContainer;
			if (parent.nodeType === Node.TEXT_NODE) parent = parent.parentElement;
			if (parent.classList && parent.classList.contains('hl-word')) {
				showAlert("Ce mot est déjà marqué comme manquant.", "info");
				return;
			}
			
			// Remplacer la sélection par un span.hl-word (pas de ** visibles)
			const span = document.createElement('span');
			span.className = 'hl-word';
			span.setAttribute('data-manque', 'true');
			span.textContent = selectedText;
			
			range.deleteContents();
			range.insertNode(span);
			
			// Mettre à jour le stockage
			updateCitationFromEditor(editor, citationIdx);
			
			// Rafraîchir immédiatement la liste des mots manquants
			if (manquesListDiv) updateManquesListDisplay(manquesListDiv, citationIdx);
			
			showAlert("Mot marqué comme manquant (surligné en vert).", "success");
		}

		// Enlever le marquage de mot manquant
		function unmarkManquant(editor, citationIdx, manquesListDiv) {
			if (!editor) return;
			editor.focus();
			const selection = window.getSelection();
			if (selection.rangeCount === 0) return;
			const range = selection.getRangeAt(0);
			
			if (range.collapsed) {
				// Pas de sélection : demander confirmation pour tout supprimer
				const spans = editor.querySelectorAll('.hl-word');
				if (spans.length === 0) {
					showAlert("Aucun mot surligné dans ce texte.", "info");
					return;
				}
				if (confirm(`Effacer TOUS les surlignages (${spans.length} mots) de ce texte ?`)) {
					spans.forEach(span => {
						const textNode = document.createTextNode(span.textContent);
						span.parentNode.replaceChild(textNode, span);
					});
					editor.normalize();
					updateCitationFromEditor(editor, citationIdx);
					if (manquesListDiv) updateManquesListDisplay(manquesListDiv, citationIdx);
					showAlert("Tous les surlignages supprimés.", "success");
				}
				return;
			}
			
			// Avec sélection : ne supprimer que les spans dans la sélection
			let removed = false;
			const walker = document.createTreeWalker(
				range.commonAncestorContainer,
				NodeFilter.SHOW_ELEMENT,
				{
					acceptNode: (node) => {
						if (node.classList && node.classList.contains('hl-word')) {
							return NodeFilter.FILTER_ACCEPT;
						}
						return NodeFilter.FILTER_SKIP;
					}
				}
			);
			
			const spansToRemove = [];
			while (walker.nextNode()) {
				if (range.intersectsNode(walker.currentNode)) {
					spansToRemove.push(walker.currentNode);
				}
			}
			
			spansToRemove.forEach(span => {
				const textNode = document.createTextNode(span.textContent);
				span.parentNode.replaceChild(textNode, span);
				removed = true;
			});
			
			if (removed) {
				editor.normalize();
				updateCitationFromEditor(editor, citationIdx);
				if (manquesListDiv) updateManquesListDisplay(manquesListDiv, citationIdx);
				showAlert("Surlignage(s) retiré(s) de la sélection.", "success");
			} else {
				showAlert("Aucun mot surligné dans la sélection.", "info");
			}
		}
		
		function updateCitationFromEditor(editor, citationIdx) {
			let content = editor.innerHTML;
			const sourceMatch = content.match(/<div class="source-line">([\s\S]*?)<\/div>/);
			let source = '';
			let mainContent = content;
			if (sourceMatch) {
				source = sourceMatch[1];
				mainContent = content.replace(/<div class="source-line">[\s\S]*?<\/div>/, '');
			}
			const storageText = convertDisplayToStorage(mainContent);
			citations[citationIdx].texte = storageText;
			citations[citationIdx].source = source;
		}

		// Créer la barre d'outils
		function createToolbar(editorId, citationIdx, manquesListDiv) {
			const toolbar = document.createElement('div');
			toolbar.className = 'format-toolbar';

			const italicBtn = document.createElement('button');
			italicBtn.innerHTML = '<em>I</em> (italique)';
			italicBtn.classList.add('format-btn');
			italicBtn.onclick = (e) => {
				e.preventDefault();
				const editor = document.getElementById(editorId);
				if (editor) applyFormatOnEditor(editor, '<em>', '</em>');
			};

			const boldBtn = document.createElement('button');
			boldBtn.innerHTML = '<strong>G</strong> (gras)';
			boldBtn.classList.add('format-btn');
			boldBtn.onclick = (e) => {
				e.preventDefault();
				const editor = document.getElementById(editorId);
				if (editor) applyFormatOnEditor(editor, '<strong>', '</strong>');
			};

			const markManquantBtn = document.createElement('button');
			markManquantBtn.innerHTML = '🟢 surligner comme manquant';
			markManquantBtn.classList.add('format-btn');
			markManquantBtn.style.background = '#bbf7d0';
			markManquantBtn.style.color = '#166534';
			markManquantBtn.onclick = (e) => {
				e.preventDefault();
				const editor = document.getElementById(editorId);
				if (editor) markAsManquant(editor, citationIdx, manquesListDiv);
			};

			const unmarkManquantBtn = document.createElement('button');
			unmarkManquantBtn.innerHTML = '🧽 enlever le surlignage';
			unmarkManquantBtn.classList.add('format-btn');
			unmarkManquantBtn.style.background = '#fecaca';
			unmarkManquantBtn.style.color = '#991b1b';
			unmarkManquantBtn.onclick = (e) => {
				e.preventDefault();
				const editor = document.getElementById(editorId);
				if (editor) unmarkManquant(editor, citationIdx, manquesListDiv);
			};

			const nbspBtn = document.createElement('button');
			nbspBtn.innerHTML = '␣ espace insécable';
			nbspBtn.classList.add('format-btn');
			nbspBtn.onclick = (e) => {
				e.preventDefault();
				const editor = document.getElementById(editorId);
				if (editor) {
					editor.focus();
					document.execCommand('insertHTML', false, '&nbsp;');
					editor.dispatchEvent(new Event('input'));
				}
			};

			toolbar.append(italicBtn, boldBtn, markManquantBtn, unmarkManquantBtn, nbspBtn);
			return toolbar;
		}

		function updateManquesListDisplay(manquesListDiv, idx) {
			const texteRaw = citations[idx].texte || '';
			const manques = extractManquesFromStorage(texteRaw);
			if (manques.length === 0) {
				manquesListDiv.innerHTML = '<strong>📝 mots manquants :</strong> aucun mot manquant détecté — sélectionner un mot et cliquer sur "🟢 marquer comme manquant"';
			} else {
				const badges = manques.map(m => `<span class="manque-badge">${escapeHtml(m)}</span>`).join('');
				manquesListDiv.innerHTML = `<strong>🔍 mots manquants (${manques.length}) :</strong><br>${badges}`;
			}
		}

		function escapeHtml(str) {
			return str.replace(/[&<>]/g, function(m) {
				if (m === '&') return '&amp;';
				if (m === '<') return '&lt;';
				if (m === '>') return '&gt;';
				return m;
			});
		}

		function buildDisplayContent(citation) {
			let content = convertStorageToDisplay(citation.texte || '');
			if (citation.source && citation.source.trim()) {
				content += `<div class="source-line">${citation.source}</div>`;
			}
			return content;
		}

		function renderCitations() {
			citationsContainer.innerHTML = '';
			if (citations.length === 0) {
				citationsContainer.innerHTML = '<p style="text-align:center;padding:20px;">⚠️ aucun texte — cliquer sur "+ ajouter un nouveau texte" pour commencer</p>';
				return;
			}

			citations.forEach((citation, idx) => {
				const citationDiv = document.createElement('div');
				citationDiv.className = 'citation-container';

				const header = document.createElement('div');
				header.className = 'citation-header';
				const titleSpan = document.createElement('div');
				titleSpan.className = 'citation-title';
				titleSpan.appendChild(document.createTextNode('texte n°'));
				const counterSpan = document.createElement('span');
				counterSpan.className = 'counter';
				counterSpan.textContent = `${idx + 1}`;
				titleSpan.appendChild(counterSpan);
				const deleteBtn = document.createElement('button');
				deleteBtn.type = 'button';
				deleteBtn.className = 'btn-danger delete-citation-btn';
				deleteBtn.textContent = '🗑 supprimer';
				deleteBtn.style.padding = '8px 18px';
				header.appendChild(titleSpan);
				header.appendChild(deleteBtn);
				citationDiv.appendChild(header);

				const contentGroup = document.createElement('div');
				contentGroup.className = 'form-group';
				const editor = document.createElement('div');
				editor.className = 'rich-editor';
				editor.setAttribute('contenteditable', 'true');
				editor.setAttribute('data-citation-idx', idx);
				editor.id = `editor_${idx}`;

				editor.innerHTML = buildDisplayContent(citation);

				// Créer d'abord la div pour la liste des mots manquants
				const manquesListDiv = document.createElement('div');
				manquesListDiv.className = 'manques-list';
				
				// Créer la toolbar en passant la référence à manquesListDiv
				const toolbar = createToolbar(`editor_${idx}`, idx, manquesListDiv);

				editor.addEventListener('input', () => {
					updateCitationFromEditor(editor, idx);
					updateManquesListDisplay(manquesListDiv, idx);
				});

				contentGroup.appendChild(toolbar);
				contentGroup.appendChild(editor);
				citationDiv.appendChild(contentGroup);
				citationDiv.appendChild(manquesListDiv);
				
				// Initialiser l'affichage de la liste des mots manquants
				updateManquesListDisplay(manquesListDiv, idx);

				deleteBtn.addEventListener('click', () => deleteCitation(idx));
				citationsContainer.appendChild(citationDiv);
			});
		}

		function deleteCitation(idx) { citations.splice(idx, 1); renderCitations(); }
		function addNewCitation() {
			citations.push({ texte: '', source: '' });
			renderCitations();
			showAlert("Nouveau texte ajouté → sélectionner un mot et cliquer sur 'marquer comme manquant'", "success");
		}

		function createNewFile() {
			appTitleInput.value = 'textes à compléter';
			appSubtitleInput.value = 'réviser le cours';
			citations = [];
			citations.push({ 
				texte: 'Voici un **exemple** de texte avec un **mot manquant** à compléter.', 
				source: 'Source : <i>manuel de français</i>, 2026' 
			});
			renderCitations();
			showAlert('nouveau fichier créé → sélectionner un mot et utiliser le bouton vert pour le marquer comme manquant', 'success');
		}

		function parseJSFile(content) {
			try {
				const titleMatch = content.match(/const\s+title\s*=\s*["']([^"']*)["']/);
				if (titleMatch) appTitleInput.value = titleMatch[1];
				const subtitleMatch = content.match(/const\s+subtitle\s*=\s*["']([^"']*)["']/);
				if (subtitleMatch) appSubtitleInput.value = subtitleMatch[1];
				const tableauMatch = content.match(/const\s+textesAvecTrous\s*=\s*\[([\s\S]*?)\];/);
				if (!tableauMatch) throw new Error('Tableau textesAvecTrous non trouvé');

				const tableauContent = tableauMatch[1];
				const nouvellesCitations = [];
				let i = 0;
				while (i < tableauContent.length) {
					let debut = tableauContent.indexOf('{', i);
					if (debut === -1) break;
					let profondeur = 0, fin = debut, inString = false, stringChar = '';
					for (let j = debut; j < tableauContent.length; j++) {
						const c = tableauContent[j];
						if (!inString && (c === '"' || c === "'")) { inString = true; stringChar = c; }
						else if (inString && c === stringChar) { inString = false; }
						else if (!inString) {
							if (c === '{') profondeur++;
							if (c === '}') { profondeur--; if (profondeur === 0) { fin = j; break; } }
						}
					}
					if (fin > debut) {
						const objetStr = tableauContent.substring(debut, fin + 1);
						const texteMatch = objetStr.match(/texte\s*:\s*["']([\s\S]*?)(?<!\\)["']\s*,?/);
						const sourceMatch = objetStr.match(/source\s*:\s*["']([\s\S]*?)(?<!\\)["']\s*,?/);
						let texte = '', source = '';
						if (texteMatch) texte = texteMatch[1].replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\"/g, '"').replace(/\\'/g, "'");
						if (sourceMatch) source = sourceMatch[1].replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\"/g, '"').replace(/\\'/g, "'");
						nouvellesCitations.push({ texte, source });
						i = fin + 1;
					} else break;
				}
				if (nouvellesCitations.length === 0) throw new Error('Aucun texte trouvé');
				citations = nouvellesCitations;
				renderCitations();
				showAlert(`✅ fichier chargé ! ${citations.length} texte(s)`, 'success');
			} catch (error) {
				showAlert(`❌ Erreur : ${error.message}`, 'error');
			}
		}

		function loadSelectedFile() {
			if (jsFileInput.files.length === 0) { showAlert('sélectionner un fichier JS.', 'info'); return; }
			const file = jsFileInput.files[0];
			const reader = new FileReader();
			reader.onload = (e) => parseJSFile(e.target.result);
			reader.onerror = () => showAlert('Erreur de lecture.', 'error');
			reader.readAsText(file);
		}

		function encodeForExport(text) {
			if (!text) return '';
			return text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
		}

		function downloadJSFile() {
			const title = appTitleInput.value || 'textes à compléter';
			const subtitle = appSubtitleInput.value || 'réviser le cours';
			const validCitations = citations.filter(c => c.texte && c.texte.trim().length > 0);
			if (validCitations.length === 0) { showAlert('ajouter au moins un texte', 'error'); return; }

			let output = `// 1. TITRES DE L'APPLICATION\nconst title = "${encodeForExport(title)}";\nconst subtitle = "${encodeForExport(subtitle)}";\n\n// 2. CITATIONS AVEC MOTS MANQUANTS MARQUÉS PAR ** **\nconst textesAvecTrous = [\n`;
			validCitations.forEach((cit, idx) => {
				let texteRaw = cit.texte || '';
				let sourceRaw = cit.source || '';
				output += `\t{\n\t\ttexte: "${encodeForExport(texteRaw)}",\n\t\tsource: "${encodeForExport(sourceRaw)}"\n\t}`;
				if (idx < validCitations.length - 1) output += ',';
				output += '\n';
			});
			output += `];\n`;
			const blob = new Blob([output], { type: 'application/javascript' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a'); a.href = url; a.download = 'fichier_ressource.js';
			document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
			showAlert('✅ Fichier exporté avec les marqueurs ** ** (invisibles pour l\'utilisateur final).', 'success');
		}

		addCitationBtn.addEventListener('click', addNewCitation);
		newFileBtn.addEventListener('click', createNewFile);
		downloadBtn.addEventListener('click', downloadJSFile);
		jsFileInput.addEventListener('change', loadSelectedFile);
		
		createNewFile();
	</script>
</body>

</html>
