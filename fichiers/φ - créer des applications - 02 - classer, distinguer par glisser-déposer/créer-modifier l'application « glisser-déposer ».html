<!DOCTYPE html>

<!-- version 2025 -->
<!-- Exploitation à but strictement pédagogique et non lucratif -->
<html lang="fr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>créer / modifier application « glisser-déposer »</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.rel='stylesheet'">
    <link rel="icon" href="favicon.ico" />
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .entry, .title-inputs, .part-entry {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 800px;
        }
        .entry-container, .part-container {
            width: 100%;
        }
        .entry, .part-entry {
            padding: 0;
            border: none;
            box-shadow: none;
            background-color: transparent;
        }
        input {
            padding: 5px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background-color: #e0e0e0;
            box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            box-shadow: inset 1px 1px 3px #bebebe, inset -1px -1px 3px #ffffff;
        }
        button {
            padding: 10px;
            background-color: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        button:hover {
            background-color: #d0d0d0;
            box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
        }
        button:active {
            box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff;
        }
        .remove-button, .add-button, .open-button, .save-button, .add-part-button, .remove-part-button {
            width: 40px;
            height: 40px;
        }
        .remove-button .cross, .remove-part-button .cross {
            color: red;
            font-size: 24px;
            transform: translateY(-1px);
            font-style: normal;
        }
        .add-button .plus, .add-part-button .plus {
            font-size: 24px;
            transform: translateY(-1px);
            font-style: normal;
        }
        .open-button .open-icon {
            font-size: 24px;
            transform: translateY(-1px);
            font-style: normal;
        }
        .save-button .save-icon {
            font-size: 24px;
            transform: translateY(-1px);
            font-style: normal;
        }
        i.far, i.fas {
            font-style: normal !important;
        }
        h1 {
            color: red;
            text-align: center;
            text-shadow: 1px 1px 2px #bebebe, -1px -1px 2px #ffffff;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            width: 100%;
        }
        .title-inputs input {
            width: 100%;
        }
        #file-input {
            display: none;
        }
        .loading {
            display: none;
            color: #333;
            font-size: 16px;
            margin-top: 10px;
        }
        .part-container {
            margin-left: 20px;
            border-left: 2px solid #ccc;
            padding-left: 10px;
        }
        .part-examples {
            margin-top: 5px;
        }
        .button-container button i {
            color: #000;
        }
        .button-container button:hover i {
            color: #000;
        }
        .fa-folder-open::before { content: "📂"; font-style: normal; color: #000; }
        .fa-save::before { content: "💾"; font-style: normal; color: #000; }
        .fa-times::before { content: "✗"; color: #000; font-style: normal; }
        .fa-plus::before { content: "+"; font-style: normal; color: #000; }
        .tooltip {
            position: absolute;
            background-color: white;
            color: black;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            border: 1px solid #ccc;
        }
        button:hover .tooltip {
            opacity: 1;
        }
        button .tooltip {
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 5px;
        }
        @media (max-width: 768px) {
            .tooltip {
                font-size: 0.75rem;
                padding: 3px 6px;
            }
        }
        @media (max-width: 480px) {
            .tooltip {
                font-size: 0.65rem;
                padding: 2px 5px;
            }
            .entry, .part-entry {
                flex-direction: column;
                gap: 5px;
            }
            .remove-button, .add-button, .add-part-button, .remove-part-button {
                width: 100%;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <h1>créer / modifier application « glisser-déposer »</h1>
    <div class="title-inputs">
        <input type="text" id="app-title" placeholder="titre de l'application">
        <input type="text" id="app-subtitle" placeholder="sous-titre de l'application">
    </div>
    <div id="entries" class="entry-container">
        <div class="entry">
            <button onclick="removeEntry(this)" class="remove-button">
                <i class="far fa-times cross"></i>
                <span class="tooltip">supprimer cette catégorie</span>
            </button>
            <input type="text" placeholder="nom de la catégorie" class="category-name">
            <div class="part-container">
                <div class="part-entry">
                    <button onclick="removePart(this)" class="remove-part-button">
                        <i class="far fa-times cross"></i>
                        <span class="tooltip">supprimer cette sous-catégorie</span>
                    </button>
                    <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                    <button onclick="addPart(this)" class="add-part-button">
                        <i class="far fa-plus plus"></i>
                        <span class="tooltip">ajouter une sous-catégorie</span>
                    </button>
                </div>
            </div>
            <button onclick="addEntry()" class="add-button">
                <i class="far fa-plus plus"></i>
                <span class="tooltip">ajouter une nouvelle catégorie</span>
            </button>
        </div>
    </div>
    <div class="button-container">
        <button onclick="openFile()" class="open-button">
            <i class="fas fa-folder-open open-icon"></i>
            <span class="tooltip">ouvrir un fichier JavaScript</span>
        </button>
        <button onclick="saveData()" class="save-button">
            <i class="fas fa-save save-icon"></i>
            <span class="tooltip">sauvegarder les données</span>
        </button>
        <input type="file" id="file-input" accept=".js" style="display: none;" onchange="loadFile(event)">
    </div>
    <div id="loading" class="loading">Chargement...</div>
    <script>
        function addEntry() {
            const entriesDiv = document.getElementById('entries');
            const newEntry = document.createElement('div');
            newEntry.className = 'entry';
            newEntry.innerHTML = `
                <button onclick="removeEntry(this)" class="remove-button">
                    <i class="far fa-times cross"></i>
                    <span class="tooltip">supprimer cette catégorie</span>
                </button>
                <input type="text" placeholder="nom de la catégorie" class="category-name">
                <div class="part-container">
                    <div class="part-entry">
                        <button onclick="removePart(this)" class="remove-part-button">
                            <i class="far fa-times cross"></i>
                            <span class="tooltip">supprimer cette sous-catégorie</span>
                        </button>
                        <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                        <button onclick="addPart(this)" class="add-part-button">
                            <i class="far fa-plus plus"></i>
                            <span class="tooltip">ajouter une sous-catégorie</span>
                        </button>
                    </div>
                </div>
                <button onclick="addEntry()" class="add-button">
                    <i class="far fa-plus plus"></i>
                    <span class="tooltip">ajouter une nouvelle catégorie</span>
                </button>
            `;
            entriesDiv.appendChild(newEntry);
        }
        function removeEntry(button) {
            if (document.querySelectorAll('.entry').length > 1) {
                button.parentElement.remove();
            }
        }
        function addPart(button) {
            const partContainer = button.parentElement.parentElement;
            const newPart = document.createElement('div');
            newPart.className = 'part-entry';
            newPart.innerHTML = `
                <button onclick="removePart(this)" class="remove-part-button">
                    <i class="far fa-times cross"></i>
                    <span class="tooltip">supprimer cette sous-catégorie</span>
                </button>
                <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples">
                <button onclick="addPart(this)" class="add-part-button">
                    <i class="far fa-plus plus"></i>
                    <span class="tooltip">ajouter une sous-catégorie</span>
                </button>
            `;
            partContainer.appendChild(newPart);
        }
        function removePart(button) {
            const partContainer = button.parentElement.parentElement;
            if (partContainer.querySelectorAll('.part-entry').length > 1) {
                button.parentElement.remove();
            }
        }
        function saveData() {
            const title = document.getElementById('app-title').value.trim();
            const subtitle = document.getElementById('app-subtitle').value.trim();
            const entries = document.querySelectorAll('.entry');
            let jsContent = '';
            if (title) {
                jsContent += `const title = "${title}";\n`;
            }
            if (subtitle) {
                jsContent += `const subtitle = "${subtitle}";\n`;
            }
            jsContent += 'const reperes = [\n';
            entries.forEach((entry, index) => {
                const categoryName = entry.querySelector('.category-name').value.trim();
                const parts = entry.querySelectorAll('.part-entry');
                if (categoryName && parts.length >= 1) {
                    jsContent += ` {\n "definition": "${categoryName}",\n "parts": [\n`;
                    parts.forEach((part, partIndex) => {
                        const partExamples = part.querySelector('.part-examples').value.trim();
                        const examples = partExamples.split(',').map(ex => ex.trim()).filter(ex => ex);
                        if (examples.length > 0) {
                            jsContent += ` {\n "name": "${examples[0] || ''}",\n "examples": [\n`;
                            examples.forEach((ex, exIndex) => {
                                jsContent += ` "${ex}"`;
                                if (exIndex < examples.length - 1) {
                                    jsContent += ',';
                                }
                                jsContent += '\n';
                            });
                            jsContent += ` ]\n }`;
                            if (partIndex < parts.length - 1) {
                                jsContent += ',';
                            }
                            jsContent += '\n';
                        }
                    });
                    jsContent += ` ]\n }`;
                    if (index < entries.length - 1) {
                        jsContent += ',';
                    }
                    jsContent += '\n';
                }
            });
            jsContent += '];';
            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fichier_ressource.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        function openFile() {
            document.getElementById('file-input').click();
        }
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file || !file.name.endsWith('.js')) {
                alert('Veuillez sélectionner un fichier JavaScript (.js).');
                return;
            }
            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.style.display = 'block';
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const script = document.createElement('script');
                    script.textContent = e.target.result;
                    document.body.appendChild(script);
                    requestAnimationFrame(() => {
                        const entriesDiv = document.getElementById('entries');
                        entriesDiv.innerHTML = '';
                        document.getElementById('app-title').value = '';
                        document.getElementById('app-subtitle').value = '';
                        if (typeof title !== 'undefined') {
                            document.getElementById('app-title').value = title;
                        }
                        if (typeof subtitle !== 'undefined') {
                            document.getElementById('app-subtitle').value = subtitle;
                        }
                        if (typeof reperes !== 'undefined' && Array.isArray(reperes)) {
                            reperes.forEach(rep => {
                                const newEntry = document.createElement('div');
                                newEntry.className = 'entry';
                                let partsHtml = '';
                                if (rep.parts && Array.isArray(rep.parts)) {
                                    rep.parts.forEach(part => {
                                        const examples = part.examples && Array.isArray(part.examples) ? part.examples.join(', ') : '';
                                        partsHtml += `
                                            <div class="part-entry">
                                                <button onclick="removePart(this)" class="remove-part-button">
                                                    <i class="far fa-times cross"></i>
                                                    <span class="tooltip">supprimer cette sous-catégorie</span>
                                                </button>
                                                <input type="text" placeholder="éléments de la sous-catégorie (séparés par des virgules)" class="part-examples" value="${examples}">
                                                <button onclick="addPart(this)" class="add-part-button">
                                                    <i class="far fa-plus plus"></i>
                                                    <span class="tooltip">ajouter une sous-catégorie</span>
                                                </button>
                                            </div>
                                        `;
                                    });
                                }
                                newEntry.innerHTML = `
                                    <button onclick="removeEntry(this)" class="remove-button">
                                        <i class="far fa-times cross"></i>
                                        <span class="tooltip">supprimer cette catégorie</span>
                                    </button>
                                    <input type="text" placeholder="nom de la catégorie" class="category-name" value="${rep.definition || ''}">
                                    <div class="part-container">
                                        ${partsHtml}
                                    </div>
                                    <button onclick="addEntry()" class="add-button">
                                        <i class="far fa-plus plus"></i>
                                        <span class="tooltip">ajouter une nouvelle catégorie</span>
                                    </button>
                                `;
                                entriesDiv.appendChild(newEntry);
                            });
                        }
                        document.body.removeChild(script);
                        loadingIndicator.style.display = 'none';
                    });
                } catch (err) {
                    loadingIndicator.style.display = 'none';
                    alert('Erreur lors du chargement du fichier : ' + err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
