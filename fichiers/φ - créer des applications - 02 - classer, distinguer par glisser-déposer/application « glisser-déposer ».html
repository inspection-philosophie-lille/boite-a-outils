<html lang="fr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" />
    <title id="htmlTitle"></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e0e0e0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            touch-action: manipulation;
        }
        header {
            margin-bottom: 15px;
        }
        h1 {
            color: red;
            font-size: 1.8em;
            margin-bottom: 8px;
            text-transform: lowercase;
        }
        .subtitle {
            margin: 0;
            color: #555;
            font-size: clamp(1rem, 3vw, 1.2rem);
            text-transform: lowercase;
        }
        .score-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
        }
        .score {
            font-size: 1em;
            background-color: #d1d1d1;
            border-radius: 8px;
            padding: 8px 15px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.2),
                        -6px -6px 12px rgba(255, 255, 255, 0.7);
            position: relative;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            flex-grow: 1;
            justify-content: flex-start;
        }
        .row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
            flex-wrap: wrap;
            gap: 10px;
        }
        .dropzone {
            flex: 1 1 45%;
            max-width: 500px;
            min-width: 200px;
            border-radius: 15px;
            background-color: #f0f0f0;
            margin: 5px;
            padding: 10px;
            border: 2px dashed #ccc;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.2),
                        -6px -6px 12px rgba(255, 255, 255, 0.9);
        }
        .draggable {
            padding: 8px;
            margin: 5px 0;
            border-radius: 10px;
            background-color: #d1d1d1;
            color: black;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2),
                        -4px -4px 8px rgba(255, 255, 255, 0.4);
            font-size: 1em;
            touch-action: none;
        }
        .button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background-color: #d1d1d1;
            color: black;
            cursor: pointer;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2),
                        -4px -4px 8px rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            font-size: 1em;
            min-width: 80px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .button:hover {
            box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.3),
                        inset -4px -4px 10px rgba(255, 255, 255, 0.5);
        }
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .correct {
            background-color: #28a745 !important;
            box-shadow: none;
        }
        .incorrect {
            background-color: #dc3545 !important;
            box-shadow: none;
        }
        .hide {
            display: none;
        }
        .drag-over {
            border: 2px solid #666;
        }
        .refresh-symbol {
            color: red;
            font-size: 1.8em;
            line-height: 0.8;
            display: inline-block;
            transform: translateY(-2px);
        }
        .button:hover:after,
        .score:hover:after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            white-space: nowrap;
            z-index: 10;
            margin-bottom: 8px;
            border: 1px solid #ccc;
        }
        .button:hover:before,
        .score:hover:before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-bottom-color: #fff;
            z-index: 10;
            margin-bottom: 2px;
        }
        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }
            .dropzone {
                width: 90%;
                max-width: 100%;
                margin: 5px auto;
                padding: 8px;
            }
            .score-button-container {
                width: 90%;
                max-width: 100%;
                margin: 0 auto 15px;
                padding: 0;
                flex-direction: column;
                gap: 10px;
            }
            .score, .button {
                width: 100%;
                box-sizing: border-box;
                font-size: 0.9em;
            }
            h1 {
                font-size: 1.4em;
            }
            .subtitle {
                font-size: 0.9em;
            }
            .draggable {
                font-size: 0.9em;
                padding: 6px;
            }
        }
        @media (max-width: 400px) {
            h1 {
                font-size: 1.2em;
            }
            .subtitle {
                font-size: 0.8em;
            }
            .score, .button {
                font-size: 0.8em;
                padding: 6px 10px;
            }
            .draggable {
                font-size: 0.8em;
                padding: 5px;
            }
        }
        @media (min-width: 601px) {
            .dropzone {
                margin: 5px 10px;
            }
            .row {
                max-width: 100%;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="appTitle"></h1>
        <p id="appSubtitle" class="subtitle"></p>
    </header>
    <main class="container">
        <div class="row" id="reperesContainer"></div>
        <div class="score-button-container">
            <button id="checkButton" class="button" disabled data-tooltip="vérifier les réponses ou passer à la question suivante">vérifier</button>
            <div class="score" id="score" data-tooltip="score actuel : bonnes réponses / total">
                <span id="correctCount">0</span> / <span id="totalCount">0</span>
            </div>
        </div>
    </main>
    <script src="fichier_ressource.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Mettre à jour le titre, l'onglet et le sous-titre depuis fichier_ressource.js
            document.title = title;
            document.getElementById("appTitle").textContent = title;
            document.getElementById("appSubtitle").textContent = subtitle;
            const reperesContainer = document.getElementById("reperesContainer");
            let correctCount = 0;
            let totalCount = 0;
            let selectedRepere = null;
            let dropzone1, dropzone2;
            let allExamples = [];
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
            function dragStart(e) {
                e.dataTransfer.setData('text/plain', e.target.id);
                setTimeout(() => {
                    e.target.classList.add('hide');
                }, 0);
            }
            function dragEnter(e) {
                e.preventDefault();
                e.target.classList.add('drag-over');
            }
            function dragOver(e) {
                e.preventDefault();
                e.target.classList.add('drag-over');
            }
            function dragLeave(e) {
                e.target.classList.remove('drag-over');
            }
            function drop(e) {
                e.preventDefault();
                e.target.classList.remove('drag-over');
                const id = e.dataTransfer.getData('text/plain');
                const draggable = document.getElementById(id);
                if (e.target.classList.contains('dropzone')) {
                    e.target.appendChild(draggable);
                } else if (e.target.parentNode.classList.contains('dropzone')) {
                    e.target.parentNode.appendChild(draggable);
                }
                draggable.classList.remove('hide');
                checkAllPlaced();
            }
            function toggleHandler(e) {
                e.preventDefault();
                const draggable = e.target.closest('.draggable');
                if (!draggable) return;
                const currentDropzone = draggable.parentNode;
                const targetDropzone = currentDropzone === dropzone1 ? dropzone2 : dropzone1;
                targetDropzone.appendChild(draggable);
                draggable.classList.remove('hide');
                checkAllPlaced();
            }
            function checkAllPlaced() {
                const allDraggables = document.querySelectorAll('.draggable');
                const allInDropzone = Array.from(allDraggables).every(d => d.parentNode.classList.contains('dropzone'));
                const checkButton = document.getElementById("checkButton");
                if (allInDropzone && allDraggables.length > 0) {
                    checkButton.disabled = false;
                } else {
                    checkButton.disabled = true;
                }
            }
            function getNewWords() {
                const randomIndex = Math.floor(Math.random() * reperes.length);
                selectedRepere = reperes[randomIndex];
                const [category1, category2] = selectedRepere.definition.split('/');
                dropzone1.innerHTML = `<strong>déposer ici les exemples de la<br>${category1.trim()}</strong>`;
                dropzone2.innerHTML = `<strong>déposer ici les exemples de la<br>${category2.trim()}</strong>`;
                allExamples = [...selectedRepere.parts[0].examples, ...selectedRepere.parts[1].examples];
                shuffleArray(allExamples);
                totalCount = allExamples.length;
                document.getElementById('totalCount').textContent = totalCount;
                populateDropzones(allExamples);
                document.getElementById("checkButton").disabled = true;
            }
            function populateDropzones(allExamples) {
                const [category1, category2] = selectedRepere.definition.split('/');
                dropzone1.innerHTML = `<strong>déposer ici les exemples de la<br>${category1.trim()}</strong>`;
                dropzone2.innerHTML = `<strong>déposer ici les exemples de la<br>${category2.trim()}</strong>`;
                allExamples.forEach((definition, index) => {
                    const defDiv = document.createElement("div");
                    defDiv.classList.add("draggable");
                    defDiv.textContent = definition;
                    defDiv.id = `draggable-${index}`;
                    defDiv.addEventListener('dragend', () => defDiv.classList.remove('hide'));
                    if (!isTouchDevice) {
                        defDiv.setAttribute("draggable", "true");
                        defDiv.addEventListener('dragstart', dragStart);
                        defDiv.addEventListener('click', toggleHandler);
                    } else {
                        defDiv.addEventListener('touchend', toggleHandler);
                    }
                    if (index < allExamples.length / 2) {
                        dropzone1.appendChild(defDiv);
                    } else {
                        dropzone2.appendChild(defDiv);
                    }
                });
            }
            function createDropzone() {
                const dropzone = document.createElement("div");
                dropzone.classList.add("dropzone");
                if (!isTouchDevice) {
                    dropzone.addEventListener('dragenter', dragEnter);
                    dropzone.addEventListener('dragover', dragOver);
                    dropzone.addEventListener('dragleave', dragLeave);
                    dropzone.addEventListener('drop', drop);
                }
                return dropzone;
            }
            dropzone1 = createDropzone();
            dropzone2 = createDropzone();
            const row = document.createElement("div");
            row.classList.add("row");
            row.appendChild(dropzone1);
            row.appendChild(dropzone2);
            reperesContainer.appendChild(row);
            getNewWords();
            const checkButton = document.getElementById("checkButton");
            checkButton.addEventListener('click', () => {
                if (checkButton.textContent === "vérifier") {
                    const draggableElements1 = dropzone1.querySelectorAll('.draggable');
                    const draggableElements2 = dropzone2.querySelectorAll('.draggable');
                    draggableElements1.forEach(el => el.classList.remove("correct", "incorrect"));
                    draggableElements2.forEach(el => el.classList.remove("correct", "incorrect"));
                    correctCount = 0;
                    draggableElements1.forEach((exampleDiv) => {
                        if (selectedRepere.parts[0].examples.includes(exampleDiv.textContent)) {
                            exampleDiv.classList.add("correct");
                            correctCount++;
                        } else {
                            exampleDiv.classList.add("incorrect");
                        }
                    });
                    draggableElements2.forEach((exampleDiv) => {
                        if (selectedRepere.parts[1].examples.includes(exampleDiv.textContent)) {
                            exampleDiv.classList.add("correct");
                            correctCount++;
                        } else {
                            exampleDiv.classList.add("incorrect");
                        }
                    });
                    document.getElementById('correctCount').textContent = correctCount;
                    checkButton.textContent = "corriger";
                    checkButton.setAttribute("data-tooltip", "corriger les erreurs");
                } else if (checkButton.textContent === "corriger") {
                    moveIncorrectLabels(dropzone1, selectedRepere.parts[1].examples, dropzone2);
                    moveIncorrectLabels(dropzone2, selectedRepere.parts[0].examples, dropzone1);
                    checkButton.innerHTML = '<span class="refresh-symbol">↻</span>';
                    checkButton.setAttribute("data-tooltip", "passer à la question suivante");
                } else if (checkButton.querySelector('.refresh-symbol')) {
                    dropzone1.querySelectorAll('.draggable').forEach(el => el.classList.remove("correct", "incorrect"));
                    dropzone2.querySelectorAll('.draggable').forEach(el => el.classList.remove("correct", "incorrect"));
                    document.getElementById('correctCount').textContent = correctCount;
                    checkButton.textContent = "vérifier";
                    checkButton.setAttribute("data-tooltip", "vérifier les réponses");
                    getNewWords();
                }
            });
            function moveIncorrectLabels(sourceDropzone, correctExamples, targetDropzone) {
                const draggableElements = sourceDropzone.querySelectorAll('.draggable');
                draggableElements.forEach((exampleDiv) => {
                    if (exampleDiv.classList.contains("incorrect")) {
                        const targetIndex = correctExamples.indexOf(exampleDiv.textContent);
                        if (targetIndex !== -1) {
                            const rect = exampleDiv.getBoundingClientRect();
                            const targetRect = targetDropzone.getBoundingClientRect();
                            const deltaX = targetRect.left - rect.left;
                            const deltaY = targetRect.top - rect.top + (targetIndex * (rect.height + 5));
                            exampleDiv.style.transition = "transform 2s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 2s cubic-bezier(0.25, 0.1, 0.25, 1)";
                            exampleDiv.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                            exampleDiv.style.opacity = 0.5;
                            setTimeout(() => {
                                targetDropzone.appendChild(exampleDiv);
                                exampleDiv.style.transition = "";
                                exampleDiv.style.transform = "";
                                exampleDiv.style.opacity = 1;
                                exampleDiv.classList.remove("incorrect");
                                exampleDiv.classList.add("correct");
                            }, 2000);
                        }
                    }
                });
            }
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
        });
    </script>
</body>
</html>
