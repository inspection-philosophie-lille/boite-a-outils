<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <style>

</head>
<body>
    <h1>créer / modifier une application «&nbsp;apparier&nbsp;»</h1>
    <div class="title-inputs">
        <input type="text" id="app-title" placeholder="titre de l'application">
        <input type="text" id="app-subtitle" placeholder="sous-titre de l'application">
    </div>
    <div id="entries" class="entry-container">
        <div class="entry">
            <button onclick="removeEntry(this)" class="remove-button">
                <i class="far fa-times cross"></i>
                <span class="tooltip">Supprimer cette entrée</span>
            </button>
            <input type="text" placeholder="colonne de gauche" class="left">
            <input type="text" placeholder="colonne de droite" class="right">
            <button onclick="addEntry()" class="add-button">
                <i class="far fa-plus plus"></i>
                <span class="tooltip">Ajouter une nouvelle entrée</span>
            </button>
        </div>
    </div>
    <div class="button-container">
        <button onclick="openFile()" class="open-button">
            <i class="fas fa-folder-open open-icon"></i>
            <span class="tooltip">Ouvrir un fichier JavaScript</span>
        </button>
        <button onclick="saveTitle()" class="title-button" style="width: 40px;">
            <i class="fas fa-save title-icon"></i>
            <span class="tooltip">Sauvegarder les données</span>
        </button>
        <input type="file" id="file-input" accept=".js" style="display: none;" onchange="loadFile(event)">
    </div>
    <div id="loading" class="loading">Chargement...</div>
    <script>
        function addEntry() {
            const entriesDiv = document.getElementById('entries');
            const newEntry = document.createElement('div');
            newEntry.className = 'entry';
            newEntry.innerHTML = `
                <button onclick="removeEntry(this)" class="remove-button">
                    <i class="far fa-times cross"></i>
                    <span class="tooltip">Supprimer cette entrée</span>
                </button>
                <input type="text" placeholder="colonne de gauche" class="left">
                <input type="text" placeholder="colonne de droite" class="right">
                <button onclick="addEntry()" class="add-button">
                    <i class="far fa-plus plus"></i>
                    <span class="tooltip">Ajouter une nouvelle entrée</span>
                </button>
            `;
            entriesDiv.appendChild(newEntry);
        }

        function removeEntry(button) {
            if (document.querySelectorAll('.entry').length > 1) {
                button.parentElement.remove();
            }
        }

        function saveTitle() {
            const title = document.getElementById('app-title').value.trim();
            const subtitle = document.getElementById('app-subtitle').value.trim();
            const entries = document.querySelectorAll('.entry');
            let jsContent = '';

            if (title) {
                jsContent += `const title = "${title}";\n`;
            }
            if (subtitle) {
                jsContent += `const subtitle = "${subtitle}";\n`;
            }

            jsContent += 'const argumentsData = [\n';
            entries.forEach((entry, index) => {
                const left = entry.querySelector('.left').value.trim();
                const right = entry.querySelector('.right').value.trim();

                if (left && right) {
                    jsContent += `    { colonne_de_gauche: "${left}", colonne_de_droite: "${right}" }`;
                    if (index < entries.length - 1) {
                        jsContent += ',';
                    }
                    jsContent += '\n';
                }
            });
            jsContent += '];';

            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fichier_ressource.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openFile() {
            document.getElementById('file-input').click();
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file || !file.name.endsWith('.js')) {
                alert('Veuillez sélectionner un fichier JavaScript (.js).');
                return;
            }

            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const script = document.createElement('script');
                    script.textContent = e.target.result;
                    document.body.appendChild(script);

                    requestAnimationFrame(() => {
                        const entriesDiv = document.getElementById('entries');
                        entriesDiv.innerHTML = '';
                        document.getElementById('app-title').value = '';
                        document.getElementById('app-subtitle').value = '';

                        if (typeof title !== 'undefined') {
                            document.getElementById('app-title').value = title;
                        }
                        if (typeof subtitle !== 'undefined') {
                            document.getElementById('app-subtitle').value = subtitle;
                        }

                        if (typeof argumentsData !== 'undefined' && Array.isArray(argumentsData)) {
                            argumentsData.forEach(data => {
                                const newEntry = document.createElement('div');
                                newEntry.className = 'entry';
                                newEntry.innerHTML = `
                                    <button onclick="removeEntry(this)" class="remove-button">
                                        <i class="far fa-times cross"></i>
                                        <span class="tooltip">Supprimer cette entrée</span>
                                    </button>
                                    <input type="text" placeholder="colonne de gauche" class="left" value="${data.colonne_de_gauche || ''}">
                                    <input type="text" placeholder="colonne de droite" class="right" value="${data.colonne_de_droite || ''}">
                                    <button onclick="addEntry()" class="add-button">
                                        <i class="far fa-plus plus"></i>
                                        <span class="tooltip">Ajouter une nouvelle entrée</span>
                                    </button>
                                `;
                                entriesDiv.appendChild(newEntry);
                            });
                        }

                        document.body.removeChild(script);
                        loadingIndicator.style.display = 'none';
                    });
                } catch (err) {
                    loadingIndicator.style.display = 'none';
                    alert('Erreur lors du chargement du fichier : ' + err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
