<body>
    <div class="container">

    <!-- Modal pour ajouter/modifier un texte -->
    <div id="textModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un texte</h2>

                        <option value="">Sélectionner un auteur existant</option>

                </div>
                <div class="form-group">

                    <input type="text" id="nouvelAuteur" placeholder="Entrez le nom en MAJUSCULES (ex: PLATON)">
                </div>
                <div class="form-group">
                    <label for="contenu">Contenu du texte</label>
                    <textarea id="contenu" required placeholder="[1] Première phrase... [2] Deuxième phrase..."></textarea>
                    <div class="helper-text">✓ [1], [2]... pour numéroter • ✓ "guillemets" deviennent « français »</div>
                </div>
                <div class="form-group">
                    <label for="origine">Origine</label>
                    <input type="text" id="origine" required placeholder="Titre, Éditeur, année, page">
                </div>
                <div class="form-group">
                    <label for="theme">Thème</label>
                    <input type="text" id="theme" required placeholder="Ex: La liberté, Le travail...">
                </div>
                <div class="form-group">
                    <label for="these">Thèse</label>
                    <textarea id="these" required placeholder="La thèse principale du texte..."></textarea>
                </div>
                <div class="form-group">
                    <label for="interet">Intérêt philosophique</label>
                    <textarea id="interet" required placeholder="L'intérêt du texte..."></textarea>
                </div>

                    <label for="problematique">Problématique</label>
                    <input type="text" id="problematique" required placeholder="La question posée...">

    <!-- Modal pour l'export -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Exporter textes.js</h2>
                <span class="close" onclick="closeExportModal()">&times;</span>
            </div>
            <pre id="exportContent" class="export-area"></pre>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-primary" onclick="copyToClipboard()">📋 Copier</button>
                <button class="btn btn-success" onclick="downloadTextes()">💾 Télécharger</button>
            </div>

    <script>
        // Données initiales
        let textes = [];

        // Variable pour suivre l'auteur filtré
        let currentFilter = null;

        // Chargement initial
        document.addEventListener('DOMContentLoaded', function() {
            loadTextes();
            updateUI();
        });

        function loadTextes() {
            const saved = localStorage.getItem('philosophicalTexts');
            if (saved) {
                try {
                    textes = JSON.parse(saved);
                } catch (e) {
                    console.error('Erreur de parsing des données sauvegardées', e);
                    textes = [];
                }
            }
        }

        function saveTextes() {
            localStorage.setItem('philosophicalTexts', JSON.stringify(textes));
            showMessage('✓ Données sauvegardées', 'success');
        }

        function showMessage(msg, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="${type}">${msg}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 3000);
        }

// xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

function extractNomFamille(origine) {
    // Étape 1: Extraire la partie avant la première virgule ou parenthèse
    let nomPart = origine.split(',')[0].split('(')[0].trim();
    
    // Étape 2: Remplacer l'apostrophe par un espace POUR LA DÉTECTION
    let nomPourDetection = nomPart.replace(/'/g, ' ');
    
    // Étape 3: Séparer tous les mots
    const tousLesMots = nomPourDetection.split(/\s+/).filter(mot => mot.length > 0);
    
    // Étape 4: Identifier les mots en majuscules ET les apostrophes
    const resultat = [];
    let sauterProchain = false;
    
    for (let i = 0; i < tousLesMots.length; i++) {
        if (sauterProchain) {
            sauterProchain = false;
            continue;
        }
        
        let mot = tousLesMots[i];
        
        // Vérifier si ce mot et le suivant sont collés par une apostrophe
        if (i < tousLesMots.length - 1) {
            let motSuivant = tousLesMots[i + 1];
            let recherche = mot + "'" + motSuivant;
            
            if (nomPart.includes(recherche)) {
                // On a trouvé une apostrophe
                let motSuivantSansTirets = motSuivant.replace(/-/g, '');
                
                // Vérifier si le mot suivant est en majuscules
                if (motSuivantSansTirets.length > 0 && motSuivantSansTirets === motSuivantSansTirets.toUpperCase()) {
                    
                    // CAS 1: Si le premier mot est "D" (majuscule), on garde l'apostrophe
                    if (mot === "D") {
                        resultat.push(mot + "'" + motSuivant);
                        sauterProchain = true;
                        continue;
                    }
                    // CAS 2: Si le premier mot est "d" (minuscule), on NE GARDE PAS l'apostrophe
                    else if (mot === "d") {
                        // On ne garde que le mot suivant
                        resultat.push(motSuivant);
                        sauterProchain = true;
                        continue;
                    }
                }
            }
        }
        
        // Sinon, vérifier si ce mot seul est en majuscules
        let motSansTirets = mot.replace(/-/g, '');
        if (motSansTirets.length > 0 && motSansTirets === motSansTirets.toUpperCase()) {
            resultat.push(mot);
        }
    }
    
    // Étape 5: Retourner le résultat en majuscules
    if (resultat.length > 0) {
        return resultat.join(' ').toUpperCase();
    }
    
    // Étape 6: Si aucun mot en majuscules, prendre le dernier mot
    return tousLesMots[tousLesMots.length - 1].toUpperCase();
}

        function getUniqueAuteurs() {
            const auteurs = new Set();
            textes.forEach(texte => {
                const nomFamille = extractNomFamille(texte.reponses.origine);
                auteurs.add(nomFamille);
            });
            
            // Tri en ignorant les accents et la casse
            return Array.from(auteurs).sort((a, b) => {
                return a.localeCompare(b, 'fr', { sensitivity: 'base' });
            });
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const totalTextes = textes.length;
            const totalAuteurs = getUniqueAuteurs().length;
            
            statsDiv.innerHTML = totalTextes > 0 ? `
                <div class="stat-item">📚 ${totalTextes} texte${totalTextes > 1 ? 's' : ''}</div>
                <div class="stat-item">✍️ ${totalAuteurs} auteur${totalAuteurs > 1 ? 's' : ''}</div>
            ` : '';
        }

        function updateUI() {
            updateAuthorsFilter();
            displayTexts();
            updateAuteurSelect();
            updateStats();
        }

        function updateAuthorsFilter() {
            const auteurs = getUniqueAuteurs();
            const filterDiv = document.getElementById('authorsFilter');
            
            let html = '<span style="font-weight:600; margin-right:10px;">Filtres:</span>';
            html += '<span class="filter-badge ' + (currentFilter === null ? 'active' : '') + '" onclick="setFilter(null)">Tous</span>';
            
            auteurs.forEach(auteur => {
                html += `<span class="filter-badge ${currentFilter === auteur ? 'active' : ''}" onclick="setFilter('${auteur.replace(/'/g, "\\'")}')">${auteur}</span>`;
            });
            
            filterDiv.innerHTML = html;
        }

        function setFilter(auteur) {
            currentFilter = auteur;
            updateAuthorsFilter();
            displayTexts();
        }

        function displayTexts() {
            const container = document.getElementById('textsContainer');
            let filteredTexts = textes;

            if (filteredTexts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📖</div>
                        <p>Aucun texte pour le moment</p>
                        <p style="font-size: 0.9em;">Cliquez sur "Nouveau texte" pour commencer</p>
                    </div>
                `;
                return;
            }

            // Appliquer le filtre par auteur
            if (currentFilter) {
                filteredTexts = filteredTexts.filter(texte => {
                    const nomFamille = extractNomFamille(texte.reponses.origine);
                    return nomFamille === currentFilter;
                });
            }

            // Appliquer la recherche
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (searchTerm) {
                filteredTexts = filteredTexts.filter(texte => 
                    texte.reponses.origine.toLowerCase().includes(searchTerm) ||
                    texte.reponses.theme.toLowerCase().includes(searchTerm) ||
                    texte.reponses.these.toLowerCase().includes(searchTerm) ||
                    texte.reponses.interet.toLowerCase().includes(searchTerm) ||
                    texte.reponses.problematique.toLowerCase().includes(searchTerm) ||
                    texte.contenu.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredTexts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>Aucun texte trouvé</p>
                        <p style="font-size: 0.9em;">Essayez d'autres termes de recherche</p>
                    </div>
                `;
                return;
            }

            // Grouper par auteur
            const textsByAuteur = {};
            filteredTexts.forEach(texte => {
                const nomFamille = extractNomFamille(texte.reponses.origine);
                if (!textsByAuteur[nomFamille]) {
                    textsByAuteur[nomFamille] = [];
                }
                textsByAuteur[nomFamille].push(texte);
            });

            let html = '';
            
            // Tri des clés en ignorant les accents et la casse
            Object.keys(textsByAuteur).sort((a, b) => {
                return a.localeCompare(b, 'fr', { sensitivity: 'base' });
            }).forEach(nomFamille => {
                html += `<div class="auteur-section">`;
                html += `<div class="auteur-title">${nomFamille} (${textsByAuteur[nomFamille].length})</div>`;
                
                textsByAuteur[nomFamille].forEach(texte => {
                    html += `
                        <div class="text-card">
                            <div class="text-header">
                                <h3><span class="text-id">texte n°${texte.id}</span></h3>
                                <div class="text-actions">
                                    <button class="btn btn-warning btn-small" onclick="editText(${texte.id})">✏️</button>
                                    <button class="btn btn-danger btn-small" onclick="deleteText(${texte.id})">🗑️</button>
                                </div>
                            </div>
                            <div class="text-content">${texte.contenu}</div>
                            <div class="text-meta">
                                <div class="meta-paragraph">
                                    <span class="meta-label">Origine :</span> ${texte.reponses.origine}
                                </div>
                                <div class="meta-paragraph">
                                    <span class="meta-label">Thème :</span> ${texte.reponses.theme}
                                </div>
                                <div class="meta-paragraph">
                                    <span class="meta-label">Thèse :</span> ${texte.reponses.these}
                                </div>
                                <div class="meta-paragraph">
                                    <span class="meta-label">Intérêt :</span> ${texte.reponses.interet}
                                </div>
                                <div class="meta-paragraph">
                                    <span class="meta-label">Problématique :</span> ${texte.reponses.problematique}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function updateAuteurSelect() {
            const select = document.getElementById('auteur');
            const auteurs = getUniqueAuteurs();
            
            let options = '<option value="">Sélectionner un auteur existant</option>';
            auteurs.forEach(auteur => {
                options += `<option value="${auteur.replace(/"/g, '&quot;')}">${auteur}</option>`;
            });
            
            select.innerHTML = options;
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Ajouter un texte';
            document.getElementById('textForm').reset();
            document.getElementById('textId').value = '';
            document.getElementById('textModal').style.display = 'block';
            document.getElementById('contenu').focus();
        }

        function closeModal() {
            document.getElementById('textModal').style.display = 'none';
        }

        function editText(id) {
            const texte = textes.find(t => t.id === id);
            if (!texte) return;

            document.getElementById('modalTitle').textContent = 'Modifier le texte';
            document.getElementById('textId').value = id;
            
            const nomFamille = extractNomFamille(texte.reponses.origine);
            document.getElementById('auteur').value = nomFamille;
            
            let contenuModifiable = texte.contenu
                .replace(/<span class="phrase-num">\[(\d+)\]<\/span>/g, '[$1]')
                .replace(/«/g, '"')
                .replace(/»/g, '"');
            
            document.getElementById('contenu').value = contenuModifiable;
            document.getElementById('origine').value = texte.reponses.origine;
            document.getElementById('theme').value = texte.reponses.theme;
            document.getElementById('these').value = texte.reponses.these;
            document.getElementById('interet').value = texte.reponses.interet;
            document.getElementById('problematique').value = texte.reponses.problematique;
            
            document.getElementById('textModal').style.display = 'block';
            document.getElementById('contenu').focus();
        }

        function deleteText(id) {
            if (confirm('Supprimer ce texte ?')) {
                textes = textes.filter(t => t.id !== id);
                saveTextes();
                updateUI();
            }
        }

        function convertBracketsToSpans(texte) {
            return texte.replace(/\[(\d+)\]/g, '<span class="phrase-num">[$1]</span>');
        }

        function convertQuotesToFrench(texte) {
            let result = '';
            let inQuote = false;
            
            for (let i = 0; i < texte.length; i++) {
                if (texte[i] === '"') {
                    if (inQuote) {
                        result += '»';
                        inQuote = false;
                    } else {
                        result += '«';
                        inQuote = true;
                    }
                } else {
                    result += texte[i];
                }
            }
            
            return result;
        }

        document.getElementById('textForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const auteurSelect = document.getElementById('auteur').value;
            const nouvelAuteur = document.getElementById('nouvelAuteur').value.trim();
            
            let auteur = '';
            if (nouvelAuteur) {
                auteur = nouvelAuteur.toUpperCase();
            } else if (auteurSelect) {
                auteur = auteurSelect;
            } else {
                alert('Veuillez sélectionner ou saisir un auteur');
                return;
            }

            const id = document.getElementById('textId').value;
            let contenu = document.getElementById('contenu').value.trim();
            
            if (!contenu) {
                alert('Le contenu ne peut pas être vide');
                return;
            }
            
            contenu = contenu.replace(/\s+/g, ' ');
            contenu = convertQuotesToFrench(contenu);
            contenu = convertBracketsToSpans(contenu);
            
            let origine = document.getElementById('origine').value.trim();
            if (!origine.startsWith(auteur)) {
                origine = auteur + ', ' + origine;
            }

            const textData = {
                id: id ? parseInt(id) : Math.max(...textes.map(t => t.id), 0) + 1,
                contenu: contenu,
                reponses: {
                    origine: origine,
                    theme: document.getElementById('theme').value.trim(),
                    these: document.getElementById('these').value.trim(),
                    interet: document.getElementById('interet').value.trim(),
                    problematique: document.getElementById('problematique').value.trim()
                }
            };

            if (id) {
                const index = textes.findIndex(t => t.id === parseInt(id));
                if (index !== -1) {
                    textes[index] = textData;
                }
            } else {
                textes.push(textData);
            }

            saveTextes();
            updateUI();
            closeModal();
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            displayTexts();
        });

        function showExport() {
            const exportContent = document.getElementById('exportContent');
            exportContent.textContent = generateTextesJS();
            document.getElementById('exportModal').style.display = 'block';
        }

        function closeExportModal() {
            document.getElementById('exportModal').style.display = 'none';
        }

        function generateTextesJS() {
            let output = 'const textes = [\n';
            
            const textsByAuteur = {};
            textes.forEach(texte => {
                const match = texte.reponses.origine.match(/^([^,<]+)/);
                const auteur = match ? match[1].trim() : 'Auteur inconnu';
                if (!textsByAuteur[auteur]) {
                    textsByAuteur[auteur] = [];
                }
                textsByAuteur[auteur].push(texte);
            });

            Object.keys(textsByAuteur).sort().forEach(auteur => {
                output += `\n\t// ${auteur}\n`;
                
                textsByAuteur[auteur].forEach(texte => {
                    output += `\t{\n`;
                    output += `\t\tid: ${texte.id},\n`;
                    
                    const contenuEchappe = texte.contenu.replace(/`/g, '\\`');
                    output += `\t\tcontenu: \`${contenuEchappe}\`,\n`;
                    
                    output += `\t\treponses: {\n`;
                    output += `\t\t\torigine: "${texte.reponses.origine.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\ttheme: "${texte.reponses.theme.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tthese: "${texte.reponses.these.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tinteret: "${texte.reponses.interet.replace(/"/g, '\\"')}",\n`;
                    output += `\t\t\tproblematique: "${texte.reponses.problematique.replace(/"/g, '\\"')}"\n`;
                    output += `\t\t}\n`;
                    output += `\t},\n`;
                });
            });

            output += '];';
            return output;
        }

        function copyToClipboard() {
            const content = document.getElementById('exportContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('✓ Copié !');
            });
        }

        function downloadTextes() {
            const content = generateTextesJS();
            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'textes.js';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    
                    const extractTextes = new Function(`
                        ${content}
                        return textes;
                    `);
                    
                    const imported = extractTextes();
                    
                    if (Array.isArray(imported)) {
                        let validCount = 0;
                        let invalidItems = [];
                        
                        imported.forEach((item, index) => {
                            if (item && 
                                typeof item.id === 'number' &&
                                typeof item.contenu === 'string' &&
                                item.reponses &&
                                typeof item.reponses.origine === 'string' &&
                                typeof item.reponses.theme === 'string' &&
                                typeof item.reponses.these === 'string' &&
                                typeof item.reponses.interet === 'string' &&
                                typeof item.reponses.problematique === 'string') {
                                validCount++;
                            } else {
                                invalidItems.push(index + 1);
                            }
                        });

                        if (invalidItems.length > 0) {
                            if (!confirm(`${invalidItems.length} élément(s) invalide(s). Importer les valides ?`)) {
                                document.getElementById('fileImport').value = '';
                                return;
                            }
                            
                            textes = imported.filter(item => 
                                item && 
                                typeof item.id === 'number' &&
                                typeof item.contenu === 'string' &&
                                item.reponses &&
                                typeof item.reponses.origine === 'string' &&
                                typeof item.reponses.theme === 'string' &&
                                typeof item.reponses.these === 'string' &&
                                typeof item.reponses.interet === 'string' &&
                                typeof item.reponses.problematique === 'string'
                            );
                        } else {
                            textes = imported;
                        }
                        
                        textes = textes.map(texte => {
                            return {
                                ...texte,
                                contenu: texte.contenu.replace(/\s+/g, ' ').trim()
                            };
                        });
                        
                        saveTextes();
                        updateUI();
                        showMessage(`✓ ${textes.length} textes importés`, 'success');
                    } else {
                        throw new Error('Format invalide');
                    }
                    
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('Erreur lors de l\'import');
                }
                
                document.getElementById('fileImport').value = '';
            };
            
            reader.readAsText(file);
        }
    </script>
</body>
