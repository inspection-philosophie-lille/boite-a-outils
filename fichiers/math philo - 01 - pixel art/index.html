<html lang="fr" >
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<link rel="icon" href="../../src/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>pixel art</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #ff0000;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        h2 {
            text-align: center;
            color: #000000;
            margin: 0 0 20px 0;
            font-size: 1.2em;
            font-weight: normal;
        }
        .controls {
            padding: 2vh;
            margin-bottom: 2vh;
            text-align: center;
            max-width: 90%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2vw;
        }
        #canvas {
            max-width: 80vw;
            max-height: 60vh;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: block;
        }
        /* Styles neumorphic pour les boutons */
        .button {
            padding: 0;
            border: none;
            border-radius: 20px;
            background: #e0e5ec;
            cursor: pointer;
            font-weight: bold;
            color: red;
            transition: all 0.2s ease-in-out;
            box-shadow:  6px 6px 12px #bebebe,
                        -6px -6px 12px #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 70px;
            height: 30px;
        }
        .button:hover {
            box-shadow:  4px 4px 8px #bebebe,
                        -4px -4px 8px #ffffff;
        }
        .button:active {
            box-shadow: inset 4px 4px 8px #bebebe,
                        inset -4px -4px 8px #ffffff;
        }
        /* Icône pour le bouton charger */
        #uploadLabel::before {
            content: '\1F4F7';
            font-size: 1.5em;
        }
        /* Icône pour le bouton reset */
        #resetButton::before {
            content: '\21BB';
            font-size: 2.5em;
            padding-bottom: 6px;
        }
        
        /* CORRECTION : Input file complètement fonctionnel */
        #imageInput {
            display: none; /* On garde display: none mais on va le rendre fonctionnel autrement */
        }
        
        .potentiometer-container {
            position: relative;
            width: 12vw;
            height: 12vw;
            max-width: 120px;
            max-height: 120px;
            min-width: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .potentiometer-shadow {
            position: absolute;
            width: 10vw;
            height: 10vw;
            max-width: 100px;
            max-height: 100px;
            min-width: 80px;
            min-height: 80px;
            border-radius: 50%;
            box-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.3),
                -4px -4px 8px rgba(255, 255, 255, 0.5);
            bottom:2px
        }
        
        #potentiometer {
            width: 10vw;
            height: 10vw;
            max-width: 100px;
            max-height: 100px;
            min-width: 80px;
            min-height: 80px;
            border-radius: 50%;
            background: 
                linear-gradient(145deg, #d0d5db, #ffffff);
            border: 3px solid #a0a7af;
            box-shadow: 
                inset 2px 2px 4px rgba(255, 255, 255, 0.6),
                inset -2px -2px 4px rgba(100, 100, 100, 0.5);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
            transform-origin: 50% 50%;			
            bottom:-6px
        }
        #potentiometer:active {
            box-shadow: 
                inset 3px 3px 6px rgba(100, 100, 100, 0.6),
                inset -3px -3px 6px rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
        #potentiometer::before {
            content: '';
            position: absolute;
            width: 0.8vw;
            height: 2vw;
            max-width: 8px;
            max-height: 20px;
            background: red;
            border-radius: 2px;
            top: 0.5vw;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .graduations {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .graduations div {
            position: absolute;
            background: #a0a7af;
            width: 2px;
            height: 10px;
            transform-origin: 50% 50%;
            left: 50%;
            top: 50%;
        }
        .graduations .grad-0 { transform: rotate(0deg) translateY(-65px); }
        .graduations .grad-1 { transform: rotate(30deg) translateY(-65px); }
        .graduations .grad-2 { transform: rotate(60deg) translateY(-65px); }
        .graduations .grad-3 { transform: rotate(90deg) translateY(-65px); }
        .graduations .grad-4 { transform: rotate(120deg) translateY(-65px); }
        .graduations .grad-5 { transform: rotate(150deg) translateY(-65px); }
        .graduations .grad-6 { transform: rotate(180deg) translateY(-65px); }
        .graduations .grad-7 { transform: rotate(210deg) translateY(-65px); }
        .graduations .grad-8 { transform: rotate(240deg) translateY(-65px); }
        .graduations .grad-9 { transform: rotate(270deg) translateY(-65px); }
        .graduations .grad-10 { transform: rotate(300deg) translateY(-65px); }
        .graduations .grad-11 { transform: rotate(330deg) translateY(-65px); }
        .message {
            color: #555;
            margin-top: 2vh;
            font-style: italic;
            font-size: 1em;
        }
        /* Styles pour le switch */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5em;
            height: 30px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 70px;
            height: 30px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e0e5ec;
            transition: .4s;
            border-radius: 28px;
            box-shadow:  6px 6px 12px #bebebe,
                        -6px -6px 12px #ffffff;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #e0e5ec;
        }
        input:checked + .slider:before {
            transform: translateX(40px);
        }
        
        /* STYLES POUR L'ALIGNEMENT DES BOUTONS */
        .buttons-group {
            display: flex;
            align-items: center;
            gap: 1vw;
            order: 1;
        }
        
        .potentiometer-group {
            order: 2;
            margin-left: 2vw;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            h2 {
                font-size: 1em;
            }
            .controls {
                padding: 1.5vh;
                flex-direction: column;
                align-items: center;
                gap: 1.5vw;
            }
            .button {
                width: 70px;
                height: 30px;
            }
            .potentiometer-container {
                width: 15vw;
                height: 15vw;
                min-width: 100px;
                min-height: 100px;
                max-width: 120px;
                max-height: 120px;
            }
            .potentiometer-shadow {
                width: 13vw;
                height: 13vw;
                min-width: 80px;
                min-height: 80px;
                max-width: 100px;
                max-height: 100px;
            }
            #potentiometer {
                width: 13vw;
                height: 13vw;
                min-width: 80px;
                min-height: 80px;
                max-width: 100px;
                max-height: 100px;
            }
            #potentiometer::before {
                width: 1.5vw;
                height: 3vw;
                max-width: 6px;
                max-height: 15px;
            }
            .graduations div {
                width: 1.5px;
                height: 8px;
            }
            .graduations .grad-0 { transform: rotate(0deg) translateY(-50px); }
            .graduations .grad-1 { transform: rotate(30deg) translateY(-50px); }
            .graduations .grad-2 { transform: rotate(60deg) translateY(-50px); }
            .graduations .grad-3 { transform: rotate(90deg) translateY(-50px); }
            .graduations .grad-4 { transform: rotate(120deg) translateY(-50px); }
            .graduations .grad-5 { transform: rotate(150deg) translateY(-50px); }
            .graduations .grad-6 { transform: rotate(180deg) translateY(-50px); }
            .graduations .grad-7 { transform: rotate(210deg) translateY(-50px); }
            .graduations .grad-8 { transform: rotate(240deg) translateY(-50px); }
            .graduations .grad-9 { transform: rotate(270deg) translateY(-50px); }
            .graduations .grad-10 { transform: rotate(300deg) translateY(-50px); }
            .graduations .grad-11 { transform: rotate(330deg) translateY(-50px); }
            
            .buttons-group {
                order: 2;
                flex-direction: row;
                gap: 2vw;
                margin-left: 0;
                margin-top: 2vh;
            }
            
            .potentiometer-group {
                order: 1;
                margin-left: 0;
            }
        }
        @media (min-width: 1200px) {
            h1 {
                font-size: 3em;
            }
            h2 {
                font-size: 1.5em;
            }
            .button {
                width: 70px;
                height: 30px;
            }
            .potentiometer-container {
                width: 14vw;
                height: 14vw;
                max-width: 120px;
                max-height: 120px;
            }
            .potentiometer-shadow {
                width: 12vw;
                height: 12vw;
                max-width: 100px;
                max-height: 100px;
            }
            #potentiometer {
                width: 12vw;
                height: 12vw;
                max-width: 100px;
                max-height: 100px;
            }
            #potentiometer::before {
                width: 1vw;
                height: 2.5vw;
                max-width: 10px;
                max-height: 25px;
            }
        }
    </style>
</head>
<body>
    <h1>pixel art</h1>
    <h2>la réalité et sa représentation</h2>
    <div class="controls">
        <div class="buttons-group">
            <!-- Label correctement lié à l'input -->
            <label for="imageInput" id="uploadLabel" class="button" aria-label="charger une image pour appliquer l'effet de pixellisation" title="Charger une image"></label>
            <input type="file" id="imageInput" accept="image/*">
            
            <div class="switch-container">
                <label class="switch" id="switchLabel" title="0% de pixellisation">
                    <input type="checkbox" id="startMaxSwitch" aria-label="démarrer avec pixellisation maximale (100%) ou minimale (0%)">
                    <span class="slider"></span>
                </label>
            </div>
            
            <button id="resetButton" class="button" aria-label="réinitialiser l'image à la pixellisation minimale" title="Réinitialiser l'image"></button>
        </div>
        
        <div class="potentiometer-group">
            <div class="potentiometer-container">
                <div class="potentiometer-shadow"></div>
                <div id="potentiometer" role="slider" aria-label="contrôle de pixellisation, glissez pour ajuster, clic gauche/tap pour augmenter, clic droit/double tap pour diminuer" aria-valuemin="1" aria-valuemax="50" aria-valuenow="1"></div>
                <div class="graduations">
                    <div class="grad-0"></div><div class="grad-1"></div><div class="grad-2"></div>
                    <div class="grad-3"></div><div class="grad-4"></div><div class="grad-5"></div>
                    <div class="grad-6"></div><div class="grad-7"></div><div class="grad-8"></div>
                    <div class="grad-9"></div><div class="grad-10"></div><div class="grad-11"></div>
                </div>
            </div>
        </div>
    </div>
    <canvas id="canvas" aria-label="zone d'affichage de l'image pixellisée"></canvas>
    <p id="defaultMessage" class="message">veuillez charger une image pour commencer.</p>

    <script>
        const imageInput = document.getElementById('imageInput');
        const potentiometer = document.getElementById('potentiometer');
        const resetButton = document.getElementById('resetButton');
        const startMaxSwitch = document.getElementById('startMaxSwitch');
        const switchLabel = document.getElementById('switchLabel');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const defaultMessage = document.getElementById('defaultMessage');

        let originalImage = new Image();
        let pixelationLevel = 1;
        const pixelationSteps = Array.from({length: 50}, (_, i) => i + 1);
        let currentStepIndex = 0;
        let rotationAngle = 0;
        let isDragging = false;

        // Fonction pour mettre à jour le titre du switch
        function updateSwitchTitle() {
            if (startMaxSwitch.checked) {
                switchLabel.title = "100% de pixellisation";
            } else {
                switchLabel.title = "0% de pixellisation";
            }
        }

        // Initialiser le titre du switch
        updateSwitchTitle();
        startMaxSwitch.addEventListener('change', updateSwitchTitle);

        // CORRECTION : Gestion robuste du chargement d'image
        imageInput.addEventListener('change', function(e) {
            console.log('Input file changé');
            const file = e.target.files[0];
            
            if (!file) {
                console.log('Aucun fichier sélectionné');
                return;
            }

            console.log('Fichier sélectionné:', file.name, 'Type:', file.type);

            // Vérification que c'est bien une image
            if (!file.type.startsWith('image/')) {
                alert('Veuillez sélectionner un fichier image valide (JPEG, PNG, etc.)');
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(event) {
                console.log('FileReader a chargé le fichier');
                
                originalImage.onload = function() {
                    console.log('Image chargée avec succès. Dimensions:', originalImage.width, 'x', originalImage.height);
                    
                    // Redimensionner le canvas pour qu'il s'adapte à l'image
                    const maxWidth = window.innerWidth * 0.8;
                    const maxHeight = window.innerHeight * 0.6;
                    
                    let canvasWidth = originalImage.width;
                    let canvasHeight = originalImage.height;
                    
                    // Ajuster la taille si l'image est trop grande
                    if (canvasWidth > maxWidth || canvasHeight > maxHeight) {
                        const ratio = Math.min(maxWidth / canvasWidth, maxHeight / canvasHeight);
                        canvasWidth = Math.floor(canvasWidth * ratio);
                        canvasHeight = Math.floor(canvasHeight * ratio);
                    }
                    
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    
                    defaultMessage.style.display = 'none';
                    
                    // Appliquer le niveau de pixellisation initial
                    if (startMaxSwitch.checked) {
                        currentStepIndex = 49;
                        pixelationLevel = pixelationSteps[currentStepIndex];
                        rotationAngle = currentStepIndex * 7.2;
                    } else {
                        currentStepIndex = 0;
                        pixelationLevel = pixelationSteps[currentStepIndex];
                        rotationAngle = 0;
                    }
                    
                    potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
                    potentiometer.setAttribute('aria-valuenow', pixelationLevel);
                    applyPixelation();
                };
                
                originalImage.onerror = function() {
                    console.error('Erreur lors du chargement de l\'image dans l\'objet Image');
                    defaultMessage.textContent = 'Erreur : format d\'image non supporté';
                    defaultMessage.style.display = 'block';
                };
                
                // Cette ligne déclenche le chargement réel de l'image
                originalImage.src = event.target.result;
            };
            
            reader.onerror = function() {
                console.error('Erreur FileReader');
                defaultMessage.textContent = 'Erreur : impossible de lire le fichier';
                defaultMessage.style.display = 'block';
            };
            
            reader.readAsDataURL(file);
        });

        // CORRECTION : Ajout d'un gestionnaire de clic alternatif pour le label
        document.getElementById('uploadLabel').addEventListener('click', function(e) {
            // Forcer l'ouverture du sélecteur de fichiers
            imageInput.click();
        });

        // Le reste du code JavaScript reste inchangé
        originalImage.onerror = function() {
            console.error('Erreur générale de chargement d\'image');
            defaultMessage.textContent = 'Erreur : impossible de charger l\'image';
            defaultMessage.style.display = 'block';
        };

        // Gérer les clics et doubles taps sur le potentiomètre
        potentiometer.addEventListener('click', function(e) {
            e.preventDefault();
            if (e.button === 0 && !isDragging) {
                currentStepIndex = (currentStepIndex + 1) % pixelationSteps.length;
                rotationAngle = (rotationAngle + 7.2) % 360;
                potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
                pixelationLevel = pixelationSteps[currentStepIndex];
                potentiometer.setAttribute('aria-valuenow', pixelationLevel);
                applyPixelation();
            }
        });

        potentiometer.addEventListener('dblclick', function(e) {
            e.preventDefault();
            currentStepIndex = (currentStepIndex - 1 + pixelationSteps.length) % pixelationSteps.length;
            rotationAngle = (rotationAngle - 7.2 + 360) % 360;
            potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
            pixelationLevel = pixelationSteps[currentStepIndex];
            potentiometer.setAttribute('aria-valuenow', pixelationLevel);
            applyPixelation();
        });

        potentiometer.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            currentStepIndex = (currentStepIndex - 1 + pixelationSteps.length) % pixelationSteps.length;
            rotationAngle = (rotationAngle - 7.2 + 360) % 360;
            potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
            pixelationLevel = pixelationSteps[currentStepIndex];
            potentiometer.setAttribute('aria-valuenow', pixelationLevel);
            applyPixelation();
        });

        // Gérer le drag-and-drop
        let startAngle = 0;
        potentiometer.addEventListener('mousedown', startDragging);
        potentiometer.addEventListener('touchstart', startDragging, { passive: false });

        function startDragging(e) {
            e.preventDefault();
            isDragging = true;
            const rect = potentiometer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI - rotationAngle;
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const rect = potentiometer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const angle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
            let newAngle = angle - startAngle;
            newAngle = (newAngle + 360) % 360;
            newAngle = Math.round(newAngle / 7.2) * 7.2;
            rotationAngle = newAngle;
            currentStepIndex = Math.round(newAngle / 7.2) % 50;
            pixelationLevel = pixelationSteps[currentStepIndex];
            potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
            potentiometer.setAttribute('aria-valuenow', pixelationLevel);
            applyPixelation();
        }

        document.addEventListener('mouseup', stopDragging);
        document.addEventListener('touchend', stopDragging);

        function stopDragging() {
            isDragging = false;
        }

        // Réinitialiser l'image
        resetButton.addEventListener('click', function() {
            if (startMaxSwitch.checked) {
                currentStepIndex = 49;
                rotationAngle = 49 * 7.2;
            } else {
                currentStepIndex = 0;
                rotationAngle = 0;
            }
            pixelationLevel = pixelationSteps[currentStepIndex];
            potentiometer.style.transform = `rotate(${rotationAngle}deg)`;
            potentiometer.setAttribute('aria-valuenow', pixelationLevel);
            applyPixelation();
        });

        // Appliquer l'effet de pixellisation
        function applyPixelation() {
            if (!originalImage.src || originalImage.width === 0 || originalImage.height === 0) {
                console.warn('Image non disponible pour la pixellisation');
                return;
            }

            console.log('Application de la pixellisation, niveau:', pixelationLevel);
            
            // Redessiner l'image originale sur le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

            if (pixelationLevel > 1) {
                const pixelSize = Math.max(1, Math.floor(Math.min(canvas.width, canvas.height) * (pixelationLevel / 100)));
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                for (let y = 0; y < canvas.height; y += pixelSize) {
                    for (let x = 0; x < canvas.width; x += pixelSize) {
                        let sumR = 0, sumG = 0, sumB = 0, sumA = 0;
                        let count = 0;
                        
                        for (let dy = 0; dy < pixelSize && y + dy < canvas.height; dy++) {
                            for (let dx = 0; dx < pixelSize && x + dx < canvas.width; dx++) {
                                const pixelIndex = ((y + dy) * canvas.width + (x + dx)) * 4;
                                sumR += data[pixelIndex];
                                sumG += data[pixelIndex + 1];
                                sumB += data[pixelIndex + 2];
                                sumA += data[pixelIndex + 3];
                                count++;
                            }
                        }
                        
                        const avgR = Math.floor(sumR / count);
                        const avgG = Math.floor(sumG / count);
                        const avgB = Math.floor(sumB / count);
                        const avgA = Math.floor(sumA / count);

                        for (let dy = 0; dy < pixelSize && y + dy < canvas.height; dy++) {
                            for (let dx = 0; dx < pixelSize && x + dx < canvas.width; dx++) {
                                const pixelIndex = ((y + dy) * canvas.width + (x + dx)) * 4;
                                data[pixelIndex] = avgR;
                                data[pixelIndex + 1] = avgG;
                                data[pixelIndex + 2] = avgB;
                                data[pixelIndex + 3] = avgA;
                            }
                        }
                    }
                }
                
                ctx.putImageData(imageData, 0, 0);
            }
        }

        // Afficher un message si le canvas est vide au chargement
        if (!originalImage.src) {
            defaultMessage.textContent = 'veuillez charger une image pour commencer.';
            defaultMessage.style.display = 'block';
        }
    </script>
</body>
